  panel_7d: "هفت‌روزه"
  panel_1m: "یک‌ماهه"
  serial_1_50: "سریال ۱ تا ۵۰"
  serial_51_200: "سریال ۵۱ تا ۲۰۰"
  sales_agent: "عامل فروش"
