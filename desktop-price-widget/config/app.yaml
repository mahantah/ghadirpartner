api:
  base_url: "https://ghadirpartner.ir/partners/"
  request_timeout_ms: 10000
  endpoints:
    login: "api/login"
    logout: "api/logout"
    me: "api/me"
    catalog: "api/catalog"

refresh:
  interval_seconds: 30

ui:
  title: "قیمت زنده قدیر پارتنر"
  window_width: 460
  window_height: 680\n  compact_width: 380\n  compact_height: 530\n  start_compact: true\n  auto_start_on_install: true\n  edge_margin: 12
  always_on_top: true
  hide_zero_prices: true

notifications:
  price_changes: true

price_labels:
