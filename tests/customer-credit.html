<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><section id="dashboard"></section><section id="newOrder"><div class="card"></div></section><output id="result">PENDING</output><script>
let fixture={enabled:true,limit:100000000,monthly_used:0,outstanding:30000000,reserved:0,available:70000000,month:'1405/08',credit_commitment:'متن تعهد نمونه',credit_commitment_sha256:'synthetic-revision'};let posted=null;let ownReads=0;
async function req(path,options){if(options?.body){posted=JSON.parse(options.body);fixture={...fixture,...posted};return fixture}return fixture}
async function api(path,options){if(path!=='/api/customer-credit')throw Error('customer identity leaked');ownReads++;return req(path,options)}
</script><script src="../assets/customer-credit.js"></script><script>
window.addEventListener('load',async()=>{const check=(v,m)=>{if(!v)throw Error(m)};try{
 await window.gpCustomerCredit.open(7);let dialog=document.querySelector('dialog');check(dialog.open,'dialog not opened');check(dialog.textContent.includes('اعتبار ماهانه مشتری'),'settings title missing');dialog.querySelector('#gp-credit-enabled').checked=false;dialog.querySelector('#gp-credit-limit').value='200000000';dialog.querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await new Promise(r=>setTimeout(r,50));check(posted.id===7&&posted.enabled===false&&posted.limit===200000000,'manager settings changed');check(!dialog.open,'successful save did not close');
 fixture={...fixture,enabled:true,available:70000000};document.body.classList.add('customer-mode');window.gpCustomerCredit=new CustomerCreditFacade(new CreditClient(true),new CreditView());await window.gpCustomerCredit.refresh();check(ownReads===1,'customer own balance not requested');check(document.querySelector('#gp-credit-balance').textContent.includes('۷۰٬۰۰۰٬۰۰۰'),'remaining credit missing');check(document.querySelector('#gp-credit-purchase input[type=radio]'),'credit purchase choice missing');
 try{window.gpCustomerCredit.settlement('credit');throw Error('unaccepted commitment allowed')}catch(e){check(!e.message.includes('unaccepted'),'commitment bypass')}
 document.querySelector('#gp-credit-consent').checked=true;check(window.gpCustomerCredit.settlement('credit').commitment_sha256==='synthetic-revision','wrong commitment revision');check(window.gpCustomerCredit.settlement('cash')===undefined,'cash changed');
 fixture={...fixture,enabled:false,available:0};await window.gpCustomerCredit.refresh();check(document.querySelector('#gp-credit-purchase input[type=radio]').disabled,'disabled credit still selectable');check(document.querySelectorAll('#gp-credit-balance').length===1,'duplicate card');check(document.documentElement.scrollWidth<=innerWidth,'horizontal overflow');document.getElementById('result').textContent='CUSTOMER_CREDIT_PASS';
}catch(e){document.getElementById('result').textContent='CUSTOMER_CREDIT_FAIL '+e.message}});
</script></html>
