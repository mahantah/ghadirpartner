          "insert": "/* Selected carton export is read-only and uses the same inventory export roles. */\nif($p==='/export/carton-serials.xlsx'){\n auth(['admin','sales','prep','viewer']);\n $raw=trim((string)($_POST['carton_ids']??$_GET['carton_ids']??''));\n $ids=array_values(array_unique(array_filter(array_map('intval',preg_split('/[,\\s]+/',$raw)),static fn($id)=>$id>0)));\n if(!$ids)fail('حداقل یک کارتن انتخاب کنید');\n $rows=db(false,function($s)use($ids){\n  $selected=array_fill_keys($ids,true);$valid=[];$codes=[];\n  foreach($s['cartons']??[] as $carton){\n   $id=(int)($carton['id']??0);if(!isset($selected[$id]))continue;\n   $valid[$id]=true;$code=strtoupper(trim((string)($carton['code']??'')));if($code!=='')$codes[$code]=true;\n  }\n  $rows=[];$seen=[];\n  foreach($s['inventory']??[] as $iv){\n   $id=(int)($iv['carton_id']??0);$code=strtoupper(trim((string)($iv['carton_code']??'')));\n   if(!isset($valid[$id])&&!isset($codes[$code]))continue;\n   $serial=trim((string)($iv['serial']??''));$key=strtoupper($serial);\n   if($serial===''||isset($seen[$key]))continue;\n   $seen[$key]=true;$rows[]=[$serial];\n  }\n  return $rows;\n });\n if(!$rows)fail('برای کارتن‌های انتخاب‌شده سریالی پیدا نشد',404);\n xlsx_out('selected-carton-serials.xlsx',$rows);\n}\n\n"
