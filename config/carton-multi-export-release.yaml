          "offset": 201645,
          "delete": 0,
          "insert": "const GP_CARTON_EXPORT_SELECTION=new Set();\n/** Keep carton selections across filters while discarding cartons removed on refresh. */\nfunction gpUpdateCartonExportSelection(){\n const existing=new Set((WH.cartons||[]).map(c=>Number(c.id)));\n GP_CARTON_EXPORT_SELECTION.forEach(id=>{if(!existing.has(id))GP_CARTON_EXPORT_SELECTION.delete(id);});\n const visible=Array.from(document.querySelectorAll('#warehouseBody .gp-carton-export-select'));\n visible.forEach(el=>{el.checked=GP_CARTON_EXPORT_SELECTION.has(Number(el.value));});\n const checked=visible.filter(el=>el.checked).length,all=document.getElementById('gpCartonExportSelectVisible');\n if(all){all.checked=visible.length>0&&checked===visible.length;all.indeterminate=checked>0&&checked<visible.length;all.disabled=!visible.length;}\n const button=document.getElementById('gpCartonExportExcel');\n if(button){const disabled=!GP_CARTON_EXPORT_SELECTION.size,label='اکسل سریال کارتن‌های انتخابی ('+GP_CARTON_EXPORT_SELECTION.size.toLocaleString('fa-IR')+')';if(button.disabled!==disabled)button.disabled=disabled;if(button.textContent!==label)button.textContent=label;}\n}\n/** Select the carton rather than requiring its individual serial window. */\nfunction gpSelectCartonForExport(id,selected){\n id=Number(id);if(!Number.isSafeInteger(id)||id<1)return;\n if(selected)GP_CARTON_EXPORT_SELECTION.add(id);else GP_CARTON_EXPORT_SELECTION.delete(id);\n gpUpdateCartonExportSelection();\n}\n/** Apply select-all only to rows currently visible through the warehouse filter. */\nfunction gpSelectVisibleCartonsForExport(selected){\n document.querySelectorAll('#warehouseBody .gp-carton-export-select').forEach(el=>{\n  const id=Number(el.value);if(selected)GP_CARTON_EXPORT_SELECTION.add(id);else GP_CARTON_EXPORT_SELECTION.delete(id);\n });\n gpUpdateCartonExportSelection();\n}\n/** Clear the carton selection independently from inventory and allocations. */\nfunction gpClearCartonExportSelection(){GP_CARTON_EXPORT_SELECTION.clear();gpUpdateCartonExportSelection();}\n/** POST carton identifiers to the existing authenticated server without URL length limits. */\nfunction gpDownloadSelectedCartonSerials(){\n gpUpdateCartonExportSelection();if(!GP_CARTON_EXPORT_SELECTION.size)return;\n const form=document.createElement('form');form.method='POST';form.action='/export/carton-serials.xlsx';form.hidden=true;\n const input=document.createElement('input');input.type='hidden';input.name='carton_ids';input.value=Array.from(GP_CARTON_EXPORT_SELECTION).join(',');form.appendChild(input);\n document.body.appendChild(form);form.submit();form.remove();\n}\n\n"
