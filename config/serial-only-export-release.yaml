          "offset": 23940,
          "delete": 0,
          "insert": "/** Keep selection scoped to the currently open carton, including allocated serials. */\nfunction gpWarehouseSerialExportUrl(){\n  const ids=Array.from(document.querySelectorAll('#modalbody .gp-carton-serial-select:checked'))\n    .map(el=>Number(el.value)).filter(id=>Number.isSafeInteger(id)&&id>0);\n  return ids.length?'/export/selected-serials.xlsx?serial_only=1&ids='+encodeURIComponent(Array.from(new Set(ids)).join(',')):'';\n}\n/** Synchronize the action count and select-all state after each selection. */\nfunction gpUpdateWarehouseSerialSelection(){\n  const rows=Array.from(document.querySelectorAll('#modalbody .gp-carton-serial-select:not(:disabled)'));\n  const count=rows.filter(el=>el.checked).length;\n  const all=document.getElementById('gpWarehouseSerialSelectAll');\n  if(all){all.checked=rows.length>0&&count===rows.length;all.indeterminate=count>0&&count<rows.length;all.disabled=!rows.length;}\n  const button=document.getElementById('gpWarehouseSerialExport');\n  if(button){button.disabled=!count;button.textContent='خروجی اکسل انتخاب‌شده‌ها ('+count.toLocaleString('fa-IR')+')';}\n}\n/** Select or clear only the serials belonging to the open carton. */\nfunction gpToggleWarehouseSerialSelection(checked){\n  document.querySelectorAll('#modalbody .gp-carton-serial-select:not(:disabled)').forEach(el=>{el.checked=checked;});\n  gpUpdateWarehouseSerialSelection();\n}\n/** Download through the existing authenticated export route without changing inventory. */\nfunction gpExportWarehouseSelectedSerials(){\n  const url=gpWarehouseSerialExportUrl();\n  if(url)window.location.href=url;\n}\n\n"
