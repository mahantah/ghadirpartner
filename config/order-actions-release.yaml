دها را بررسی کنید\";\n            }\n        }\n        /** Show exact serials and a final stock-effect confirmation before any POST. */\n        review(plan) {\n            this.element(\"#gp-partial-error\").hidden = true;\n            this.element(\"form\").hidden = true;\n            const review = this.element(\"#gp-partial-review\");\n            review.hidden = false;\n            review.innerHTML = `<h4>تأیید خروج ${this.fa(plan.total)} دستگاه</h4><p>فقط سریال‌های زیر خارج می‌شوند. ${this.fa(plan.remaining)} دستگاه از بار باقی می‌ماند و تسویه تغییری نمی‌کند.</p>${plan.body.items.map((item) => `<section><h4>${this.escape(item.product)} • ${this.fa(item.qty)} دستگاه</h4><p class=\"gp-partial-serials\" dir=\"ltr\">${item.serials.map((serial) => this.escape(serial)).join(\"، \")}</p></section>`).join(\"\")}<footer><button class=\"btn2\" type=\"button\" data-action=\"confirm\">تأیید و ثبت خروج</button><button class=\"btnlight\" type=\"button\" data-action=\"back\">ویرایش تعدادها</button></footer>`;\n            review.focus();\n        }\n        /** Restore editing only before an attempt could have committed on the server. */\n        edit() {\n            this.element(\"#gp-partial-review\").hidden = true;\n            this.element(\"form\").hidden = false;\n            this.element(\"input:not([disabled])\").focus();\n        }\n        /** Keep confirmation and closure disabled while a stock write is in flight. */\n        busy(value, attempted) {\n            this.dialog.setAttribute(\"aria-busy\", String(value));\n            this.dialog\n                .querySelectorAll(\"button\")\n                .forEach((button) => {\n                button.disabled =\n                    value || (attempted && button.dataset.action === \"back\");\n            });\n        }\n        /** Render server errors as text, never HTML or a successful stock confirmation. */\n        error(error) {\n            const box = this.element(\"#gp-partial-error\");\n            box.hidden = false;\n            box.textContent =\n                error instanceof Error\n                    ? error.message\n                    : \"ثبت تحویل جزئی ناموفق بود؛ سفارش را تازه‌سازی کنید\";\n            box.focus();\n        }\n        /** Close the native focus trap and restore a useful position in the orders screen. */\n        close() {\n            this.dialog.close();\n            this.dialog.remove();\n            if (this.previous?.isConnected && this.previous !== document.body)\n                this.previous.focus();\n            else\n                document.getElementById(\"osearch\")?.focus();\n        }\n    }\n    /** The only public facade: permissions, a fresh read, a frozen preview and one idempotent submit. */\n    class PartialDeliveryFacade {\n        /** Inject pure policy and authenticated transport separately. */\n        constructor(policy, client) {\n            this.policy = policy;\n            this.client = client;\n            this.active = null;\n            this.opening = false;\n        }\n        /** Expose the management action only for an eligible physical order. */\n        canOpen(id) {\n            const raw = ORD.find((value) => {\n                try {\n                    return JsonReader.record(value).id === id;\n                }\n                catch {\n                    return false;\n                }\n            });\n            return (raw !== undefined &&\n                this.policy.permits(JsonReader.record(raw), has(\"admin\")));\n        }\n        /** Load a current, minimal order snapshot before creating any delivery plan. */\n        async open(id) {\n            if (this.opening || this.active)\n                return;\n            if (!this.canOpen(id)) {\n                toast(\"مجوز تحویل جزئی برای این سفارش ندارید\");\n                return;\n            }\n            this.opening = true;\n            try {\n                const order = await this.client.read(id);\n                if (order.id !== id || !this.policy.permits(order.raw, has(\"admin\")))\n                    throw new Error(\"سفارش دیگر در مرحلهٔ مجاز تحویل جزئی نیست\");\n                const view = new DeliveryView(order, this.policy);\n                this.active = view;\n                const bytes = crypto.getRandomValues(new Uint8Array(16));\n                const identity = Array.from(bytes, (value) => value.toString(16).padStart(2, \"0\")).join(\"\");\n                let pending = null, saving = false, attempted = false;\n                const close = () => {\n                    if (!saving) {\n                        view.close();\n                        this.active = null;\n                    }\n                };\n                view.dialog.addEventListener(\"cancel\", (event) => {\n                    event.preventDefault();\n                    close();\n                });\n                view.dialog.addEventListener(\"input\", () => view.totals());\n                view.dialog.addEventListener(\"change\", () => view.carrier());\n                view\n                    .element(\"form\")\n                    .addEventListener(\"submit\", (event) => {\n                    event.preventDefault();\n                    try {\n                        pending = this.policy.plan(order, view.element(\"form\"), identity);\n                        view.review(pending);\n                    }\n                    catch (error) {\n                        view.error(error);\n                    }\n                });\n                view.dialog.addEventListener(\"click\", (event) => {\n                    if (!(event.target instanceof Element))\n                        return;\n                    const action = event.target.closest(\"[data-action]\")?.dataset\n                        .action;\n                    if (action === \"close\")\n                        close();\n                    if (saving)\n                        return;\n                    if (action === \"third\")\n                        view.third();\n                    if (action === \"back\" && !attempted) {\n                        pending = null;\n                        view.edit();\n                    }\n                    if (action === \"confirm\" && pending) {\n                        const plan = pending;\n                        saving = true;\n                        attempted = true;\n                        view.busy(true, attempted);\n                        void this.client\n                            .dispatch(plan)\n                            .then(async () => {\n                            saving = false;\n                            close();\n                            toast(`خروج ${plan.total.toLocaleString(\"fa-IR\")} دستگاه ثبت شد؛ ماندهٔ بار و تسویه محفوظ است`);\n                            try {\n                                await refresh();\n                            }\n                            catch {\n                                toast(\"خروج ثبت شد؛ فهرست سفارش‌ها را دوباره تازه‌سازی کنید\");\n                            }\n                        })\n                            .catch((error) => {\n                            saving = false;\n                            view.busy(false, attempted);\n                            view.error(error);\n                        });\n                    }\n                });\n                view.show();\n            }\n            catch (error) {\n                this.active?.close();\n                this.active = null;\n                toast(error instanceof Error ? error.message : \"دریافت سفارش ناموفق بود\");\n            }\n            finally {\n                this.opening = false;\n            }\n        }\n    }\n    window.gpPartialDelivery = new PartialDeliveryFacade(new DeliveryPolicy(GP_WEB_PARTIAL_POLICY), new DeliveryClient());\n})();\n",
