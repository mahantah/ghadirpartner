f (action === \"third\")\n                        view.third();\n                    if (action === \"back\" && !attempted) {\n                        pending = null;\n                        view.edit();\n                    }\n                    if (action === \"confirm\" && pending) {\n                        const plan = pending;\n                        saving = true;\n                        attempted = true;\n                        view.busy(true, attempted);\n                        void this.client\n                            .dispatch(plan)\n                            .then(async () => {\n                            saving = false;\n                            close();\n                            toast(`خروج ${plan.total.toLocaleString(\"fa-IR\")} دستگاه ثبت شد؛ ماندهٔ بار و تسویه محفوظ است`);\n                            try {\n                                await refresh();\n                            }\n                            catch {\n                                toast(\"خروج ثبت شد؛ فهرست سفارش‌ها را دوباره تازه‌سازی کنید\");\n                            }\n                        })\n                            .catch((error) => {\n                            saving = false;\n                            view.busy(false, attempted);\n                            view.error(error);\n                        });\n                    }\n                });\n                view.show();\n            }\n            catch (error) {\n                this.active?.close();\n                this.active = null;\n                toast(error instanceof Error ? error.message : \"دریافت سفارش ناموفق بود\");\n            }\n            finally {\n                this.opening = false;\n            }\n        }\n    }\n    window.gpPartialDelivery = new PartialDeliveryFacade(new DeliveryPolicy(GP_WEB_PARTIAL_POLICY), new DeliveryClient());\n})();\n",
      "new": "/* Generated by scripts/build-web-partial-delivery.py; edit the typed source. */\nconst GP_WEB_PARTIAL_POLICY = {\"carriers\": [\"پیک\", \"تیپاکس\", \"چاپار\", \"ماهکس\", \"ترمینال\", \"حضوری\"], \"maximum_quantity\": 999, \"maximum_reason_bytes\": 2400, \"ready_statuses\": [\"در حال آماده سازی\", \"آماده ارسال\", \"ارسال شد\"], \"tracking_carriers\": [\"تیپاکس\", \"چاپار\", \"ماهکس\"]};\n\"use strict\";\n(() => {\n    /** Decode only explicitly supported JSON fields at the old application's boundary. */\n    class JsonReader {\n        /** Reject non-object transport data instead of interpreting it as an order. */\n        static record(value) {\n            if (typeof value !== \"object\" || value === null || Array.isArray(value))\n                throw new Error(\"اطلاعات سفارش معتبر نیست\");\n            return value;\n        }\n        /** Keep optional arrays safe without introducing untyped values. */\n        static list(value) {\n            return Array.isArray(value) ? value : [];\n        }\n        /** Read display strings without rendering arbitrary objects. */\n        static text(value) {\n            return typeof value === \"string\" ? value : \"\";\n        }\n        /** Accept only safe integer counts, not coercible user text. */\n        static integer(value) {\n            if (typeof value !== \"number\" || !Number.isSafeInteger(value))\n                throw new Error(\"تعداد سفارش معتبر نیست\");\n            return value;\n        }\n        /** Normalize serial identity once for preview and request matching. */\n        static serials(value) {\n            return this.list(value)\n                .map((v) => this.text(v).trim().toUpperCase())\n                .filter(Boolean);\n        }\n    }\n    /** One physical model with its shipped units and explicitly available unshipped serials. */\n    class DeliveryLine {\n        /** Preserve physical order totals independently from invoice purchase lines. */\n        constructor(product, quantity, sent, ready) {\n            this.product = product;\n            this.quantity = quantity;\n            this.sent = sent;\n            this.ready = ready;\n            this.remaining = quantity - sent;\n            if (!product ||\n                quantity < 1 ||\n                this.remaining < 0 ||\n                ready.length > this.remaining)\n                throw new Error(\"مقدار آماده یا خروج قبلی سفارش معتبر نیست\");\n        }\n    }\n    /** Pure snapshot of physical delivery; financial values are never recalculated here. */\n    class DeliveryOrder {\n        /** Deduplicate shipped serials across recorded exit groups and derive ready quantities. */\n        constructor(raw) {\n            this.raw = raw;\n            this.id = JsonReader.integer(raw.id);\n            this.number = JsonReader.text(raw.number);\n            this.customer = JsonReader.text(raw.customer_name);\n            this.payment = JsonReader.text(raw.payment_status);\n            const shipped = new Map();\n            for (const value of JsonReader.list(raw.exit_items)) {\n                const row = JsonReader.record(value), product = JsonReader.text(row.product);\n                const sent = shipped.get(product) ?? new Set();\n                for (const serial of JsonReader.serials(row.serials))\n                    sent.add(serial);\n                shipped.set(product, sent);\n            }\n            const products = new Set();\n            this.lines = JsonReader.list(raw.items).map((value) => {\n                const row = JsonReader.record(value), product = JsonReader.text(row.product);\n                if (products.has(product))\n                    throw new Error(\"ردیف فیزیکی تکراری است\");\n                products.add(product);\n                const sent = shipped.get(product) ?? new Set();\n                const ready = [...new Set(JsonReader.serials(row.serials))].filter((serial) => !sent.has(serial));\n                return new DeliveryLine