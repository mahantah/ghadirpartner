name: Deploy performance hotfix v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp php-cli nodejs curl

      - name: Download and back up live files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gp-perf-live /tmp/gp-perf-backup /tmp/gp-perf-verify
          mkdir -p /tmp/gp-perf-live/partners /tmp/gp-perf-backup/partners /tmp/gp-perf-verify/partners
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-perf-live/index.php
          get /app.html -o /tmp/gp-perf-live/app.html
          get /mobile.html -o /tmp/gp-perf-live/mobile.html
          get /partners/index.php -o /tmp/gp-perf-live/partners/index.php
          get /partners/portal.html -o /tmp/gp-perf-live/partners/portal.html
          get /.htaccess -o /tmp/gp-perf-live/.htaccess
          get /partners/.htaccess -o /tmp/gp-perf-live/partners/.htaccess
          bye
          EOF
          cp -a /tmp/gp-perf-live/. /tmp/gp-perf-backup/

      - name: Apply and validate performance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-performance-v1.py /tmp/gp-perf-live
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-live/index.php
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-live/app.html
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-live/mobile.html
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-live/partners/index.php
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-live/partners/portal.html
          ! grep -q 'setInterval(pollNotif,4000)' /tmp/gp-perf-live/app.html
          grep -q 'legacy supplier V4 MutationObserver/click hook disabled' /tmp/gp-perf-live/app.html
          grep -q 'supplier V5 whole-body observer removed' /tmp/gp-perf-live/app.html
          grep -q 'whole-body mobile observer removed' /tmp/gp-perf-live/app.html
          grep -q 'DirectoryIndex app.html index.php' /tmp/gp-perf-live/.htaccess
          grep -q 'DirectoryIndex portal.html index.php' /tmp/gp-perf-live/partners/.htaccess
          php -l /tmp/gp-perf-live/index.php
          php -l /tmp/gp-perf-live/partners/index.php
          node - /tmp/gp-perf-live/app.html /tmp/gp-perf-live/partners/portal.html /tmp/gp-perf-live/mobile.html <<'NODE'
          const fs=require('fs');
          for(const f of process.argv.slice(2)){
            const h=fs.readFileSync(f,'utf8'),re=/<script[^>]*>([\s\S]*?)<\/script>/gi;
            let m,n=0;
            while((m=re.exec(h))){if(!/\bsrc=/.test(m[0])){new Function(m[1]);n++;}}
            console.log(f,'JS OK',n);
          }
          NODE

      - name: Deploy optimized files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-perf-live/index.php -o /index.php
          put /tmp/gp-perf-live/app.html -o /app.html
          put /tmp/gp-perf-live/mobile.html -o /mobile.html
          put /tmp/gp-perf-live/partners/index.php -o /partners/index.php
          put /tmp/gp-perf-live/partners/portal.html -o /partners/portal.html
          put /tmp/gp-perf-live/.htaccess -o /.htaccess
          put /tmp/gp-perf-live/partners/.htaccess -o /partners/.htaccess
          bye
          EOF

      - name: Verify live files and health
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-perf-verify/index.php
          get /app.html -o /tmp/gp-perf-verify/app.html
          get /mobile.html -o /tmp/gp-perf-verify/mobile.html
          get /partners/index.php -o /tmp/gp-perf-verify/partners/index.php
          get /partners/portal.html -o /tmp/gp-perf-verify/partners/portal.html
          get /.htaccess -o /tmp/gp-perf-verify/.htaccess
          get /partners/.htaccess -o /tmp/gp-perf-verify/partners/.htaccess
          bye
          EOF
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-verify/index.php
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-verify/app.html
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-verify/partners/index.php
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' /tmp/gp-perf-verify/partners/portal.html
          cmp /tmp/gp-perf-live/index.php /tmp/gp-perf-verify/index.php
          cmp /tmp/gp-perf-live/app.html /tmp/gp-perf-verify/app.html
          cmp /tmp/gp-perf-live/mobile.html /tmp/gp-perf-verify/mobile.html
          cmp /tmp/gp-perf-live/partners/index.php /tmp/gp-perf-verify/partners/index.php
          cmp /tmp/gp-perf-live/partners/portal.html /tmp/gp-perf-verify/partners/portal.html
          cmp /tmp/gp-perf-live/.htaccess /tmp/gp-perf-verify/.htaccess
          cmp /tmp/gp-perf-live/partners/.htaccess /tmp/gp-perf-verify/partners/.htaccess
          curl -fsS --max-time 25 https://ghadirpartner.ir/healthz
          curl -fsS --max-time 25 https://ghadirpartner.ir/partners/healthz

      - name: Roll back on failure
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          test -f /tmp/gp-perf-backup/index.php || exit 0
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-perf-backup/index.php -o /index.php
          put /tmp/gp-perf-backup/app.html -o /app.html
          put /tmp/gp-perf-backup/mobile.html -o /mobile.html
          put /tmp/gp-perf-backup/partners/index.php -o /partners/index.php
          put /tmp/gp-perf-backup/partners/portal.html -o /partners/portal.html
          put /tmp/gp-perf-backup/.htaccess -o /.htaccess
          put /tmp/gp-perf-backup/partners/.htaccess -o /partners/.htaccess
          bye
          EOF
