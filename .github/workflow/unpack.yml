name: Unpack GhadirPay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack uploaded release
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -name 'GhadirPay-GitHub-*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "Release ZIP not found"
            exit 1
          fi

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          ROOT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          rsync -a "$ROOT"/ ./

          rm -f "$ZIP"

      - name: Commit extracted release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy GhadirPay release" || exit 0
          git push
