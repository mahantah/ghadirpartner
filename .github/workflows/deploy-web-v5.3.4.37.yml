name: Deploy Web V5.3.4.37 Performance + Followup + Bale Company

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli curl nodejs

      - name: Locate and validate release
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME="GhadirPartner-Web-V5.3.4.37-PERFORMANCE-FOLLOWUP-BALE-COMPANY.zip"
          BUNDLE_NAME="GhadirPartner-V5.3.4.37-GITHUB-BUNDLE.zip"
          ZIP="$(find . -type f -name "$RELEASE_NAME" -print -quit || true)"
          if [ -z "$ZIP" ]; then
            BUNDLE="$(find . -type f -name "$BUNDLE_NAME" -print -quit || true)"
            if [ -n "$BUNDLE" ]; then
              rm -rf /tmp/ghadir-bundle-v53437
              mkdir -p /tmp/ghadir-bundle-v53437
              unzip -q "$BUNDLE" -d /tmp/ghadir-bundle-v53437
              ZIP="$(find /tmp/ghadir-bundle-v53437 -type f -name "$RELEASE_NAME" -print -quit || true)"
            fi
          fi
          test -n "$ZIP" || { echo "::error::Release ZIP not found"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/ghadir-v53437
          mkdir -p /tmp/ghadir-v53437
          unzip -q "$ZIP" -d /tmp/ghadir-v53437
          ROOT=/tmp/ghadir-v53437

          grep -qx 'V5.3.4.37-PERFORMANCE-FOLLOWUP-BALE-COMPANY' "$ROOT/VERSION.txt"
          grep -q "/api/bootstrap" "$ROOT/index.php"
          grep -q "gp_run_v36_repair_once" "$ROOT/index.php"
          grep -q "static \$readCache" "$ROOT/lib/storage.php"
          grep -q "bp_customer_label" "$ROOT/bale/lib.php"
          grep -q "showPendingExitOrders" "$ROOT/assets/business-v53437.js"
          grep -q "business-v53437.js?v=53437" "$ROOT/app.html"
          grep -q "inventoryRowsHtml" "$ROOT/app.html"
          ! grep -q "setInterval(pollNotif,12000)" "$ROOT/app.html"

          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"
          php -l "$ROOT/lib/storage.php"
          php -l "$ROOT/bale/lib.php"
          php -l "$ROOT/bale/webhook.php"
          node --check "$ROOT/assets/business-v53437.js"
          node --check "$ROOT/assets/ops-v53434.js"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Protect production config and data
        env:
          ROOT: ${{ steps.rel.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -rf "$ROOT/storage" 2>/dev/null || true

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob backups/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /
          bye
          EOF

      - name: Health check
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/
          curl -sS --retry 2 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/bale/setup.php || true
