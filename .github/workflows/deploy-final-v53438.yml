name: Deploy Exact V5.3.4.38

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip patch lftp php-cli curl nodejs

      - name: Build exact V5.3.4.38 + warehouse/returns patch
        id: build
        shell: bash
        run: |
          set -euo pipefail
          BASE="GhadirPartner-Web-V5.3.4.38-FINAL-TOMAN-SESSION24H-HOMA-SERVICE.zip"
          test -f "$BASE"
          rm -rf /tmp/v53438 /tmp/delta
          mkdir -p /tmp/v53438 /tmp/delta
          unzip -q "$BASE" -d /tmp/v53438
          ROOT="$(find /tmp/v53438 -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [[ -z "$ROOT" || ! -f "$ROOT/index.php" ]]; then ROOT=/tmp/v53438; fi
          test "$(cat "$ROOT/VERSION.txt")" = "V5.3.4.38-INVENTORY-LAZY-API-FIX"
          cat > /tmp/delta.b64 <<'B64'
          
          B64
          base64 -d /tmp/delta.b64 > /tmp/delta.zip
          echo "1049c9416d452fc295f6b9d25026d9d432200e9e1ce3c81e04944b6fcb3f99a2  /tmp/delta.zip" | sha256sum -c -
          unzip -q /tmp/delta.zip -d /tmp/delta
          (
            cd "$ROOT"
            patch -p1 < /tmp/delta/patches/index.php.patch
            patch -p1 < /tmp/delta/patches/lib_storage.php.patch
            patch -p1 < /tmp/delta/patches/app.html.patch
            cp /tmp/delta/lib/warehouse-v53438.php lib/warehouse-v53438.php
            cp /tmp/delta/assets/warehouse-v53438.js assets/warehouse-v53438.js
            cp /tmp/delta/assets/warehouse-v53438.css assets/warehouse-v53438.css
            cp "$GITHUB_WORKSPACE/assets/order-multiprint-v53438.js" assets/order-multiprint-v53438.js
            cp "$GITHUB_WORKSPACE/assets/warehouse-carton-multilabel-v53438.js" assets/warehouse-carton-multilabel-v53438.js
            cp "$GITHUB_WORKSPACE/assets/warehouse-ui-refine-v53438.js" assets/warehouse-ui-refine-v53438.js
            python3 - <<'PY'
            from pathlib import Path
            p=Path('app.html')
            s=p.read_text()
            tags=[
                '<script src="/assets/order-multiprint-v53438.js?v=53438mp2"></script>',
                '<script src="/assets/warehouse-carton-multilabel-v53438.js?v=53438wl2"></script>',
                '<script src="/assets/warehouse-ui-refine-v53438.js?v=53438ui4"></script>'
            ]
            if '</body>' not in s:
                raise SystemExit('app.html closing body not found')
            for tag in tags:
                if tag not in s:
                    s=s.replace('</body>',tag+'</body>',1)
            p.write_text(s)
            PY
          )
          python3 "$GITHUB_WORKSPACE/scripts/patch-partial-shipment-per-serial.py" "$ROOT"
          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"
          php -l "$ROOT/lib/storage.php"
          php -l "$ROOT/lib/warehouse-v53438.php"
          node - "$ROOT" <<'NODE'
          const fs=require('fs'),root=process.argv[2];
          const h=fs.readFileSync(root+'/app.html','utf8'),re=/<script[^>]*>([\s\S]*?)<\/script>/gi;
          let m,n=0;while((m=re.exec(h))){new Function(m[1]);n++}
          if(!n)throw new Error('No inline JS');
          new Function(fs.readFileSync(root+'/assets/warehouse-v53438.js','utf8'));
          console.log('JS OK',n);
          NODE
          grep -q 'sessionLifetime=86400' "$ROOT/index.php"
          grep -q 'میلیارد تومان' "$ROOT/app.html"
          grep -q '/api/order/return' "$ROOT/lib/warehouse-v53438.php"
          grep -q 'warehouseDaily' "$ROOT/assets/warehouse-v53438.js"
          grep -q 'انبار خرده تهرانپارس' "$ROOT/assets/warehouse-v53438.js"
          node --check "$ROOT/assets/order-multiprint-v53438.js"
          grep -q 'order-multiprint-v53438.js' "$ROOT/app.html"
          grep -q 'چاپ بیجک‌های انتخابی' "$ROOT/assets/order-multiprint-v53438.js"
          grep -q 'چاپ لیبل‌های انتخابی' "$ROOT/assets/order-multiprint-v53438.js"
          node --check "$ROOT/assets/warehouse-carton-multilabel-v53438.js"
          grep -q 'warehouse-carton-multilabel-v53438.js' "$ROOT/app.html"
          grep -q 'چاپ لیبل باکس‌های انتخاب‌شده' "$ROOT/assets/warehouse-carton-multilabel-v53438.js"
          node --check "$ROOT/assets/warehouse-ui-refine-v53438.js"
          grep -q 'warehouse-ui-refine-v53438.js' "$ROOT/app.html"
          grep -q 'سریال‌های مشتریان' "$ROOT/assets/warehouse-ui-refine-v53438.js"
          grep -q 'ثبت تجمیع‌شده' "$ROOT/assets/warehouse-ui-refine-v53438.js"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Backup live core files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rollback
          mkdir -p /tmp/rollback/partners /tmp/rollback/lib /tmp/rollback/assets
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/rollback/index.php
          get /app.html -o /tmp/rollback/app.html
          get /partners/index.php -o /tmp/rollback/partners/index.php
          get /lib/storage.php -o /tmp/rollback/lib/storage.php
          get /VERSION.txt -o /tmp/rollback/VERSION.txt
          bye
          EOF

      - name: Snapshot and verify MySQL before deployment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          FILE="__gp_v53438_preswitch_${GITHUB_RUN_ID}.php"
          cat > "/tmp/$FILE" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__TOKEN__',(string)($_GET['token']??''))){http_response_code(403);exit('{}');}
          $cfg=require __DIR__.'/config.php';$m=$cfg['mysql']??[];
          try{
            $pdo=new PDO('mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4'),(string)($m['username']??''),(string)($m['password']??''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
            $r=$pdo->query("SELECT state_json,revision FROM ghadir_state WHERE id=1")->fetch();if(!$r)throw new RuntimeException('state missing');
            $s=json_decode($r['state_json'],true);if(!is_array($s))throw new RuntimeException('state invalid');
            $dir=__DIR__.'/storage/Backups';@mkdir($dir,0750,true);$name='ghadir-mysql-pre-exact-v53438-'.date('Ymd-His').'.json';
            if(file_put_contents($dir.'/'.$name,json_encode($s,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE),LOCK_EX)===false)throw new RuntimeException('backup failed');
            $wanted=['I90-097','I90-098','I90-099','I90-100','I90-101','I90-102','I90-103','I90-109','I90-110','I90-111','I90-112','I90-113','I90-114','I90-115','I90-116','I90-123','I90-124','I90-125'];
            $cart=[];foreach($s['cartons']??[] as $c)$cart[(string)($c['code']??'')]=$c;
            foreach($wanted as $code){if(!isset($cart[$code]))throw new RuntimeException('missing '.$code);$cid=(int)$cart[$code]['id'];$rows=array_values(array_filter($s['inventory']??[],fn($x)=>(int)($x['carton_id']??0)===$cid||(string)($x['carton_code']??'')===$code));$free=count(array_filter($rows,fn($x)=>(int)($x['order_id']??0)===0));if(count($rows)!==20||$free!==20)throw new RuntimeException('target mismatch '.$code);}
            echo json_encode(['ok'=>true,'revision'=>(int)$r['revision'],'backup'=>$name,'counts'=>['inventory'=>count($s['inventory']??[]),'cartons'=>count($s['cartons']??[]),'orders'=>count($s['orders']??[])]],JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){http_response_code(500);echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE);}
          PHP
          python3 - <<PY
          p="/tmp/$FILE";s=open(p).read().replace('__TOKEN__',"$TOKEN");open(p,'w').write(s)
          PY
          cleanup(){ lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          RESP="$(curl -fsS --max-time 40 "https://ghadirpartner.ir/$FILE?token=$TOKEN")"
          echo "$RESP"
          echo "$RESP" | php -r '$x=json_decode(stream_get_contents(STDIN),true);if(empty($x["ok"])||($x["counts"]["inventory"]??0)<13289||($x["counts"]["cartons"]??0)<364)exit(2);'

      - name: Deploy exact V5.3.4.38 core + add-on
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.build.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$ROOT/index.php" -o /index.php
          put "$ROOT/app.html" -o /app.html
          put "$ROOT/partners/index.php" -o /partners/index.php
          put "$ROOT/lib/storage.php" -o /lib/storage.php
          put "$ROOT/lib/warehouse-v53438.php" -o /lib/warehouse-v53438.php
          put "$ROOT/assets/warehouse-v53438.js" -o /assets/warehouse-v53438.js
          put "$ROOT/assets/warehouse-v53438.css" -o /assets/warehouse-v53438.css
          put "$ROOT/assets/warehouse-ui-refine-v53438.js" -o /assets/warehouse-ui-refine-v53438.js
          put "$ROOT/VERSION.txt" -o /VERSION.txt
          bye
          EOF

      - name: Verify exact live release
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            root="$(curl -sS --max-time 25 -o /tmp/root.html -w '%{http_code}' https://ghadirpartner.ir/ || true)"
            health="$(curl -sS --max-time 25 https://ghadirpartner.ir/healthz || true)"
            partner="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' https://ghadirpartner.ir/partners/ || true)"
            echo "check $i root=$root partner=$partner health=$health"
            if [[ "$root" == "200" && "$partner" == "200" ]] && echo "$health" | grep -q 'V5.3.4.38-INVENTORY-LAZY-API-FIX' && grep -q 'warehouse-v53438.js' /tmp/root.html; then ok=1;break;fi
            sleep 5
          done
          [[ "$ok" == "1" ]] || exit 1
          rm -rf /tmp/livecheck && mkdir -p /tmp/livecheck/lib /tmp/livecheck/assets
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/livecheck/index.php
          get /app.html -o /tmp/livecheck/app.html
          get /lib/storage.php -o /tmp/livecheck/lib/storage.php
          get /lib/warehouse-v53438.php -o /tmp/livecheck/lib/warehouse-v53438.php
          get /assets/warehouse-v53438.js -o /tmp/livecheck/assets/warehouse-v53438.js
          get /assets/warehouse-ui-refine-v53438.js -o /tmp/livecheck/assets/warehouse-ui-refine-v53438.js
          get /VERSION.txt -o /tmp/livecheck/VERSION.txt
          bye
          EOF
          test "$(cat /tmp/livecheck/VERSION.txt)" = "V5.3.4.38-INVENTORY-LAZY-API-FIX"
          php -l /tmp/livecheck/index.php
          php -l /tmp/livecheck/lib/storage.php
          php -l /tmp/livecheck/lib/warehouse-v53438.php
          grep -q '/api/order/return' /tmp/livecheck/lib/warehouse-v53438.php
          grep -q 'warehouseDaily' /tmp/livecheck/assets/warehouse-v53438.js
          grep -q 'GP_UI_HOTFIX_20261010' /tmp/livecheck/assets/warehouse-ui-refine-v53438.js
          grep -q 'PARTIAL_SHIPMENT_PER_SERIAL_20261010' /tmp/livecheck/lib/storage.php
          grep -q 'sessionLifetime=86400' /tmp/livecheck/index.php
          grep -q 'میلیارد تومان' /tmp/livecheck/app.html

      - name: Roll back core files on failure
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          [[ -f /tmp/rollback/index.php ]] || exit 0
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/rollback/index.php -o /index.php
          put /tmp/rollback/app.html -o /app.html
          put /tmp/rollback/partners/index.php -o /partners/index.php
          put /tmp/rollback/lib/storage.php -o /lib/storage.php
          put /tmp/rollback/VERSION.txt -o /VERSION.txt
          bye
          EOF
