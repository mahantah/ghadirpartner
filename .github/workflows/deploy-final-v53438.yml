name: Deploy Final V5.3.4.38

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mysql-switch.trigger"

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli curl nodejs

      - name: Prepare MySQL-only release
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GhadirPartner-Web-V5.3.4.38-FINAL-TOMAN-SESSION24H-HOMA-SERVICE.zip"
          test -f "$ZIP" || { echo "::error::Final release ZIP not found"; exit 1; }
          rm -rf /tmp/ghadir-final
          mkdir -p /tmp/ghadir-final
          unzip -q "$ZIP" -d /tmp/ghadir-final
          ROOT="$(find /tmp/ghadir-final -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [[ -z "$ROOT" || ! -f "$ROOT/index.php" ]]; then ROOT="/tmp/ghadir-final"; fi
          test -f "$ROOT/index.php"
          test -f "$ROOT/partners/index.php"
          mkdir -p "$ROOT/lib"

          cat > "$ROOT/lib/storage.php" <<'PHP'
          <?php
          declare(strict_types=1);

          function ghadir_storage_driver(): string {
              global $cfg;
              $d = strtolower(trim((string)($cfg['storage_driver'] ?? 'mysql')));
              if ($d !== 'mysql') fail('این نسخه فقط با MySQL اجرا می‌شود؛ تنظیم storage_driver را بررسی کنید', 503);
              return 'mysql';
          }

          function ghadir_state_prepare(array &$s): void {
              foreach (init_state() as $k => $v) if (!array_key_exists($k, $s)) $s[$k] = $v;
              foreach (['sms_outbox','payment_transactions','registration_requests','password_reset_requests','staff_password_reset_requests','special_offers','offer_usages'] as $k) {
                  if (!isset($s[$k]) || !is_array($s[$k])) $s[$k] = [];
              }
              foreach (['next_registration','next_password_reset','next_staff_password_reset','next_offer'] as $k) {
                  if (!isset($s[$k])) $s[$k] = 1;
              }
              if (function_exists('normalize_state_users')) normalize_state_users($s);
              if (isset($s['orders']) && is_array($s['orders'])) {
                  foreach ($s['orders'] as &$o) if (($o['payment_status'] ?? '') === 'پرداخت جزئی') $o['payment_status'] = 'بیعانه';
                  unset($o);
              }
          }

          function ghadir_mysql_cfg(): array {
              global $cfg;
              $m = is_array($cfg['mysql'] ?? null) ? $cfg['mysql'] : [];
              if (!$m) {
                  $root = dirname(__DIR__) . '/config.php';
                  if (is_file($root)) {
                      $rootCfg = require $root;
                      if (is_array($rootCfg['mysql'] ?? null)) $m = $rootCfg['mysql'];
                  }
              }
              return array_merge([
                  'host'=>'localhost','port'=>3306,'database'=>'','username'=>'','password'=>'','charset'=>'utf8mb4'
              ], $m);
          }

          function ghadir_mysql_pdo(): PDO {
              static $pdo = null;
              if ($pdo instanceof PDO) return $pdo;
              if (!extension_loaded('pdo_mysql')) fail('افزونه pdo_mysql روی هاست فعال نیست', 500);
              $m = ghadir_mysql_cfg();
              foreach (['database','username'] as $k) if (trim((string)$m[$k]) === '') fail('تنظیمات MySQL کامل نیست', 503);
              $dsn = 'mysql:host='.$m['host'].';port='.(int)$m['port'].';dbname='.$m['database'].';charset='.$m['charset'];
              try {
                  $pdo = new PDO($dsn,(string)$m['username'],(string)$m['password'],[
                      PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,
                      PDO::ATTR_EMULATE_PREPARES=>false,
                      PDO::ATTR_TIMEOUT=>5
                  ]);
                  try { $pdo->exec("SET time_zone = '+03:30'"); } catch (Throwable $e) {}
              } catch (Throwable $e) {
                  fail('اتصال MySQL برقرار نشد',503);
              }
              return $pdo;
          }

          function ghadir_mysql_bootstrap(PDO $pdo): void {
              $pdo->exec("CREATE TABLE IF NOT EXISTS ghadir_state (
                  id TINYINT UNSIGNED NOT NULL PRIMARY KEY,
                  state_json LONGTEXT NOT NULL,
                  revision BIGINT UNSIGNED NOT NULL DEFAULT 1,
                  checksum CHAR(64) NOT NULL,
                  updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci");
              $pdo->exec("CREATE TABLE IF NOT EXISTS ghadir_state_audit (
                  id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
                  revision BIGINT UNSIGNED NOT NULL,
                  checksum CHAR(64) NOT NULL,
                  bytes BIGINT UNSIGNED NOT NULL DEFAULT 0,
                  created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
                  INDEX idx_revision (revision), INDEX idx_created_at (created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci");
              if ((int)$pdo->query('SELECT COUNT(*) FROM ghadir_state WHERE id=1')->fetchColumn() < 1) {
                  fail('داده اصلی MySQL پیدا نشد؛ سوییچ متوقف شد',503);
              }
          }

          function ghadir_mysql_db(bool $write, callable $fn) {
              $pdo = ghadir_mysql_pdo();
              ghadir_mysql_bootstrap($pdo);
              try {
                  if ($write) $pdo->beginTransaction();
                  $sql='SELECT state_json,revision FROM ghadir_state WHERE id=1'.($write?' FOR UPDATE':'');
                  $row=$pdo->query($sql)->fetch();
                  if(!$row) throw new RuntimeException('state missing');
                  $s=json_decode((string)$row['state_json'],true);
                  if(!is_array($s)) throw new RuntimeException('state invalid');
                  ghadir_state_prepare($s);
                  if(isset($s['products'])&&is_array($s['products'])) $GLOBALS['PRODUCTS']=$s['products'];
                  $r=$fn($s);
                  if($write){
                      $encoded=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE);
                      if($encoded===false) throw new RuntimeException('encode failed');
                      $checksum=hash('sha256',$encoded);
                      $revision=(int)$row['revision']+1;
                      $st=$pdo->prepare('UPDATE ghadir_state SET state_json=?,revision=?,checksum=?,updated_at=NOW() WHERE id=1');
                      $st->execute([$encoded,$revision,$checksum]);
                      $pdo->prepare('INSERT INTO ghadir_state_audit (revision,checksum,bytes) VALUES (?,?,?)')->execute([$revision,$checksum,strlen($encoded)]);
                      $pdo->commit();
                  }
                  return $r;
              } catch(Throwable $e) {
                  if($write && $pdo->inTransaction()) $pdo->rollBack();
                  fail('خطای تراکنش MySQL؛ هیچ تغییر ناقصی ذخیره نشد',500);
              }
          }

          function ghadir_db(bool $write, callable $fn) {
              ghadir_storage_driver();
              return ghadir_mysql_db($write,$fn);
          }

          function ghadir_backup_snapshot(): string {
              global $backups;
              @mkdir($backups,0750,true);
              $to=$backups.'/ghadir-backup-mysql-'.date('Ymd-His').'.json';
              $state=ghadir_db(false,fn($s)=>$s);
              $raw=json_encode($state,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE);
              if($raw===false || @file_put_contents($to,$raw,LOCK_EX)===false) fail('ساخت بکاپ MySQL ممکن نشد',500);
              return 'storage/Backups/'.basename($to);
          }
          PHP

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for rel,req in [('index.php',"require_once __DIR__.'/lib/storage.php';\nfunction db($write,$fn){return ghadir_db((bool)$write,$fn);}\n"),
                          ('partners/index.php',"require_once dirname(__DIR__).'/lib/storage.php';\nfunction db($write,$fn){return ghadir_db((bool)$write,$fn);}\n")]:
              p=root/rel
              s=p.read_text()
              if "function db($write,$fn){global $file;" in s:
                  a=s.index("function db($write,$fn){global $file;")
                  b=s.index("function input(){",a)
                  s=s[:a]+req+s[b:]
              elif "ghadir_db((bool)$write" not in s:
                  raise SystemExit(f'Cannot locate JSON db block in {rel}')
              ba=s.find("if($p==='/api/backup')")
              bn=s.find("if($p==='/api/network')",ba)
              if ba<0 or bn<0: raise SystemExit(f'Backup endpoint not found in {rel}')
              s=s[:ba]+"if($p==='/api/backup'){$u=auth(['admin']);out(['path'=>ghadir_backup_snapshot()]);}\n"+s[bn:]
              p.write_text(s)
          PY

          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"
          php -l "$ROOT/lib/storage.php"
          grep -q "ghadir_db((bool).*write" "$ROOT/index.php"
          grep -q "ghadir_db((bool).*write" "$ROOT/partners/index.php"
          grep -q "return 'mysql'" "$ROOT/lib/storage.php"
          grep -q "sessionLifetime=86400" "$ROOT/index.php"
          grep -q "میلیارد تومان" "$ROOT/app.html"
          grep -q "989982007480" "$ROOT/index.php"
          if grep -R "api.homais.com" "$ROOT/index.php" "$ROOT/partners/index.php" 2>/dev/null; then
            echo "::error::Old Homa endpoint found"
            exit 1
          fi
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -rf "$ROOT/storage" 2>/dev/null || true
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Backup live code and both data stores
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rollback
          mkdir -p /tmp/rollback/partners /tmp/rollback/lib
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/rollback/index.php
          get /partners/index.php -o /tmp/rollback/partners/index.php
          get /storage/ghadir_data.json -o /tmp/rollback/ghadir_data.json
          bye
          EOF
          lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /lib/storage.php -o /tmp/rollback/lib/storage.php
          bye
          EOF
          if [[ -f /tmp/rollback/lib/storage.php ]]; then echo yes > /tmp/rollback/had-storage-lib; else echo no > /tmp/rollback/had-storage-lib; fi
          TS="$(date +%Y%m%d-%H%M%S)"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /storage/Backups
          put /tmp/rollback/ghadir_data.json -o "ghadir-json-pre-mysql-switch-$TS.json"
          bye
          EOF

          TOKEN="$(openssl rand -hex 24)"
          FILE="__gp_preswitch_${GITHUB_RUN_ID}.php"
          cat > "/tmp/$FILE" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__TOKEN__',(string)($_GET['token']??''))){http_response_code(403);exit('{}');}
          $cfg=require __DIR__.'/config.php';$m=$cfg['mysql']??[];
          try{
            $pdo=new PDO('mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4'),(string)($m['username']??''),(string)($m['password']??''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
            $r=$pdo->query("SELECT state_json,revision FROM ghadir_state WHERE id=1")->fetch();if(!$r)throw new RuntimeException('state missing');
            $s=json_decode($r['state_json'],true);if(!is_array($s))throw new RuntimeException('state invalid');
            $wanted=['I90-097','I90-098','I90-099','I90-100','I90-101','I90-102','I90-103','I90-109','I90-110','I90-111','I90-112','I90-113','I90-114','I90-115','I90-116','I90-123','I90-124','I90-125'];
            $cart=[];foreach($s['cartons']??[] as $c)$cart[(string)($c['code']??'')]=$c;
            $inv=$s['inventory']??[];$targets=[];
            foreach($wanted as $code){$c=$cart[$code]??null;if(!$c)throw new RuntimeException('missing '.$code);$cid=(int)$c['id'];$rows=array_values(array_filter($inv,fn($x)=>(int)($x['carton_id']??0)===$cid||(string)($x['carton_code']??'')===$code));$free=count(array_filter($rows,fn($x)=>(int)($x['order_id']??0)===0));$targets[$code]=['rows'=>count($rows),'free'=>$free];if(count($rows)!==20||$free!==20)throw new RuntimeException('target not free '.$code);}
            if(($_GET['action']??'')==='snapshot'){
              $dir=__DIR__.'/storage/Backups';@mkdir($dir,0750,true);$name='ghadir-mysql-pre-switch-'.date('Ymd-His').'.json';if(file_put_contents($dir.'/'.$name,json_encode($s,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE),LOCK_EX)===false)throw new RuntimeException('snapshot write failed');
            }
            echo json_encode(['ok'=>true,'revision'=>(int)$r['revision'],'counts'=>['users'=>count($s['users']??[]),'customers'=>count($s['customers']??[]),'orders'=>count($s['orders']??[]),'inventory'=>count($inv),'cartons'=>count($s['cartons']??[])],'targets'=>$targets],JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){http_response_code(500);echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE);}
          PHP
          python3 - <<PY
          p="/tmp/$FILE";s=open(p).read().replace('__TOKEN__',"$TOKEN");open(p,'w').write(s)
          PY
          echo "$TOKEN" > /tmp/rollback/probe-token
          echo "$FILE" > /tmp/rollback/probe-file
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          RESP="$(curl -fsS --max-time 30 "https://ghadirpartner.ir/$FILE?token=$TOKEN&action=snapshot")"
          echo "$RESP" > /tmp/rollback/pre-switch.json
          echo "$RESP" | php -r '$x=json_decode(stream_get_contents(STDIN),true);if(empty($x["ok"])||($x["counts"]["inventory"]??0)<13289||($x["counts"]["cartons"]??0)<364)exit(2);echo "MySQL pre-switch snapshot OK\n";'

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob backups/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /
          bye
          EOF

      - name: Ensure Homa live config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/homa-live
          mkdir -p /tmp/homa-live
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /config.php -o /tmp/homa-live/config.php
          bye
          EOF
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/homa-live/config.php');s=p.read_text()
          def setkey(s,key,val):
              pat=rf"(['\"]{re.escape(key)}['\"]\s*=>\s*)['\"][^'\"]*['\"]"
              if re.search(pat,s): return re.sub(pat,rf"\1'{val}'",s,count=1)
              pos=s.rfind('];')
              if pos<0: raise SystemExit('config.php format unsupported')
              return s[:pos]+f"    '{key}' => '{val}',\n"+s[pos:]
          s=setkey(s,'homa_api_endpoint','https://www.homacrm.com/api/v1/external/messaging/send')
          s=setkey(s,'homa_sender_id','989982007480')
          s=setkey(s,'storage_driver','mysql')
          p.write_text(s)
          PY
          php -l /tmp/homa-live/config.php
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put -O / /tmp/homa-live/config.php
          bye
          EOF

      - name: Verify production and MySQL inventory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            code="$(curl -sS --max-time 25 -o /tmp/site.html -w '%{http_code}' https://ghadirpartner.ir/ || true)"
            pcode="$(curl -sS --max-time 25 -o /tmp/partners.html -w '%{http_code}' https://ghadirpartner.ir/partners/ || true)"
            echo "health $i: root=$code partners=$pcode"
            if [[ "$code" == "200" && "$pcode" == "200" ]]; then ok=1;break;fi
            sleep 5
          done
          [[ "$ok" == "1" ]] || exit 1
          FILE="$(cat /tmp/rollback/probe-file)"
          TOKEN="$(cat /tmp/rollback/probe-token)"
          RESP="$(curl -fsS --max-time 30 "https://ghadirpartner.ir/$FILE?token=$TOKEN&action=verify")"
          echo "$RESP" > /tmp/rollback/post-switch.json
          echo "$RESP" | php -r '$x=json_decode(stream_get_contents(STDIN),true);if(empty($x["ok"])||($x["counts"]["inventory"]??0)<13289||($x["counts"]["cartons"]??0)<364)exit(2);foreach(($x["targets"]??[]) as $v)if(($v["rows"]??0)!==20||($v["free"]??0)!==20)exit(3);echo "MySQL inventory verification OK\n";'
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF

      - name: Roll back code if deployment verification fails
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [[ -f /tmp/rollback/index.php && -f /tmp/rollback/partners/index.php ]]; then
            lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/rollback/index.php -o /index.php
          put /tmp/rollback/partners/index.php -o /partners/index.php
          bye
          EOF
            if [[ "$(cat /tmp/rollback/had-storage-lib 2>/dev/null)" == "yes" ]]; then
              lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mkdir -p /lib
          put /tmp/rollback/lib/storage.php -o /lib/storage.php
          bye
          EOF
            else
              lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm /lib/storage.php
          bye
          EOF
            fi
          fi
          FILE="$(cat /tmp/rollback/probe-file 2>/dev/null)"
          if [[ -n "$FILE" ]]; then
            lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          fi
