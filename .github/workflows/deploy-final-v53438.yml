name: Deploy Exact V5.3.4.38

# Run once on the cleanup merge when this explicit sentinel path is added;
# workflow_dispatch remains the normal long-term production release method.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/deploy/run-once-20261017.txt'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip patch lftp php-cli curl nodejs

      - name: Build exact V5.3.4.38 + warehouse/returns patch
        id: build
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "Production build failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          BASE="GhadirPartner-Web-V5.3.4.38-FINAL-TOMAN-SESSION24H-HOMA-SERVICE.zip"
          test -f "$BASE"
          rm -rf /tmp/v53438 /tmp/delta
          mkdir -p /tmp/v53438 /tmp/delta
          unzip -q "$BASE" -d /tmp/v53438
          ROOT="$(find /tmp/v53438 -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          if [[ -z "$ROOT" || ! -f "$ROOT/index.php" ]]; then ROOT=/tmp/v53438; fi
          test "$(cat "$ROOT/VERSION.txt")" = "V5.3.4.38-INVENTORY-LAZY-API-FIX"
          # The original ZIP has no .htaccess, but the static-entry patch
          # requires it. Copy reviewed repository configuration for the
          # build; production FTP .htaccess is left unchanged.
          test -f "$GITHUB_WORKSPACE/.htaccess"
          test -f "$GITHUB_WORKSPACE/partners/.htaccess"
          cp "$GITHUB_WORKSPACE/.htaccess" "$ROOT/.htaccess"
          cp "$GITHUB_WORKSPACE/partners/.htaccess" "$ROOT/partners/.htaccess"
          cat > /tmp/delta.b64 <<'B64'
          
          B64
          base64 -d /tmp/delta.b64 > /tmp/delta.zip
          echo "1049c9416d452fc295f6b9d25026d9d432200e9e1ce3c81e04944b6fcb3f99a2  /tmp/delta.zip" | sha256sum -c -
          unzip -q /tmp/delta.zip -d /tmp/delta
          (
            cd "$ROOT"
            patch -p1 < /tmp/delta/patches/index.php.patch
            patch -p1 < /tmp/delta/patches/lib_storage.php.patch
            patch -p1 < /tmp/delta/patches/app.html.patch
            cp /tmp/delta/lib/warehouse-v53438.php lib/warehouse-v53438.php
            cp /tmp/delta/assets/warehouse-v53438.js assets/warehouse-v53438.js
            cp /tmp/delta/assets/warehouse-v53438.css assets/warehouse-v53438.css
            cp "$GITHUB_WORKSPACE/assets/order-multiprint-v53438.js" assets/order-multiprint-v53438.js
            cp "$GITHUB_WORKSPACE/assets/warehouse-carton-multilabel-v53438.js" assets/warehouse-carton-multilabel-v53438.js
            cp "$GITHUB_WORKSPACE/assets/warehouse-ui-refine-v53438.js" assets/warehouse-ui-refine-v53438.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          tags=[
              '<script src="/assets/order-multiprint-v53438.js?v=53438mp3"></script>',
              '<script src="/assets/warehouse-ui-refine-v53438.js?v=53438ui8"></script>',
              '<script src="/assets/warehouse-carton-multilabel-v53438.js?v=53438whprint4"></script>'
          ]
          if '</body>' not in s:
              raise SystemExit('app.html closing body not found')
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s)
          PY
          )
          python3 "$GITHUB_WORKSPACE/scripts/patch-partial-shipment-per-serial.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-serial-continuation-location.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-order-serial-carton-display.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-warehouse-supplier-qr.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-supplier-display-dom-v4.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-supplier-display-live-v5.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-supplier-edit-v6.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-supplier-canonical-v8.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-purchase-supplier-v9.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-retail-transfer-detach-carton-v1.py" "$ROOT"
          cp "$GITHUB_WORKSPACE/lib/protected-cartons.php" "$ROOT/lib/protected-cartons.php"
          python3 "$GITHUB_WORKSPACE/scripts/patch-protected-carton-ops-v1.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-mobile-ui-v1.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-mobile-menu-overlay-v2.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-nav-morph-v1.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-sidebar-profile-polish-v1.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-sidebar-edge-profile-v2.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-sidebar-collapse-v3.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-sidebar-real-edge-v4.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-warehouse-serial-filters-v1.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-warehouse-serial-filters-v2.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-warehouse-serial-filters-v3.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-customer-serial-counts-v4.py" "$ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/patch-customer-model-catalog-v5.py" "$ROOT"
