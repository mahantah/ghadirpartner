          grep -q 'WAREHOUSE_PURCHASE_SUPPLIER_V9_20261015' "$ROOT/index.php"
          grep -q 'WAREHOUSE_PURCHASE_SUPPLIER_UI_V9_20261015' "$ROOT/app.html"
          grep -q 'MOBILE_UI_OPTIMIZATION_V1_20261014' "$ROOT/app.html"
          grep -q 'MOBILE_MENU_OVERLAY_FIX_V2_20261014' "$ROOT/app.html"
          grep -q 'warehouse-carton-multilabel-v53438.js?v=53438whprint4' "$ROOT/app.html"
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' "$ROOT/index.php"
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' "$ROOT/app.html"
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' "$ROOT/partners/index.php"
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' "$ROOT/partners/portal.html"
          grep -q 'PERFORMANCE_BOOTSTRAP_V1_20261014' "$ROOT/mobile.html"
          grep -q 'DirectoryIndex app.html index.php' "$ROOT/.htaccess"
          grep -q 'DirectoryIndex portal.html index.php' "$ROOT/partners/.htaccess"
          ! grep -q 'setInterval(pollNotif,4000)' "$ROOT/app.html"
          grep -q 'gpWarehousePrintSelectedCartons' "$ROOT/assets/warehouse-carton-multilabel-v53438.js"
          grep -q '/api/warehouse/carton/supplier' "$ROOT/index.php"
          grep -q 'id="eisupplier"' "$ROOT/app.html"
