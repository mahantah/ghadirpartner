      - name: Snapshot and verify MySQL before deployment
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          FILE="__gp_v53438_preswitch_${GITHUB_RUN_ID}.php"
          cat > "/tmp/$FILE" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__TOKEN__',(string)($_GET['token']??''))){http_response_code(403);exit('{}');}
          $cfg=require __DIR__.'/config.php';$m=$cfg['mysql']??[];
          $pdo=null;
          try{
            $pdo=new PDO('mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4'),(string)($m['username']??''),(string)($m['password']??''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
            $r=$pdo->query("SELECT state_json,revision FROM ghadir_state WHERE id=1")->fetch();if(!$r)throw new RuntimeException('state missing');
            $s=json_decode($r['state_json'],true);if(!is_array($s))throw new RuntimeException('state invalid');
            $dir=__DIR__.'/storage/Backups';@mkdir($dir,0750,true);$name='ghadir-mysql-pre-exact-v53438-'.date('Ymd-His').'.json';
            if(file_put_contents($dir.'/'.$name,json_encode($s,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE),LOCK_EX)===false)throw new RuntimeException('backup failed');
            $revision=(int)$r['revision'];
            $wanted=['I90-097','I90-098','I90-099','I90-100','I90-101','I90-102','I90-103','I90-109','I90-110','I90-111','I90-112','I90-113','I90-114','I90-115','I90-116','I90-123','I90-124','I90-125'];
            $cart=[];foreach($s['cartons']??[] as $c)$cart[(string)($c['code']??'')]=$c;
            foreach($wanted as $code){
              if(!isset($cart[$code]))throw new RuntimeException('missing '.$code);
              $cid=(int)$cart[$code]['id'];
              $rows=array_values(array_filter($s['inventory']??[],fn($x)=>(int)($x['carton_id']??0)===$cid||(string)($x['carton_code']??'')===$code));
              $free=count(array_filter($rows,fn($x)=>(int)($x['order_id']??0)===0));
              $actual=count($rows);$reserved=$actual-$free;
              if($actual!==20||$free!==20){
                $kind=$actual!==20&&$reserved>0?'count_and_allocated':($actual!==20?'count_mismatch':'allocated');
                throw new RuntimeException('target mismatch '.$code.' kind='.$kind.' expected=20 actual='.$actual.' free='.$free.' reserved='.$reserved);
              }
            }
            echo json_encode(['ok'=>true,'revision'=>$revision,'backup'=>$name,'counts'=>['inventory'=>count($s['inventory']??[]),'cartons'=>count($s['cartons']??[]),'orders'=>count($s['orders']??[])]],JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){
            http_response_code(500);
            $msg=$e->getMessage();
            $carton=null;$kind=null;$actual=null;$free=null;$reserved=null;
            if(preg_match('/\b(I90-\d{3})\b/i',$msg,$m))$carton=strtoupper($m[1]);
            if(preg_match('/kind=([a-z_]+)/i',$msg,$m))$kind=strtolower($m[1]);
            if(preg_match('/actual=(\d+)/',$msg,$m))$actual=(int)$m[1];
            if(preg_match('/free=(\d+)/',$msg,$m))$free=(int)$m[1];
            if(preg_match('/reserved=(\d+)/',$msg,$m))$reserved=(int)$m[1];
            if(str_starts_with(strtolower($msg),'missing '))$kind=$kind?:'missing';
            $low=strtolower($msg);
            $guard=(str_contains($low,'target mismatch')||str_contains($low,'missing i90-'))
              ?'protected_carton_state_mismatch'
              :(str_contains($low,'backup')?'state_backup_failed'
              :((str_contains($low,'sqlstate')||str_contains($low,'pdo'))?'database_error'
              :((str_contains($low,'state missing')||str_contains($low,'state invalid'))?'database_state_missing_or_invalid':'server_precheck_error')));
            // Sanitized fields only: no state dump, serials, or credentials.
            echo json_encode(['ok'=>false,'error'=>$msg,'guard'=>$guard,'carton'=>$carton,'kind'=>$kind,'expected'=>20,'actual'=>$actual,'free'=>$free,'reserved'=>$reserved],JSON_UNESCAPED_UNICODE);
          }
          PHP
          python3 - <<PY
          p="/tmp/$FILE";s=open(p).read().replace('__TOKEN__',"$TOKEN");open(p,'w').write(s)
          PY
          cleanup(){ lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          HTTP_STATUS="$(curl -sS --max-time 40 --output /tmp/ghp-preswitch-result.json --write-out '%{http_code}' "https://ghadirpartner.ir/$FILE?token=$TOKEN")"
          python3 "$GITHUB_WORKSPACE/scripts/preswitch_safety.py" classify /tmp/ghp-preswitch-result.json "$HTTP_STATUS"

