name: Deploy Final V5.3.4.38

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "deploy-final-v53438.trigger"

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l partners/index.php
          php -l lib/storage.php
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('app.html','utf8');
          const re=/<script[^>]*>([\s\S]*?)<\/script>/gi;
          let m,n=0;
          while((m=re.exec(html))){new Function(m[1]);n++}
          if(!n)throw new Error('No script blocks found');
          console.log('JS syntax OK:',n);
          NODE
          grep -q "/api/order/return" index.php
          grep -q "/api/warehouse/transfer" index.php
          grep -q "انبار خرده تهرانپارس" app.html
          grep -q "ghadir_warehouse_exit_order" lib/storage.php

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp curl php-cli

      - name: Backup live code
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rollback
          mkdir -p /tmp/rollback/partners /tmp/rollback/lib
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/rollback/index.php
          get /app.html -o /tmp/rollback/app.html
          get /partners/index.php -o /tmp/rollback/partners/index.php
          get /lib/storage.php -o /tmp/rollback/lib/storage.php
          bye
          EOF

      - name: Snapshot and initialize two warehouses in MySQL
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          FILE="__gp_warehouse_migrate_${GITHUB_RUN_ID}.php"
          cat > "/tmp/$FILE" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__TOKEN__',(string)($_GET['token']??''))){http_response_code(403);exit('{}');}
          $cfg=require __DIR__.'/config.php';$m=$cfg['mysql']??[];
          try{
            $pdo=new PDO('mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4'),(string)($m['username']??''),(string)($m['password']??''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false]);
            $pdo->beginTransaction();
            $row=$pdo->query("SELECT state_json,revision FROM ghadir_state WHERE id=1 FOR UPDATE")->fetch();
            if(!$row)throw new RuntimeException('state missing');
            $s=json_decode((string)$row['state_json'],true);
            if(!is_array($s))throw new RuntimeException('state invalid');
            $before=['inventory'=>count($s['inventory']??[]),'cartons'=>count($s['cartons']??[]),'orders'=>count($s['orders']??[]),'customers'=>count($s['customers']??[])];

            $backupDir=__DIR__.'/storage/Backups';@mkdir($backupDir,0750,true);
            $backupName='ghadir-mysql-pre-two-warehouses-'.date('Ymd-His').'.json';
            $backupRaw=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE);
            if($backupRaw===false||file_put_contents($backupDir.'/'.$backupName,$backupRaw,LOCK_EX)===false)throw new RuntimeException('backup failed');

            if(!isset($s['warehouses'])||!is_array($s['warehouses'])||count($s['warehouses'])<2)$s['warehouses']=[
              ['id'=>1,'code'=>'WHOLESALE','name'=>'انبار عمده','active'=>true],
              ['id'=>2,'code'=>'TEHRANPARS_RETAIL','name'=>'انبار خرده تهرانپارس','active'=>true]
            ];
            if(!isset($s['warehouse_movements'])||!is_array($s['warehouse_movements']))$s['warehouse_movements']=[];
            if(!isset($s['next_warehouse_movement'])){$mx=0;foreach($s['warehouse_movements'] as $x)$mx=max($mx,(int)($x['id']??0));$s['next_warehouse_movement']=$mx+1;}
            if(!isset($s['inventory'])||!is_array($s['inventory']))$s['inventory']=[];
            if(!isset($s['cartons'])||!is_array($s['cartons']))$s['cartons']=[];
            $status=[];foreach($s['orders']??[] as $o)$status[(int)($o['id']??0)]=(string)($o['status']??'');
            foreach($s['inventory'] as &$iv){
              if(!array_key_exists('warehouse_id',$iv)){
                $oid=(int)($iv['order_id']??0);
                $out=$oid<0||($oid>0&&in_array($status[$oid]??'',['ارسال شد','تحویل شد'],true));
                $iv['warehouse_id']=$out?0:1;
              }else $iv['warehouse_id']=(int)$iv['warehouse_id'];
            }unset($iv);
            foreach($s['cartons'] as &$ct){
              if(!array_key_exists('warehouse_id',$ct)){
                $ids=[];foreach($s['inventory']??[] as $iv)if((int)($iv['carton_id']??0)===(int)($ct['id']??0)&&(int)($iv['warehouse_id']??0)>0)$ids[(int)$iv['warehouse_id']]=1;
                $ct['warehouse_id']=count($ids)===1?(int)array_key_first($ids):(count($ids)>1?0:1);
              }else $ct['warehouse_id']=(int)$ct['warehouse_id'];
            }unset($ct);
            if(empty($s['warehouse_activated_at']))$s['warehouse_activated_at']=date('Y-m-d H:i:s');
            if(!isset($s['warehouse_baseline'])||!is_array($s['warehouse_baseline'])){
              $counts=[];foreach($s['inventory']??[] as $iv){$wid=(int)($iv['warehouse_id']??0);if($wid<1)continue;$p=(string)($iv['product']??'نامشخص');$k=$wid.'|'.$p;if(!isset($counts[$k]))$counts[$k]=['warehouse_id'=>$wid,'product'=>$p,'qty'=>0];$counts[$k]['qty']++;}$s['warehouse_baseline']=array_values($counts);
            }

            $after=['inventory'=>count($s['inventory']??[]),'cartons'=>count($s['cartons']??[]),'orders'=>count($s['orders']??[]),'customers'=>count($s['customers']??[])];
            if($before!==$after)throw new RuntimeException('count mismatch');

            $targets=['I90-097','I90-098','I90-099','I90-100','I90-101','I90-102','I90-103','I90-109','I90-110','I90-111','I90-112','I90-113','I90-114','I90-115','I90-116','I90-123','I90-124','I90-125'];
            $cart=[];foreach($s['cartons']??[] as $ct)$cart[(string)($ct['code']??'')]=$ct;
            $targetCheck=[];
            foreach($targets as $code){
              if(!isset($cart[$code]))throw new RuntimeException('missing '.$code);
              $cid=(int)$cart[$code]['id'];$rows=array_values(array_filter($s['inventory']??[],fn($iv)=>(int)($iv['carton_id']??0)===$cid||(string)($iv['carton_code']??'')===$code));
              $free=count(array_filter($rows,fn($iv)=>(int)($iv['order_id']??0)===0&&(int)($iv['warehouse_id']??0)===1));
              if(count($rows)!==20||$free!==20)throw new RuntimeException('target mismatch '.$code);
              $targetCheck[$code]=['rows'=>count($rows),'free_wholesale'=>$free];
            }

            $encoded=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE);
            if($encoded===false)throw new RuntimeException('encode failed');
            $rev=(int)$row['revision']+1;$checksum=hash('sha256',$encoded);
            $st=$pdo->prepare("UPDATE ghadir_state SET state_json=?,revision=?,checksum=?,updated_at=NOW() WHERE id=1");$st->execute([$encoded,$rev,$checksum]);
            $pdo->prepare("INSERT INTO ghadir_state_audit (revision,checksum,bytes) VALUES (?,?,?)")->execute([$rev,$checksum,strlen($encoded)]);
            $pdo->commit();
            echo json_encode(['ok'=>true,'backup'=>'storage/Backups/'.$backupName,'counts'=>$after,'warehouses'=>count($s['warehouses']??[]),'targets'=>$targetCheck],JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){if(isset($pdo)&&$pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();http_response_code(500);echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE);}
          PHP
          python3 - <<PY
          p="/tmp/$FILE";s=open(p).read().replace('__TOKEN__',"$TOKEN");open(p,'w').write(s)
          PY
          cleanup(){
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          RESP="$(curl -fsS --max-time 40 "https://ghadirpartner.ir/$FILE?token=$TOKEN")"
          echo "$RESP" | php -r '$x=json_decode(stream_get_contents(STDIN),true);if(empty($x["ok"]))exit(2);if(($x["counts"]["inventory"]??0)<13289||($x["counts"]["cartons"]??0)<364||($x["warehouses"]??0)!==2)exit(3);echo json_encode($x,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT),"\n";'

      - name: Deploy feature files only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put index.php -o /index.php
          put app.html -o /app.html
          put partners/index.php -o /partners/index.php
          mkdir -p /lib
          put lib/storage.php -o /lib/storage.php
          bye
          EOF

      - name: Verify production
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..12}; do
            root="$(curl -sS --max-time 25 -o /tmp/root.html -w '%{http_code}' https://ghadirpartner.ir/ || true)"
            partner="$(curl -sS --max-time 25 -o /tmp/partner.html -w '%{http_code}' https://ghadirpartner.ir/partners/ || true)"
            echo "check $i root=$root partner=$partner"
            if [[ "$root" == "200" && "$partner" == "200" ]] && grep -q "انبار خرده تهرانپارس" /tmp/root.html; then ok=1;break;fi
            sleep 5
          done
          [[ "$ok" == "1" ]] || exit 1

          mkdir -p /tmp/livecheck/partners /tmp/livecheck/lib
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/livecheck/index.php
          get /app.html -o /tmp/livecheck/app.html
          get /partners/index.php -o /tmp/livecheck/partners/index.php
          get /lib/storage.php -o /tmp/livecheck/lib/storage.php
          bye
          EOF
          php -l /tmp/livecheck/index.php
          php -l /tmp/livecheck/partners/index.php
          php -l /tmp/livecheck/lib/storage.php
          grep -q "/api/order/return" /tmp/livecheck/index.php
          grep -q "warehouseDaily" /tmp/livecheck/app.html
          grep -q "ghadir_warehouse_exit_order" /tmp/livecheck/lib/storage.php

      - name: Roll back code if verification fails
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          if [[ -f /tmp/rollback/index.php ]]; then
            lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/rollback/index.php -o /index.php
          put /tmp/rollback/app.html -o /app.html
          put /tmp/rollback/partners/index.php -o /partners/index.php
          put /tmp/rollback/lib/storage.php -o /lib/storage.php
          bye
          EOF
          fi
