          node --check "$ROOT/assets/warehouse-serial-filters-v5.js"
          grep -q "GHADIR_CUSTOMER_MODEL_CATALOG_V5_20261017" "$ROOT/app.html"
          node --check "$ROOT/assets/warehouse-serial-filters-v4.js"
          grep -q "GHADIR_CUSTOMER_SERIAL_COUNTS_V4_20261017" "$ROOT/app.html"
