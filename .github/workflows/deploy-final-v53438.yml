          { grep -q 'WAREHOUSE_PROTECTED_CARTON_OPS_V1_20261017' "$ROOT/index.php" || grep -q 'WAREHOUSE_PROTECTED_CARTON_OPS_V1_20261017' "$ROOT/lib/warehouse-v53438.php"; }
          { grep -q 'ghadir_protected_transfer_guard' "$ROOT/index.php" || grep -q 'ghadir_protected_transfer_guard' "$ROOT/lib/warehouse-v53438.php"; }
          { grep -q 'ghadir_protected_should_detach_retail' "$ROOT/index.php" || grep -q 'ghadir_protected_should_detach_retail' "$ROOT/lib/warehouse-v53438.php"; }
          php -l "$ROOT/lib/protected-cartons.php"
