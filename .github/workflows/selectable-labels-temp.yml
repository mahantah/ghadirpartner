name: Deploy Selectable Label Print Hotfix

on:
  push:
    branches:
      - main
    paths:
      - "selectable-labels.trigger"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp nodejs

      - name: Validate JS
        run: |
          set -euo pipefail
          node --check assets/order-multiprint-v53438.js
          grep -q "چاپ فقط لیبل‌های انتخاب‌شده" assets/order-multiprint-v53438.js
          grep -q "gp-label-check" assets/order-multiprint-v53438.js

      - name: Patch live app cache version and upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labelselect
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/labelselect/app.html
          bye
          EOF
          cp /tmp/labelselect/app.html /tmp/labelselect/app-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/labelselect/app.html')
          s=p.read_text()
          s=s.replace('/assets/order-multiprint-v53438.js?v=53438mp1','/assets/order-multiprint-v53438.js?v=53438mp2')
          if '/assets/order-multiprint-v53438.js?v=53438mp2' not in s:
              raise SystemExit('multi-print asset tag not found in live app')
          p.write_text(s)
          PY
          TS="$(date +%Y%m%d-%H%M%S)"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /storage/Backups
          put /tmp/labelselect/app-before.html -o "app-before-selectable-labels-$TS.html"
          cd /
          put /tmp/labelselect/app.html -o /app.html
          put assets/order-multiprint-v53438.js -o /assets/order-multiprint-v53438.js
          bye
          EOF

      - name: Verify live
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/labelselect/verify
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/labelselect/verify/app.html
          get /assets/order-multiprint-v53438.js -o /tmp/labelselect/verify/order-multiprint-v53438.js
          bye
          EOF
          node --check /tmp/labelselect/verify/order-multiprint-v53438.js
          grep -q "53438mp2" /tmp/labelselect/verify/app.html
          grep -q "چاپ فقط لیبل‌های انتخاب‌شده" /tmp/labelselect/verify/order-multiprint-v53438.js
          grep -q "gp-label-check" /tmp/labelselect/verify/order-multiprint-v53438.js
