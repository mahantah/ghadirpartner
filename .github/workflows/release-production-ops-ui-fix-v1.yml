name: Release Production Ops UI Fix V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  ops-ui-fix-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate ops ui fix v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-ops-ui-fix-v1.py
          python3 tests/production-ops-ui-fix-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish ops ui fix v1
        run: python3 scripts/deploy-production-ops-ui-fix-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_OPS_UI_FIX_V1_20261025' /tmp/live-app.html
          grep -Fq 'ops-ui-fix-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'kartabl-sync-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/ops-ui-fix-v1.js?v=1' -o /tmp/live-ops.js
          grep -Fq 'isMarketer' /tmp/live-ops.js
          grep -Fq 'تغییر شماره تماس' /tmp/live-ops.js
          grep -Fq 'background:#fff!important' /tmp/live-ops.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
