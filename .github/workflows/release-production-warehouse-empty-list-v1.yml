name: Release Production Warehouse Empty List V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: |
          set -euo pipefail
          node --check assets/search-filter-fab-v1.js
          node --check assets/warehouse-carton-multilabel-v53438.js
          grep -Fq 'warehouseCartonCodeFromRow' assets/search-filter-fab-v1.js
          grep -Fq 'gpWarehouseRowCartonCode' assets/warehouse-carton-multilabel-v53438.js
          python3 -m py_compile scripts/deploy-production-warehouse-empty-list-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Deploy
        run: python3 scripts/deploy-production-warehouse-empty-list-v1.py deploy
      - name: Verify live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://ghadirpartner.ir/app.html -o /tmp/gp-wh-empty-app.html
          grep -Fq 'search-filter-fab-v1.js?v=3' /tmp/gp-wh-empty-app.html
          grep -Fq 'warehouse-carton-multilabel-v53438.js?v=53438whprint7' /tmp/gp-wh-empty-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/search-filter-fab-v1.js?v=3' -o /tmp/gp-fab3.js
          grep -Fq 'warehouseCartonCodeFromRow' /tmp/gp-fab3.js
