name: Deploy V5.3.4.3 + TSC + Marketer Sender

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Patch exact V5.3.4.3 and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli

      - name: Extract exact V5.3.4.3 base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GhadirPay-GitHub-V5.3.4.3-PERMISSIONS-REPORT-COMPANY-PARTNER-UI.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP in repository root"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/ghadir-v5343
          mkdir -p /tmp/ghadir-v5343
          unzip -q "$ZIP" -d /tmp/ghadir-v5343
          ROOT="$(find /tmp/ghadir-v5343 -type f -name app.html -print0 | while IFS= read -r -d '' f; do d="$(dirname "$f")"; if [ -f "$d/index.php" ]; then echo "$d"; break; fi; done)"
          test -n "$ROOT" || { echo "::error::V5.3.4.3 runtime root not found"; exit 1; }
          test -f "$ROOT/index.php"
          test -f "$ROOT/app.html"
          test -f "$ROOT/partners/index.php"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Write embedded patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gp-patch
          echo '' | base64 -d > /tmp/gp-patch/ghadir-print-v5343.css
          echo '' | base64 -d > /tmp/gp-patch/ghadir-print-v5343.js
          echo '' | base64 -d > /tmp/gp-patch/apply_patch.py

      - name: Apply TSC and marketer patch
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          python3 /tmp/gp-patch/apply_patch.py "$ROOT"

      - name: Validate patched release
        env:
          ROOT: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"
          grep -q "function gp_effective_sender" "$ROOT/index.php"
          grep -q "if(\$p==='/print/order-label')" "$ROOT/index.php"
          grep -q "if(\$p==='/print/tsc-test')" "$ROOT/index.php"
          grep -q "print_roll12_w" "$ROOT/index.php"
          grep -q "print_roll14_w" "$ROOT/index.php"
          grep -q "print_roll16_w" "$ROOT/index.php"
          grep -q "ghadir-print-v5343.css" "$ROOT/app.html"
          grep -q "ghadir-print-v5343.js" "$ROOT/app.html"
          grep -q "مرکز چاپ و لیبل TSC" "$ROOT/ghadir-print-v5343.js"
          grep -q 'id="login"' "$ROOT/app.html"
          grep -q 'id="dashboard"' "$ROOT/app.html"
          grep -q 'data-tab="orders"' "$ROOT/app.html"
          grep -q 'data-tab="neworder"' "$ROOT/app.html"
          echo "Validation passed."

      - name: Protect production config and data
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -f "$ROOT/storage/ghadir_data.json" 2>/dev/null || true

      - name: Upload prepared package
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-V5.3.4.3-TSC-MARKETER
          path: ${{ steps.base.outputs.root }}/
          retention-days: 7

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /
          bye
          EOF

      - name: Production health check
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/

      - name: Summary
        run: |
          echo "### V5.3.4.3 + TSC / Marketer Sender" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: exact V5.3.4.3" >> "$GITHUB_STEP_SUMMARY"
          echo "- TSC TTP-244 Pro print center: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Roll 12/14/16 box profiles: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subcustomer sender: marketer address/mobile/name" >> "$GITHUB_STEP_SUMMARY"
          echo "- Header buttons: dark with white text" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production config/storage: preserved" >> "$GITHUB_STEP_SUMMARY"
