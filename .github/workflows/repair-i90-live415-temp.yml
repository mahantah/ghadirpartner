name: Repair I90 Live 415

on:
  push:
    branches:
      - main
    paths:
      - "repair-i90-live415.trigger"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp curl php-cli

      - name: Repair exactly one historical I90 record
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          FILE="__gp_repair_i90_415_${GITHUB_RUN_ID}.php"
          cat > "/tmp/$FILE" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          if(!hash_equals('__TOKEN__',(string)($_GET['token']??''))){http_response_code(403);exit('{}');}
          $cfg=require __DIR__.'/config.php';$m=$cfg['mysql']??[];
          try{
            $pdo=new PDO(
              'mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4'),
              (string)($m['username']??''),(string)($m['password']??''),
              [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,PDO::ATTR_EMULATE_PREPARES=>false]
            );
            $pdo->beginTransaction();
            $row=$pdo->query("SELECT state_json,revision FROM ghadir_state WHERE id=1 FOR UPDATE")->fetch();
            if(!$row)throw new RuntimeException('state missing');
            $s=json_decode((string)$row['state_json'],true);
            if(!is_array($s))throw new RuntimeException('state invalid');

            $count=function(array $state):array{
              $free=$reserved=$current=0;
              foreach($state['inventory']??[] as $iv){
                if(stripos((string)($iv['product']??''),'I90')===false)continue;
                if((int)($iv['warehouse_id']??0)!==1)continue;
                $current++;
                if((int)($iv['order_id']??0)>0)$reserved++; else $free++;
              }
              return ['free'=>$free,'reserved'=>$reserved,'current'=>$current];
            };
            $before=$count($s);

            $targetIndex=-1;
            foreach($s['inventory']??[] as $i=>$iv){
              if((int)($iv['id']??0)!==13292)continue;
              if((int)($iv['carton_id']??0)!==367)throw new RuntimeException('target carton changed');
              if(stripos((string)($iv['product']??''),'I90')===false)throw new RuntimeException('target product changed');
              if((int)($iv['warehouse_id']??0)!==0)throw new RuntimeException('target warehouse already changed');
              if((int)($iv['order_id']??0)!==-39)throw new RuntimeException('target order id changed');
              if(trim((string)($iv['order_number']??''))!=='خروج تاریخی')throw new RuntimeException('target historical marker changed');
              $targetIndex=$i;break;
            }
            if($targetIndex<0)throw new RuntimeException('target record not found');

            if($before['free']!==394||$before['reserved']!==20||$before['current']!==414){
              throw new RuntimeException('live counts changed; refusing automatic repair');
            }

            $backupDir=__DIR__.'/storage/Backups';@mkdir($backupDir,0750,true);
            $backup='pre-i90-live415-repair-'.date('Ymd-His').'.json';
            $raw=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT|JSON_INVALID_UTF8_SUBSTITUTE);
            if($raw===false||file_put_contents($backupDir.'/'.$backup,$raw,LOCK_EX)===false)throw new RuntimeException('backup failed');

            $serial=(string)($s['inventory'][$targetIndex]['serial']??'');
            $product=(string)($s['inventory'][$targetIndex]['product']??'دستگاه كارتخوان I90');
            $s['inventory'][$targetIndex]['warehouse_id']=1;
            $s['inventory'][$targetIndex]['order_id']=0;
            $s['inventory'][$targetIndex]['order_number']='';
            $s['inventory'][$targetIndex]['warehouse_last_moved_at']=date('Y-m-d H:i:s');
            $s['inventory'][$targetIndex]['inventory_repair_note']='اصلاح خروج تاریخی اشتباه؛ بازگشت به انبار عمده';
            $s['inventory'][$targetIndex]['inventory_repaired_at']=date('Y-m-d H:i:s');

            foreach($s['cartons']??[] as &$ct){
              if((int)($ct['id']??0)===367){$ct['warehouse_id']=1;break;}
            }
            unset($ct);

            if(!isset($s['warehouse_movements'])||!is_array($s['warehouse_movements']))$s['warehouse_movements']=[];
            $next=(int)($s['next_warehouse_movement']??1);
            if($next<1){$next=1;foreach($s['warehouse_movements'] as $mv)$next=max($next,(int)($mv['id']??0)+1);}
            $s['warehouse_movements'][]=[
              'id'=>$next,'type'=>'adjustment','product'=>$product,'qty'=>1,'serials'=>[$serial],
              'from_warehouse_id'=>0,'to_warehouse_id'=>1,'order_id'=>0,'order_number'=>'',
              'note'=>'اصلاح موجودی: حذف خروج تاریخی اشتباه از I90-126',
              'created_at'=>date('Y-m-d H:i:s'),'created_by'=>'system-repair'
            ];
            $s['next_warehouse_movement']=$next+1;

            $after=$count($s);
            if($after['free']!==395||$after['reserved']!==20||$after['current']!==415){
              throw new RuntimeException('post-repair counts invalid');
            }

            $encoded=json_encode($s,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE);
            if($encoded===false)throw new RuntimeException('encode failed');
            $revision=(int)$row['revision']+1;
            $checksum=hash('sha256',$encoded);
            $st=$pdo->prepare("UPDATE ghadir_state SET state_json=?,revision=?,checksum=?,updated_at=NOW() WHERE id=1");
            $st->execute([$encoded,$revision,$checksum]);
            $pdo->prepare("INSERT INTO ghadir_state_audit (revision,checksum,bytes) VALUES (?,?,?)")->execute([$revision,$checksum,strlen($encoded)]);
            $pdo->commit();

            echo json_encode(['ok'=>true,'backup'=>$backup,'before'=>$before,'after'=>$after,'revision'=>$revision],JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){
            if(isset($pdo)&&$pdo instanceof PDO&&$pdo->inTransaction())$pdo->rollBack();
            http_response_code(500);
            echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE);
          }
          PHP
          python3 - <<PY
          p="/tmp/$FILE"
          s=open(p).read().replace('__TOKEN__',"$TOKEN")
          open(p,'w').write(s)
          PY
          cleanup(){
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          RESP="$(curl -fsS --max-time 40 "https://ghadirpartner.ir/$FILE?token=$TOKEN")"
          echo "$RESP"
          echo "$RESP" | php -r '$x=json_decode(stream_get_contents(STDIN),true);if(empty($x["ok"]))exit(2);if(($x["after"]["free"]??0)!==395||($x["after"]["reserved"]??0)!==20||($x["after"]["current"]??0)!==415)exit(3);'
