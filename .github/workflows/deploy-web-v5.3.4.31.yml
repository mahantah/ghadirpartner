name: Deploy Web V5.3.4.31 Homa senderId

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli curl nodejs

      - name: Locate and validate release
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME="GhadirPartner-Web-V5.3.4.31-HOMA-SENDERID.zip"
          BUNDLE_NAME="GhadirPartner-V5.3.4.31-GITHUB-BUNDLE.zip"
          ZIP="$(find . -type f -name "$RELEASE_NAME" -print -quit || true)"
          if [ -z "$ZIP" ]; then
            BUNDLE="$(find . -type f -name "$BUNDLE_NAME" -print -quit || true)"
            if [ -n "$BUNDLE" ]; then
              rm -rf /tmp/ghadir-bundle-v53431
              mkdir -p /tmp/ghadir-bundle-v53431
              unzip -q "$BUNDLE" -d /tmp/ghadir-bundle-v53431
              ZIP="$(find /tmp/ghadir-bundle-v53431 -type f -name "$RELEASE_NAME" -print -quit || true)"
            fi
          fi
          test -n "$ZIP" || { echo "::error::Release ZIP not found"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/ghadir-v53431
          mkdir -p /tmp/ghadir-v53431
          unzip -q "$ZIP" -d /tmp/ghadir-v53431
          ROOT=/tmp/ghadir-v53431
          grep -qx 'V5.3.4.31-HOMA-SENDERID' "$ROOT/VERSION.txt"
          grep -q "\['senderId'\]" "$ROOT/index.php"
          grep -q "\['senderId'\]" "$ROOT/partners/index.php"
          grep -q "50004310005294" "$ROOT/index.php"
          grep -q "CURLOPT_TIMEOUT=>30" "$ROOT/index.php"
          grep -q "ops-v53430.js" "$ROOT/app.html"
          grep -q "order-status-cancel" "$ROOT/assets/ops-v53430.css"
          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"
          php -l "$ROOT/lib/labels-v5348.php"
          node --check "$ROOT/assets/ops-v53430.js"
          node --check "$ROOT/assets/business-v53427.js"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Protect production config and data
        env:
          ROOT: ${{ steps.rel.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -rf "$ROOT/storage" 2>/dev/null || true

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF2
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob backups/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /
          bye
          EOF2

      - name: Health check
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/
