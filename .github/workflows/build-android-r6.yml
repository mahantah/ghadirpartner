name: Build Android R6

on:
  workflow_dispatch:
  push:
    paths:
      - "android-r6/**"
      - ".github/workflows/build-android-r6.yml"
      - "build-android-r6.trigger"

permissions:
  contents: read

concurrency:
  group: ghadirpartner-android-r6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version

      - name: Build installable APK
        working-directory: android-r6
        run: |
          /tmp/gradle-8.7/bin/gradle clean assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../GhadirPartner-R6.apk

      - name: Package source
        run: |
          zip -qr GhadirPartner-Android-R6-Source.zip android-r6             -x "android-r6/.gradle/*"             -x "android-r6/app/build/*"             -x "android-r6/build/*"
          sha256sum GhadirPartner-R6.apk GhadirPartner-Android-R6-Source.zip > GhadirPartner-R6-SHA256.txt

      - name: Upload R6 package
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Android-R6
          retention-days: 30
          if-no-files-found: error
          path: |
            GhadirPartner-R6.apk
            GhadirPartner-Android-R6-Source.zip
            GhadirPartner-R6-SHA256.txt
