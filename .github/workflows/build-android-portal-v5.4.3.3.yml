name: Build Ghadir Partner Portal APK v5.4.3.3

on:
  workflow_dispatch:
    inputs:
      android_zip:
        description: 'Exact Android project ZIP filename in repository root'
        required: true
        default: 'GhadirPartner-Android-Native-V5.4.3.3-FINAL.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        id: project
        env:
          ANDROID_ZIP: ${{ inputs.android_zip }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(basename "$ANDROID_ZIP")"
          test "$ZIP" = "$ANDROID_ZIP" || { echo "::error::ZIP must be in repository root"; exit 1; }
          test -f "$ZIP" || { echo "::error::Android ZIP not found: $ZIP"; ls -lah; exit 1; }
          unzip -t "$ZIP" >/dev/null || { echo "::error::Invalid ZIP: $ZIP"; exit 1; }
          rm -rf /tmp/ghadir-native && mkdir -p /tmp/ghadir-native
          unzip -q "$ZIP" -d /tmp/ghadir-native
          ROOT="/tmp/ghadir-native"
          if [[ ! -f "$ROOT/settings.gradle" ]]; then
            ROOT="$(find /tmp/ghadir-native -maxdepth 2 -type f -name settings.gradle -printf '%h\n' | head -n1 || true)"
          fi
          test -n "$ROOT" && test -f "$ROOT/settings.gradle" || { echo "::error::settings.gradle not found"; find /tmp/ghadir-native -maxdepth 3 -type f | sort | head -100; exit 1; }
          test -f "$ROOT/app/build.gradle" || { echo "::error::app/build.gradle not found"; exit 1; }
          grep -q "versionName '5.4.3.3'" "$ROOT/app/build.gradle" || { echo "::error::Expected Android versionName 5.4.3.3"; exit 1; }
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build installable customer Portal APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean assemblePortalDebug --stacktrace 2>&1 | tee /tmp/android-v5433-build.log

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          SRC="$ROOT/app/build/outputs/apk/portal/debug/app-portal-debug.apk"
          test -f "$SRC" || { echo "::error::APK output not found"; find "$ROOT/app/build/outputs" -type f 2>/dev/null || true; exit 1; }
          mkdir -p /tmp/apks
          cp "$SRC" /tmp/apks/GhadirPartner-Portal-V5.4.3.3-INSTALL.apk
          sha256sum /tmp/apks/*.apk > /tmp/apks/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Portal-APK-v5.4.3.3
          path: |
            /tmp/apks/GhadirPartner-Portal-V5.4.3.3-INSTALL.apk
            /tmp/apks/SHA256SUMS.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-v5.4.3.3-Build-Log
          path: /tmp/android-v5433-build.log
          if-no-files-found: ignore
