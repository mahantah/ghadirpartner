name: Deploy GhadirPay to cPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ftp:ssl-auth TLS;
          set ssl:verify-certificate yes;
          set net:max-retries 3;

          open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" ftp://$FTP_SERVER:21;

          mirror -R \
            --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob .cpanel.yml \
            --exclude-glob README_GITHUB.md \
            --exclude-glob README_FA_ORIGINAL.md \
            --exclude-glob WORK_PROJECT.md \
            --exclude-glob SHA256SUMS.txt \
            --exclude-glob storage/ghadir_data.json \
            --exclude-glob config.php \
            --exclude-glob '*.zip' \
            ./ /;

          bye
          "
