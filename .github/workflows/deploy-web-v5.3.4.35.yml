name: Deploy Web V5.3.4.35 Bale PHP74 Compat

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli curl nodejs
      - name: Locate and validate release
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME="GhadirPartner-Web-V5.3.4.35-BALE-PHP74-COMPAT.zip"
          BUNDLE_NAME="GhadirPartner-V5.3.4.35-GITHUB-BUNDLE.zip"
          ZIP="$(find . -type f -name "$RELEASE_NAME" -print -quit || true)"
          if [ -z "$ZIP" ]; then
            BUNDLE="$(find . -type f -name "$BUNDLE_NAME" -print -quit || true)"
            if [ -n "$BUNDLE" ]; then
              rm -rf /tmp/ghadir-bundle-v53435
              mkdir -p /tmp/ghadir-bundle-v53435
              unzip -q "$BUNDLE" -d /tmp/ghadir-bundle-v53435
              ZIP="$(find /tmp/ghadir-bundle-v53435 -type f -name "$RELEASE_NAME" -print -quit || true)"
            fi
          fi
          test -n "$ZIP" || { echo "::error::Release ZIP not found"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/ghadir-v53435
          mkdir -p /tmp/ghadir-v53435
          unzip -q "$ZIP" -d /tmp/ghadir-v53435
          ROOT=/tmp/ghadir-v53435
          grep -qx 'V5.3.4.35-BALE-PHP74-COMPAT' "$ROOT/VERSION.txt"
          grep -q "bp_has" "$ROOT/bale/lib.php"
          grep -q "diagnostic.php" "$ROOT/RELEASE_V5.3.4.35_FA.txt"
          ! grep -R -E "str_contains|str_starts_with|return match|int\|string" "$ROOT/bale"/*.php
          php -l "$ROOT/index.php"
          php -l "$ROOT/bale/lib.php"
          php -l "$ROOT/bale/setup.php"
          php -l "$ROOT/bale/webhook.php"
          php -l "$ROOT/bale/diagnostic.php"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Protect production config and data
        env:
          ROOT: ${{ steps.rel.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -rf "$ROOT/storage" 2>/dev/null || true
      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2             --exclude-glob config.php             --exclude-glob partners/config.php             --exclude-glob .env             --exclude-glob .env.*             --exclude-glob storage/**             --exclude-glob backups/**             --exclude-glob '*.sql'             --exclude-glob '*.zip'             "$ROOT/" /
          bye
          EOF
      - name: Health check
        run: |
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -sS --retry 2 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/bale/setup.php || true
