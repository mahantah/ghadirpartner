name: Deploy partial shipment batch report fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp php-cli curl nodejs

      - name: Download current live files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gp-live /tmp/gp-rollback
          mkdir -p /tmp/gp-live /tmp/gp-rollback
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-live/index.php
          get /app.html -o /tmp/gp-live/app.html
          bye
          EOF
          cp /tmp/gp-live/index.php /tmp/gp-rollback/index.php
          cp /tmp/gp-live/app.html /tmp/gp-rollback/app.html

      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-partial-shipment-per-serial.py /tmp/gp-live
          php -l /tmp/gp-live/index.php
          grep -q 'PARTIAL_SHIPMENT_BATCH_EXPORT_20261010' /tmp/gp-live/index.php
          grep -q 'PARTIAL_SHIPMENT_BATCH_REPORT_20261010' /tmp/gp-live/app.html
          node - /tmp/gp-live/app.html <<'NODE'
          const fs=require('fs'),p=process.argv[2],h=fs.readFileSync(p,'utf8');
          const a=h.indexOf('/* PARTIAL_SHIPMENT_BATCH_REPORT_20261010 */');
          const b=h.indexOf("let EXIT_SORT=",a);
          if(a<0||b<0)throw new Error('batch report JS block missing');
          eval(h.slice(a,b));
          const o={shipment_batches:[
            {at:'2026-10-09 10:00:00',by:'a',items:[{product:'TEST',qty:2,serials:['S1','S2']}]},
            {at:'2026-10-10 10:00:00',by:'b',items:[{product:'TEST',qty:2,serials:['S1','S3']}]}
          ]};
          const e=exitEvents(o);
          if(e.length!==2||e[0].items[0].qty!==2||e[1].items[0].qty!==1)throw new Error('duplicate serial was not removed from later batch');
          if(e[1].items[0].serials[0]!=='S3')throw new Error('wrong serial in second batch');
          console.log('shipment batch JS test OK');
          NODE

      - name: Deploy patched report logic
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-live/index.php -o /index.php
          put /tmp/gp-live/app.html -o /app.html
          bye
          EOF

      - name: Verify live
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gp-verify && mkdir -p /tmp/gp-verify
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-verify/index.php
          get /app.html -o /tmp/gp-verify/app.html
          bye
          EOF
          php -l /tmp/gp-verify/index.php
          grep -q 'PARTIAL_SHIPMENT_BATCH_EXPORT_20261010' /tmp/gp-verify/index.php
          grep -q 'PARTIAL_SHIPMENT_BATCH_REPORT_20261010' /tmp/gp-verify/app.html
          curl -fsS --max-time 25 https://ghadirpartner.ir/healthz >/tmp/health.json
          cat /tmp/health.json

      - name: Roll back on failure
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          test -f /tmp/gp-rollback/index.php || exit 0
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-rollback/index.php -o /index.php
          put /tmp/gp-rollback/app.html -o /app.html
          bye
          EOF
