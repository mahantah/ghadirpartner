name: Deploy Web V5.3.4.10 Horizontal Shipping Labels READY R1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prebuilt V5.3.4.10 R1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli

      - name: Extract ready release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          ZIP="GhadirPartner-Web-V5.3.4.10-HORIZONTAL-SHIPPING-LABELS-READY-R1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Release ZIP is missing from repository root: $ZIP"
            exit 1
          fi

          unzip -t "$ZIP" >/dev/null

          rm -rf /tmp/ghadir-v5350-r1
          mkdir -p /tmp/ghadir-v5350-r1
          unzip -q "$ZIP" -d /tmp/ghadir-v5350-r1
          ROOT="/tmp/ghadir-v5350-r1"

          for f in \
            index.php \
            app.html \
            partners/index.php \
            assets/bugfix-v5349.js \
            assets/bugfix-v5349.css \
            ghadir-print-v5349.js \
            lib/labels-v5348.php \
            assets/qrcode-v5349.js \
            VERSION.txt
          do
            if [ ! -f "$ROOT/$f" ]; then
              echo "::error::Required file missing: $f"
              exit 1
            fi
          done

          if ! grep -q 'V5.3.4.10-HORIZONTAL-SHIPPING-LABELS-READY' "$ROOT/VERSION.txt"; then
            echo "::error::VERSION.txt does not match V5.3.4.10 READY"
            cat "$ROOT/VERSION.txt" || true
            exit 1
          fi

          if ! grep -q 'gp_print_carton_labels_three_up' "$ROOT/index.php"; then
            echo "::error::Warehouse 3-up label function is missing"
            exit 1
          fi

          if ! grep -q 'qrcode-v5349.js' "$ROOT/lib/labels-v5348.php"; then
            echo "::error::Local QR renderer reference is missing"
            exit 1
          fi

          if ! grep -q 'openNewOrderFromDashboard' "$ROOT/app.html"; then
            echo "::error::Dashboard new-order fix is missing"
            exit 1
          fi

          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Release validation passed."

      - name: Protect production config and data
        env:
          ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -f "$ROOT/storage/ghadir_data.json" 2>/dev/null || true

      - name: Upload prepared artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Web-V5.3.4.10-HORIZONTAL-SHIPPING-LABELS-R1
          path: ${{ steps.release.outputs.root }}/
          retention-days: 7

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25

          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"

          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /

          bye
          EOF

      - name: Production health check
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/

      - name: Summary
        run: |
          echo "### GhadirPartner V5.3.4.10 R1 deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- VERSION validation mismatch fixed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Horizontal shipping label / dispatch slip kept" >> "$GITHUB_STEP_SUMMARY"
          echo "- QR + barcode kept" >> "$GITHUB_STEP_SUMMARY"
          echo "- Warehouse 3-up labels kept" >> "$GITHUB_STEP_SUMMARY"
