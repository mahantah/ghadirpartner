name: Validate Two Warehouses And Returns

on:
  push:
    branches:
      - feature-two-warehouses-returns-20261004

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate PHP
        run: |
          php -l index.php
          php -l partners/index.php
          php -l lib/storage.php
      - name: Validate app inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('app.html','utf8');
          const re=/<script[^>]*>([\s\S]*?)<\/script>/gi;
          let m,n=0;
          while((m=re.exec(html))){new Function(m[1]);n++}
          if(!n)throw new Error('No script blocks found');
          console.log('JS syntax OK:',n);
          NODE
      - name: Verify features
        run: |
          grep -q "انبار خرده تهرانپارس" app.html
          grep -q "/api/warehouse/transfer" index.php
          grep -q "/api/order/return" index.php
          grep -q "ghadir_warehouse_exit_order" lib/storage.php
          grep -q "warehouseDaily" app.html
