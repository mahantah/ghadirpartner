name: Hotfix production mixed payment order HTTP 422

on:
  pull_request:
    paths:
      - '.github/workflows/hotfix-mixed-order-422.yml'
      - 'scripts/hotfix_mixed_order.py'
      - 'tests/test_hotfix_mixed_order.py'
      - 'config/mixed-settlement-hotfix.yaml'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-mixed-order-422.yml']

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Check the two target sources and guarded rollback tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.14.3 mypy==1.18.2
          ruff check --select E,F,I,UP --output-format concise scripts/hotfix_mixed_order.py tests/test_hotfix_mixed_order.py
          ruff format --check scripts/hotfix_mixed_order.py tests/test_hotfix_mixed_order.py
          mypy --strict scripts/hotfix_mixed_order.py
          python3 -m py_compile scripts/hotfix_mixed_order.py tests/test_hotfix_mixed_order.py
          python3 -m unittest discover -s tests -p 'test_hotfix_mixed_order.py' -v
          python3 -m json.tool config/mixed-settlement-hotfix.yaml >/dev/null
          php -l lib/customer-credit.php
          php -l lib/native-order-flow.php
          php tests/customer-credit.php
          php tests/native-order-flow.php
  hotfix:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Publish only the fingerprinted mixed-payment PHP dependencies over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/hotfix_mixed_order.py
