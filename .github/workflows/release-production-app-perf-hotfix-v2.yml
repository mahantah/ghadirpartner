name: Release Production App Perf Hotfix V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate patch anchors against live app.html
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://ghadirpartner.ir/app.html -o /tmp/gp-live-app.html
          python3 -c "
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from patch_smart_list_perf_v1 import patch_smart_list_html
          t = Path('/tmp/gp-live-app.html').read_text(encoding='utf-8')
          patch_smart_list_html(t)
          "
          node --check assets/search-filter-fab-v1.js
          grep -Fq 'window.__gpBusy' assets/search-filter-fab-v1.js
          grep -Fq 'hardenBoot' assets/customer-ops-stabilize-v1.js
          python3 -m py_compile scripts/patch_smart_list_perf_v1.py scripts/deploy-production-app-perf-hotfix-v2.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Deploy
        run: python3 scripts/deploy-production-app-perf-hotfix-v2.py deploy
      - name: Verify live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html | grep -Fq 'GP_APP_PERF_HOTFIX_V2_20261026'
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html | grep -Fq 'search-filter-fab-v1.js?v=2'
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html | grep -Fq 'customer-ops-stabilize-v1.js?v=3'
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html | grep -Fq 'GP_SMART_LIST_PERF_HOTFIX_V1_20261026'
          curl -fsSL --max-time 30 https://ghadirpartner.ir/assets/search-filter-fab-v1.js?v=2 | grep -Fq 'window.__gpBusy'
