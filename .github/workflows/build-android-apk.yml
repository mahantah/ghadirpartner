name: Build Ghadir Partner Android APK

on:
  workflow_dispatch:
    inputs:
      android_zip:
        description: 'Exact Android project ZIP filename in repository root'
        required: true
        default: 'GhadirPartner-Android-V5.3.0.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract exact Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ github.event.inputs.android_zip }}"
          test -f "$ZIP" || { echo "Android ZIP not found: $ZIP"; exit 1; }
          rm -rf /tmp/ghadir-android
          mkdir -p /tmp/ghadir-android
          unzip -q "$ZIP" -d /tmp/ghadir-android
          ROOT="/tmp/ghadir-android"
          if [[ ! -f "$ROOT/settings.gradle" ]]; then
            FIRST_DIR="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
            if [[ -n "$FIRST_DIR" && -f "$FIRST_DIR/settings.gradle" ]]; then ROOT="$FIRST_DIR"; fi
          fi
          test -f "$ROOT/settings.gradle" || { echo "settings.gradle not found"; exit 1; }
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Build Portal and Automation APKs
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          gradle --no-daemon clean assemblePortalDebug assembleAutomationDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.root }}"
          mkdir -p /tmp/apks
          cp "$ROOT/app/build/outputs/apk/portal/debug/app-portal-debug.apk" /tmp/apks/GhadirPartner-Portal-V5.3.0.0.apk
          cp "$ROOT/app/build/outputs/apk/automation/debug/app-automation-debug.apk" /tmp/apks/GhadirPartner-Automation-V5.3.0.0.apk
          sha256sum /tmp/apks/*.apk | tee /tmp/apks/SHA256SUMS.txt

      - name: Upload Portal APK
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Portal-APK
          path: /tmp/apks/GhadirPartner-Portal-V5.3.0.0.apk

      - name: Upload Automation APK
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Automation-APK
          path: /tmp/apks/GhadirPartner-Automation-V5.3.0.0.apk

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: APK-SHA256
          path: /tmp/apks/SHA256SUMS.txt
