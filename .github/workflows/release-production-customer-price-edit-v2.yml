name: Release Production Customer Price Edit V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  price-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate visible edit for existing customers
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_production_customer_price_edit_v2.py
          python3 -m py_compile scripts/deploy-production-customer-price-edit-v2.py
          python3 tests/production-customer-price-edit-v2.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish visible price editor
        run: python3 scripts/deploy-production-customer-price-edit-v2.py deploy
      - name: Confirm live list has edit button
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_CUSTOMER_PRICE_ACCESS_EDIT_V2_20261025' /tmp/live-app.html
          grep -Fq 'openCustomerPriceEdit' /tmp/live-app.html
          grep -Fq 'ویرایش قیمت' /tmp/live-app.html
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
