name: Diagnose I90 History V39D

on:
  workflow_dispatch:
  push:
    paths:
      - "diagnose-i90-v39d.trigger"

permissions:
  contents: read

concurrency:
  group: ghadirpartner-i90-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp curl jq
      - name: Build diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$TOKEN"
          echo "DIAG_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          cat > /tmp/diag-i90-v39d.php <<'PHP'
          <?php
          declare(strict_types=1);
          const DIAG_TOKEN='__TOKEN__';
          header('Content-Type: application/json; charset=utf-8');

          function out(array $x,int $code=200):void{
              http_response_code($code);
              echo json_encode($x,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE);
              exit;
          }
          function is_i90($v):bool{
              $v=strtr(trim((string)$v),['ك'=>'ک','ي'=>'ی','ى'=>'ی','ـ'=>'']);
              $k=preg_replace('/[^a-z0-9]/i','',strtolower($v))??'';
              return strpos($k,'i90')!==false;
          }
          function pdo_from_config(array $cfg):PDO{
              $m=$cfg['mysql']??[];
              $dsn='mysql:host='.($m['host']??'localhost').';port='.(int)($m['port']??3306).';dbname='.($m['database']??'').';charset='.($m['charset']??'utf8mb4');
              return new PDO($dsn,$m['username']??'',$m['password']??'',[
                  PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES=>false
              ]);
          }
          function free_i90(array $s):array{
              $out=[];
              foreach($s['inventory']??[] as $iv){
                  if(!is_i90($iv['product']??'')||(int)($iv['order_id']??0)!==0)continue;
                  $sn=strtoupper(trim((string)($iv['serial']??'')));
                  if($sn!=='')$out[$sn]=[
                    'serial'=>$sn,'carton_code'=>(string)($iv['carton_code']??''),
                    'carton_id'=>(int)($iv['carton_id']??0),'shelf_level'=>(int)($iv['shelf_level']??0)
                  ];
              }
              return $out;
          }
          function scan_state(array $b,array $free,string $source,array &$ever):int{
              $matched=0;
              foreach($b['inventory']??[] as $iv){
                  if(!is_i90($iv['product']??''))continue;
                  $oid=(int)($iv['order_id']??0);if($oid===0)continue;
                  $sn=strtoupper(trim((string)($iv['serial']??'')));
                  if($sn===''||!isset($free[$sn]))continue;
                  if(!isset($ever[$sn]))$ever[$sn]=['serial'=>$sn,'sources'=>[],'orders'=>[],'carton_code'=>$free[$sn]['carton_code']];
                  $ever[$sn]['sources'][$source]=true;
                  $ever[$sn]['orders'][$oid]=(string)($iv['order_number']??'');
                  $matched++;
              }
              return $matched;
          }

          if(!hash_equals(DIAG_TOKEN,(string)($_SERVER['HTTP_X_DIAG_TOKEN']??'')))out(['ok'=>false,'error'=>'forbidden'],403);
          $cfg=require __DIR__.'/config.php';
          $pdo=pdo_from_config($cfg);
          $row=$pdo->query('SELECT state_json,revision,updated_at FROM ghadir_state WHERE id=1')->fetch();
          if(!$row)out(['ok'=>false,'error'=>'state_missing'],500);
          $s=json_decode((string)$row['state_json'],true);
          if(!is_array($s))out(['ok'=>false,'error'=>'state_invalid'],500);
          $free=free_i90($s);$ever=[];$fileStats=[];$files=[];

          foreach([__DIR__.'/storage',__DIR__.'/backups',__DIR__.'/Backups'] as $root){
              if(!is_dir($root))continue;
              try{
                  $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS));
                  foreach($it as $f){
                      if(!$f->isFile())continue;
                      if(strtolower($f->getExtension())!=='json')continue;
                      $size=$f->getSize();
                      if($size<1000||$size>100000000)continue;
                      $files[$f->getPathname()]=$f->getMTime();
                  }
              }catch(Throwable $e){}
          }
          arsort($files);
          $files=array_slice($files,0,120,true);
          foreach($files as $file=>$mtime){
              $raw=@file_get_contents($file);if($raw===false||$raw==='')continue;
              $b=json_decode($raw,true);if(!is_array($b)||!isset($b['inventory']))continue;
              $before=count($ever);
              $rowMatches=scan_state($b,$free,basename($file),$ever);
              if($rowMatches>0)$fileStats[]=[
                'file'=>basename($file),'mtime'=>date('Y-m-d H:i:s',$mtime),
                'matched_rows'=>$rowMatches,'new_unique'=>count($ever)-$before
              ];
          }

          $manual=[];
          try{
              $table=$pdo->query("SHOW TABLES LIKE 'ghadir_state_manual_backup'")->fetchColumn();
              if($table){
                  $cols=$pdo->query("SHOW COLUMNS FROM ghadir_state_manual_backup")->fetchAll();
                  $jsonCols=[];
                  foreach($cols as $c){
                      $n=(string)$c['Field'];
                      if(stripos($n,'json')!==false||stripos($n,'state')!==false||stripos($n,'backup')!==false)$jsonCols[]=$n;
                  }
                  $rows=$pdo->query("SELECT * FROM ghadir_state_manual_backup ORDER BY id DESC LIMIT 60")->fetchAll();
                  foreach($rows as $r){
                      foreach($jsonCols as $col){
                          $raw=(string)($r[$col]??'');if($raw==='')continue;
                          $b=json_decode($raw,true);if(!is_array($b)||!isset($b['inventory']))continue;
                          $before=count($ever);
                          $m=scan_state($b,$free,'mysql#'.($r['id']??'?').':'.$col,$ever);
                          if($m>0)$manual[]=[
                            'id'=>$r['id']??null,'column'=>$col,'matched_rows'=>$m,'new_unique'=>count($ever)-$before
                          ];
                      }
                  }
              }
          }catch(Throwable $e){
              $manual[]=['error'=>$e->getMessage()];
          }

          $byCarton=[];$byOrder=[];$multiOrder=0;
          foreach($ever as $sn=>$e){
              $cc=$e['carton_code']!==''?$e['carton_code']:'بدون کارتن';
              $byCarton[$cc]=($byCarton[$cc]??0)+1;
              if(count($e['orders'])>1)$multiOrder++;
              foreach($e['orders'] as $oid=>$on){
                  $key=$oid.'|'.$on;$byOrder[$key]=($byOrder[$key]??0)+1;
              }
          }
          arsort($byCarton);arsort($byOrder);
          $sample=[];
          foreach(array_slice($ever,0,30,true) as $sn=>$e){
              $sample[]=[
                'serial'=>$sn,'carton'=>$e['carton_code'],
                'orders'=>$e['orders'],'sources'=>array_slice(array_keys($e['sources']),0,5)
              ];
          }

          out([
            'ok'=>true,'revision'=>(int)$row['revision'],'updated_at'=>$row['updated_at'],
            'current_free_i90'=>count($free),
            'free_serials_ever_assigned_in_snapshots'=>count($ever),
            'multiple_order_matches'=>$multiOrder,
            'backup_files_scanned'=>count($files),
            'backup_files_with_matches'=>$fileStats,
            'manual_backup_matches'=>$manual,
            'matches_by_carton'=>$byCarton,
            'matches_by_order'=>array_slice($byOrder,0,40,true),
            'sample'=>$sample
          ]);
          PHP
          sed -i "s/__TOKEN__/$TOKEN/g" /tmp/diag-i90-v39d.php
          php -l /tmp/diag-i90-v39d.php

      - name: Upload endpoint
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/diag-i90-v39d.php -o /diag-i90-v39d.php
          bye
          EOF

      - name: Run diagnostic
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -sS --max-time 120 -H "X-Diag-Token: $DIAG_TOKEN" https://ghadirpartner.ir/diag-i90-v39d.php)"
          echo "$RESP" | jq .
          test "$(echo "$RESP" | jq -r '.ok // false')" = "true"

      - name: Cleanup endpoint
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm /diag-i90-v39d.php
          bye
          EOF
          true
