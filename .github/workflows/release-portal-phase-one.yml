name: Release portal phase one
on:
  pull_request:
    paths: ['.github/workflows/release-portal-phase-one.yml', 'scripts/release-portal-phase-one.py', 'scripts/stage-customer-purchase-report.py', 'assets/portal-phase-two*', 'assets/automation-animated-checkbox.css', 'assets/portal-wallet-report.js', 'lib/order-wallet.php', 'lib/credit-checkout.php', 'lib/customer-credit.php', 'lib/portal-wallet-report-route.php', 'lib/order-followup*.php', 'tests/portal-wallet-report.php', '**/irankish-wallet*']
  push:
    branches: [main]
    paths: ['.github/workflows/release-portal-phase-one.yml', 'scripts/stage-customer-purchase-report.py', 'assets/portal-phase-two*', 'assets/automation-animated-checkbox.css', 'assets/portal-wallet-report.js', 'lib/order-wallet.php', 'lib/credit-checkout.php', 'lib/customer-credit.php', 'lib/portal-wallet-report-route.php', 'lib/order-followup*.php', 'tests/portal-wallet-report.php', '**/irankish-wallet*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Verify PHP fixtures and inspect live entry points
        run: |
          node --check assets/customer-purchase-report.js
          node --check assets/portal-messages.js
          node --check assets/portal-phase-two-navigation.js
          node --check assets/portal-phase-two-activity.js
          node --check assets/portal-phase-two-activity-client.js
          php tests/customer-purchase-report.php
          php tests/portal-wallet-report.php
          php tests/irankish-wallet.php
          node --check assets/irankish-wallet.js
          php tests/portal-membership.php
          php tests/portal-messages.php
          php tests/portal-activity.php
          php tests/order-proof-upload.php
          php tests/order-followup.php
          php tests/order-correction-route.php
          python3 scripts/release-portal-phase-one.py inspect
      - name: Apply and verify phase one
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/release-portal-phase-one.py apply
