name: Release approved staff OTP login (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-approved-staff-otp-20261016.yml'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: deploy user-approved staff OTP login 2026-10-16' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install required tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli nodejs
      - name: Download and validate current live release (no customer data)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/staff-otp-live" "$RUNNER_TEMP/pre-otp"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/staff-otp-live/app.html"
          get /index.php -o "$RUNNER_TEMP/staff-otp-live/index.php"
          bye
          EOF
          test -s "$RUNNER_TEMP/staff-otp-live/app.html"
          test -s "$RUNNER_TEMP/staff-otp-live/index.php"
          grep -q 'SUPPLIER_CANONICAL_BACKEND_V8_20261016' "$RUNNER_TEMP/staff-otp-live/index.php"
          grep -q 'SUPPLIER_CANONICAL_UI_V8_20261016' "$RUNNER_TEMP/staff-otp-live/app.html"
          if grep -q 'GHADIR_STAFF_LOGIN_OTP_V1_20261016' "$RUNNER_TEMP/staff-otp-live/index.php"; then
            echo 'OTP patch is already present; stop to avoid overwriting a deployed hotfix.'
            exit 1
          fi
          cp -p "$RUNNER_TEMP/staff-otp-live/index.php" "$RUNNER_TEMP/pre-otp/index.php"
          cp -p "$RUNNER_TEMP/staff-otp-live/app.html" "$RUNNER_TEMP/pre-otp/app.html"
          python3 scripts/patch-staff-login-otp-v1.py "$RUNNER_TEMP/staff-otp-live"
          php -l "$RUNNER_TEMP/staff-otp-live/index.php"
          php -l "$RUNNER_TEMP/staff-otp-live/lib/staff-login-otp.php"
          node --check "$RUNNER_TEMP/staff-otp-live/assets/staff-login-otp.js"
          node - "$RUNNER_TEMP/staff-otp-live/app.html" <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync(process.argv[2],'utf8');
          const matches=[...html.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if(!matches.length)throw new Error('No inline script found');
          for(const m of matches)new Function(m[1]);
          for(const tag of ['GHADIR_LOGIN_STARTUP_ALERT_GUARD_V1_20261016','GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016','id="staffLoginForm"','id="lu"','id="lp"']){
            if(!html.includes(tag))throw new Error('Missing expected UI tag '+tag);
          }
          NODE
      - name: Deploy only login-related files with automatic rollback on verification failure
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            status=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Validation or upload failed; restore original app.html and index.php'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/pre-otp/index.php" -o /index.php
          put "$RUNNER_TEMP/pre-otp/app.html" -o /app.html
          bye
          EOF
            fi
            exit "$status"
          }
          trap rollback ERR
          ROOT="$RUNNER_TEMP/staff-otp-live"
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$ROOT/lib/staff-login-otp.php" -o /lib/staff-login-otp.php
          put "$ROOT/assets/staff-login-otp.css" -o /assets/staff-login-otp.css
          put "$ROOT/assets/staff-login-otp.js" -o /assets/staff-login-otp.js
          put "$ROOT/assets/ghadir-logo-transparent.svg" -o /assets/ghadir-logo-transparent.svg
          put "$ROOT/index.php" -o /index.php
          put "$ROOT/app.html" -o /app.html
          bye
          EOF
          curl -fsS --max-time 20 -o "$RUNNER_TEMP/live-health.txt" https://ghadirpartner.ir/healthz
          grep -q 'V5.3.4.38' "$RUNNER_TEMP/live-health.txt"
          curl -fsS --max-time 20 -o "$RUNNER_TEMP/live-app.html" https://ghadirpartner.ir/app.html
          grep -q 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' "$RUNNER_TEMP/live-app.html"
          curl -fsS --max-time 20 -o "$RUNNER_TEMP/live-otp.js" https://ghadirpartner.ir/assets/staff-login-otp.js
          grep -q 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' "$RUNNER_TEMP/live-otp.js"
          curl -fsS --max-time 20 -o "$RUNNER_TEMP/live-otp.css" https://ghadirpartner.ir/assets/staff-login-otp.css
          grep -q 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' "$RUNNER_TEMP/live-otp.css"
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' https://ghadirpartner.ir/api/staff-login-otp/request)"
          test "$code" = '400'
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Verified live OTP entrypoints; no real SMS sent in smoke test.'