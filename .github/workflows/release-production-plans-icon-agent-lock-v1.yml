name: Release Production Plans Icon Agent Lock V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  plans-icon-agent-lock-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate plans icon agent lock v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-plans-icon-agent-lock-v1.py
          python3 tests/production-plans-icon-agent-lock-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish plans icon agent lock v1
        run: python3 scripts/deploy-production-plans-icon-agent-lock-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_PLANS_ICON_AGENT_LOCK_V1_20261025' /tmp/live-app.html
          grep -Fq 'plans-icon-agent-lock-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'customer-ops-stabilize-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/plans-icon-agent-lock-v1.js?v=1' -o /tmp/live-lock.js
          grep -Fq 'gpNavPlans' /tmp/live-lock.js
          grep -Fq 'طرح‌ها و تخفیف‌ها' /tmp/live-lock.js
          grep -Fq 'persistChannel' /tmp/live-lock.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
