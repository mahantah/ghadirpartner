name: Deploy Web Release to cPanel - Manual Safe

on:
  workflow_dispatch:
    inputs:
      release_zip:
        description: 'Exact WEB release ZIP filename in repository root'
        required: true
        default: 'GhadirPay-GitHub-V5.3.3.0-BATCH-UX-OFFERS-STOCK.zip'
        type: string

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy exact web release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli

      - name: Validate release and protect production data
        id: release
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ inputs.release_zip }}"
          BASE="$(basename "$ZIP")"

          if [[ "$ZIP" != "$BASE" ]]; then
            echo "::error::release_zip must be a filename from repository root, not a path."
            exit 1
          fi

          if [[ "$BASE" == *Android* || "$BASE" == *Native* || "$BASE" == *APK* ]]; then
            echo "::error::Android/Native/APK package rejected by WEB deploy."
            exit 1
          fi

          if [[ ! "$BASE" =~ ^GhadirPay-GitHub-V[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+.*\.zip$ ]]; then
            echo "::error::Invalid WEB release filename: $BASE"
            exit 1
          fi

          test -f "$BASE" || {
            echo "::error::Release ZIP not found: $BASE"
            ls -1 GhadirPay-GitHub-*.zip 2>/dev/null || true
            exit 1
          }

          unzip -Z1 "$BASE" > /tmp/release-files.txt

          protected_regex='(^|/)(config\.php|\.env|ghadir_data\.json)$'
          if grep -E "$protected_regex" /tmp/release-files.txt; then
            echo "::error::Release contains protected live configuration/data."
            exit 1
          fi

          if grep -E '(^|/)storage/' /tmp/release-files.txt; then
            echo "::error::Release must not contain storage/**"
            exit 1
          fi

          if grep -Ei '\.(sql|zip|apk)$' /tmp/release-files.txt; then
            echo "::error::Release contains an unexpected SQL/archive/APK file."
            exit 1
          fi

          rm -rf /tmp/ghadir-release
          mkdir -p /tmp/ghadir-release
          unzip -q "$BASE" -d /tmp/ghadir-release

          ROOT="/tmp/ghadir-release"
          if [[ ! -f "$ROOT/index.php" ]]; then
            mapfile -t TOP_DIRS < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d)
            if [[ "${#TOP_DIRS[@]}" -eq 1 && -f "${TOP_DIRS[0]}/index.php" ]]; then
              ROOT="${TOP_DIRS[0]}"
            fi
          fi

          required=(
            "VERSION.txt"
            "index.php"
            "app.html"
            "partners/index.php"
            "partners/portal.html"
            "lib/storage.php"
          )
          for f in "${required[@]}"; do
            test -f "$ROOT/$f" || {
              echo "::error::Missing required release file: $f"
              exit 1
            }
          done

          VERSION_RAW="$(tr -d '\r\n ' < "$ROOT/VERSION.txt")"
          echo "Release version: $VERSION_RAW"

          python3 - "$VERSION_RAW" <<'PY'
          import re, sys
          raw = sys.argv[1]
          m = re.search(r'V?(\d+)\.(\d+)\.(\d+)\.(\d+)', raw)
          if not m:
              raise SystemExit(f"Cannot parse VERSION.txt: {raw}")
          version = tuple(map(int, m.groups()))
          minimum = (5, 3, 3, 0)
          if version < minimum:
              raise SystemExit(f"BLOCKED: {version} is older than safe baseline {minimum}")
          print("Version gate OK:", version)
          PY

          grep -q "return 'mysql';" "$ROOT/lib/storage.php" || {
            echo "::error::MySQL-only storage guard is missing."
            exit 1
          }

          php -l "$ROOT/index.php"
          php -l "$ROOT/partners/index.php"

          echo "Selected WEB ZIP: $BASE"
          echo "SHA256: $(sha256sum "$BASE" | awk '{print $1}')"
          echo "Release root: $ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "zip=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_RAW" >> "$GITHUB_OUTPUT"

      - name: Deploy exact release over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret is missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret is missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret is missing"; exit 1; }

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"

          mirror -R --verbose --parallel=2 \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .gitignore \
            --exclude-glob .cpanel.yml \
            --exclude-glob README* \
            --exclude-glob WORK_PROJECT.md \
            --exclude-glob HOMA_SETUP.md \
            --exclude-glob MYSQL_MIGRATION.md \
            --exclude-glob SHA256SUMS.txt \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$RELEASE_ROOT/" /

          bye
          EOF

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 2 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/
          echo "Production HTTP checks passed."

      - name: Deployment summary
        run: |
          echo "### Safe WEB deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZIP: \`${{ steps.release.outputs.zip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${{ steps.release.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- MySQL-only guard: **passed**" >> "$GITHUB_STEP_SUMMARY"
          echo "- config.php / partners/config.php / storage/**: **protected**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Automatic push deploy: **disabled**" >> "$GITHUB_STEP_SUMMARY"
