name: Warehouse supplier column checks
on:
  pull_request:
    paths:
      - 'scripts/warehouse-supplier-column.ts'
      - 'scripts/patch-warehouse-supplier-column.py'
      - 'scripts/release-warehouse-supplier-column.php'
      - 'assets/warehouse-supplier-column.js'
      - 'config/warehouse-supplier-column*'
      - 'tests/warehouse-supplier-column*'
      - '.github/workflows/check-warehouse-supplier-column.yml'
      - '.github/workflows/release-warehouse-supplier-column.yml'
permissions:
  contents: read
jobs:
  supplier-column:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Install project check tools
        run: |
          npm ci --prefix tooling/partial-delivery-web --ignore-scripts --no-audit --no-fund
          python3 -m pip install ruff mypy
      - name: Type, lint, format and bounded patch checks
        run: |
          npm --prefix tooling/partial-delivery-web run check
          tooling/partial-delivery-web/node_modules/.bin/tsc -p config/warehouse-supplier-column.tsconfig.json
          git diff --exit-code -- assets/warehouse-supplier-column.js
          tooling/partial-delivery-web/node_modules/.bin/eslint --config tooling/partial-delivery-web/eslint.config.mjs scripts/warehouse-supplier-column.ts --max-warnings 0
          tooling/partial-delivery-web/node_modules/.bin/prettier --check scripts/warehouse-supplier-column.ts config/warehouse-supplier-column.tsconfig.json tests/warehouse-supplier-column.html
          python3 -m ruff check scripts/patch-warehouse-supplier-column.py tests/warehouse-supplier-column.py
          python3 -m ruff format --check scripts/patch-warehouse-supplier-column.py tests/warehouse-supplier-column.py
          python3 -m mypy --strict scripts/patch-warehouse-supplier-column.py tests/warehouse-supplier-column.py
          python3 tests/warehouse-supplier-column.py
          php -l scripts/release-warehouse-supplier-column.php
          php tests/warehouse-supplier-column-release.php
      - name: Browser regression at mobile and desktop widths
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for viewport in '390,844' '1440,900'; do
            "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --no-first-run --window-size="$viewport" --virtual-time-budget=3000 --dump-dom "file://$GITHUB_WORKSPACE/tests/warehouse-supplier-column.html" > /tmp/supplier-column-result.html 2>/tmp/supplier-column-browser.log
            grep -Fq '>SUPPLIER_COLUMN_PASS<' /tmp/supplier-column-result.html
          done
  validate-owner-source:
    needs: supplier-column
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate the live owner renderer privately without publishing code
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          private="$(mktemp -d)"
          chmod 700 "$private"
          trap 'rm -rf "$private"' EXIT
          export GP_SUPPLIER_PRIVATE_DIR="$private"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ['GP_SUPPLIER_PRIVATE_DIR'])
          def quote(value):
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
          host = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          if not host or username.lower() != 'deploy@ghadirpartner.ir' or not password:
              raise SystemExit('STOP: production read identity unavailable')
          commands = root / 'read-only.lftp'
          commands.write_text('\n'.join([
              'set cmd:fail-exit yes', 'set ftp:ssl-force true',
              'set ftp:ssl-protect-data true', 'set ssl:verify-certificate true',
              'set net:max-retries 1', 'open -p 21 ' + quote(host),
              'user ' + quote(username) + ' ' + quote(password),
              'get /app.html -o ' + quote(str(root / 'app.html')),
              'bye',
          ]) + '\n')
          commands.chmod(0o600)
          subprocess.run(['lftp', '-f', str(commands)], check=True, timeout=180)
          PY
          python3 scripts/patch-warehouse-supplier-column.py "$private/app.html" "$private/app-staged.html"
          echo 'Owner renderer matches reviewed anchors. Offline staging passed; no server or database writes.'
