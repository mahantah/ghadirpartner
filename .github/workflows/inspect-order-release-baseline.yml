name: Inspect production order release baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate read-only baseline inspector
        run: |
          php -l scripts/inspect-order-release-baseline.php
          php tests/order-release-baseline.php
          python3 -m json.tool config/native-order-release.yaml >/dev/null
          python3 -m json.tool config/customer-credit-release.yaml >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Read only the six relevant private files over FTPS and inspect hashes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d -t gp-order-inspect.XXXXXXXX)"
          cleanup() {
            if [[ "$INSPECT_DIR" == /tmp/gp-order-inspect.* ]]; then
              rm -rf -- "$INSPECT_DIR"
            fi
          }
          trap cleanup EXIT
          mkdir -p "$INSPECT_DIR/partners" "$INSPECT_DIR/lib"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get "/index.php" -o "$INSPECT_DIR/index.php"
          get "/partners/index.php" -o "$INSPECT_DIR/partners/index.php"
          get "/lib/storage.php" -o "$INSPECT_DIR/lib/storage.php"
          get "/partners/native-r54.php" -o "$INSPECT_DIR/partners/native-r54.php"
          get "/app.html" -o "$INSPECT_DIR/app.html"
          get "/partners/portal.html" -o "$INSPECT_DIR/partners/portal.html"
          bye
          EOF
          php scripts/inspect-order-release-baseline.php "$INSPECT_DIR"
