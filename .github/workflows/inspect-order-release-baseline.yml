name: Inspect production order release baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Validate read-only baseline inspector
        run: |
          php -l scripts/inspect-order-release-baseline.php
          php tests/order-release-baseline.php
          python3 -m json.tool config/native-order-release.yaml >/dev/null
          python3 -m json.tool config/customer-credit-release.yaml >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Inspect production files without publishing code or database writes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          FILE="__gp_order_baseline_${GITHUB_RUN_ID}.php"
          python3 - "$FILE" "$TOKEN" <<'PY'
          import base64, json, sys
          from pathlib import Path

          name, token = sys.argv[1:]
          manifests = {
              "native_order": json.loads(Path("config/native-order-release.yaml").read_text()),
              "customer_credit": json.loads(Path("config/customer-credit-release.yaml").read_text()),
          }
          source = Path("scripts/inspect-order-release-baseline.php").read_text()
          source = source.replace("__TOKEN__", token).replace(
              "__MANIFESTS_B64__", base64.b64encode(json.dumps(manifests).encode()).decode()
          )
          Path("/tmp/" + name).write_text(source)
          PY
          php -l "/tmp/$FILE"
          cleanup() {
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          STATUS="$(curl -sS --max-time 120 -w '%{http_code}' -X POST -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE" -o /tmp/order-baseline.json)"
          python3 - "$STATUS" <<'PY'
          import json, sys
          from pathlib import Path

          raw = Path("/tmp/order-baseline.json").read_text()
          print("HTTP status:", sys.argv[1], "response bytes:", len(raw.encode()))
          try:
              result = json.loads(raw)
          except json.JSONDecodeError:
              raise RuntimeError("inspection_endpoint_returned_non_json") from None
          print(json.dumps(result, ensure_ascii=False, indent=2))
          assert sys.argv[1] == "200" and result.get("ok") and result.get("read_only")
          PY
