name: Fix Warehouse Live Access

on:
  push:
    branches:
      - main
    paths:
      - fix-warehouse-access.trigger

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Patch live app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/whaccess
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/whaccess/app.html
          bye
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/whaccess/app.html')
          s=p.read_text()
          if "warehouseDaily:['prep','viewer']" not in s:
              old="warehouse:['prep','viewer'],reports:['prep','viewer']"
              new="warehouse:['prep','viewer'],warehouseDaily:['prep','viewer'],reports:['prep','viewer']"
              if old not in s:
                  raise SystemExit('warehouse access pattern not found')
              s=s.replace(old,new,1)
          if 'warehouseWriteOnly' not in s:
              s=s.replace(
                  '<button class="btnlight" onclick="openWarehouseReceipt()">ثبت رسید / ورود کارتن</button>',
                  '<button class="btnlight warehouseWriteOnly" onclick="openWarehouseReceipt()">ثبت رسید / ورود کارتن</button>',
                  1
              )
              s=s.replace(
                  '<div class="card warehouse-no-print">\n  <div class="section-title"><div><h3 style="margin:0">انتقال بین دو انبار</h3>',
                  '<div class="card warehouse-no-print warehouseWriteOnly">\n  <div class="section-title"><div><h3 style="margin:0">انتقال بین دو انبار</h3>',
                  1
              )
          if "querySelectorAll('.warehouseWriteOnly')" not in s:
              hook="applyPermissionVisibility();"
              repl="applyPermissionVisibility();document.querySelectorAll('.warehouseWriteOnly').forEach(x=>x.classList.toggle('hidden',!has('prep')));"
              if hook not in s:
                  raise SystemExit('permission hook not found')
              s=s.replace(hook,repl,1)
          p.write_text(s)
          PY
          grep -Fq "warehouseDaily:['prep','viewer']" /tmp/whaccess/app.html
          grep -Fq "warehouseWriteOnly" /tmp/whaccess/app.html
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/whaccess/app.html -o /app.html
          get /app.html -o /tmp/whaccess/verify.html
          bye
          EOF
          grep -Fq "warehouseDaily:['prep','viewer']" /tmp/whaccess/verify.html
          grep -Fq "warehouseWriteOnly" /tmp/whaccess/verify.html
