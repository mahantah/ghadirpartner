name: Release Production Warehouse Label V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  wh-label-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate warehouse label v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-wh-label-v1.py
          python3 tests/production-wh-label-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish warehouse label v1
        run: python3 scripts/deploy-production-wh-label-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_WH_LABEL_V1_20261026' /tmp/live-app.html
          grep -Fq 'wh-label-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'search-filter-fab-layer-v2.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/wh-label-v1.js?v=1' -o /tmp/live-wh-label.js
          grep -Fq 'تاریخچه و موجودی کالا' /tmp/live-wh-label.js
          grep -Fq 'انبار سریال' /tmp/live-wh-label.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
