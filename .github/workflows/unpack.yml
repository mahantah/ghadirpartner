name: Unpack GhadirPay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -name 'GhadirPay-GitHub-*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "Release ZIP not found"
            exit 1
          fi

          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"

          ROOT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          rsync -a \
            --exclude='.github/' \
            "$ROOT"/ ./

          rm -f "$ZIP"

      - name: Commit project files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Deploy GhadirPay release"

          git pull --rebase origin main
          git push origin HEAD:main
