name: Release Production Customer Form Polish V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  customer-form-polish-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate customer form polish v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-customer-form-polish-v1.py
          python3 tests/production-customer-form-polish-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish customer form polish v1
        run: python3 scripts/deploy-production-customer-form-polish-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_CUSTOMER_FORM_POLISH_V1_20261025' /tmp/live-app.html
          grep -Fq 'customer-form-polish-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'coop-model-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/customer-form-polish-v1.js?v=1' -o /tmp/live-polish.js
          grep -Fq 'gp-typeahead' /tmp/live-polish.js
          grep -Fq 'nextCustomerCode' /tmp/live-polish.js
          grep -Fq 'gpAssignCustomerOffers' /tmp/live-polish.js
          grep -Fq 'gpAgentsList' /tmp/live-polish.js
          grep -Fq 'gpRepsList' /tmp/live-polish.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
