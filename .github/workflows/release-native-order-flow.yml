name: Release Native Customer Order Flow R5.12
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-native-order-flow.yml']
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Validate the bounded server-side recovery tool
        run: |
          php -l scripts/release-native-order-flow.php
          php tests/native-order-release.php
          php tests/native-order-flow.php
          php tests/native-order-review-routes.php
          python3 -m json.tool config/native-order-release.yaml > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Install native order server code privately on the host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          FILE="__gp_correct_source_${GITHUB_RUN_ID}.php"
          python3 - "$FILE" "$TOKEN" <<'PY'
          import os,sys,base64,json,hashlib
          from pathlib import Path
          name,token=sys.argv[1:]
          source=Path('scripts/release-native-order-flow.php').read_text()
          integrity=Path('lib/preswitch-carton-integrity.php').read_text().removeprefix('<?php\n')
          manifest=base64.b64encode(Path('config/native-order-release.yaml').read_bytes()).decode()
          m=json.loads(Path('config/native-order-release.yaml').read_text())
          dependencies={name:base64.b64encode(Path(name).read_bytes()).decode() for name in m['expected_files'] if name not in m['before_files']}
          for dep_path,content in dependencies.items():
              assert hashlib.sha256(base64.b64decode(content)).hexdigest()==m['expected_files'][dep_path]
          packed=base64.b64encode(json.dumps(dependencies).encode()).decode()
          for old,new in {'// __INTEGRITY_CLASS__':integrity,'__TOKEN__':token,'__DEPENDENCIES_B64__':packed,'__MANIFEST_B64__':manifest,'__RUN_ID__':os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']}.items(): source=source.replace(old,new)
          Path('/tmp/'+name).write_text(source)
          PY
          php -l "/tmp/$FILE"
          cleanup(){
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          STATUS="$(curl -sS --max-time 350 -w '%{http_code}' -X POST --data 'mode=apply' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE" -o /tmp/recovery-result.json)"
          python3 - "$STATUS" <<'PY'
          import json,sys
          from pathlib import Path
          try: result=json.loads(Path('/tmp/recovery-result.json').read_text())
          except ValueError: result={'ok':False,'error':'invalid_server_response'}
          print(result)
          assert sys.argv[1]=='200' and result.get('ok') and result.get('database_changed') is False
          PY
          if ! curl -fsS --retry 1 --retry-all-errors --retry-delay 2 --max-time 40 https://ghadirpartner.ir/healthz; then
            curl -fsS --max-time 60 -X POST --data 'mode=rollback' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE"
            exit 2
          fi
          STATUS="$(curl -sS --max-time 120 -w '%{http_code}' -X POST --data 'mode=verify' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE" -o /tmp/native-verify.json)"
          if ! python3 - "$STATUS" <<'PYVERIFY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path('/tmp/native-verify.json').read_text())
          print(result)
          assert sys.argv[1]=='200' and result.get('ok') and result.get('files')==5 and result.get('protected_cartons')==18 and result.get('database_changed') is False
          PYVERIFY
          then
            curl -fsS --max-time 120 -X POST --data 'mode=rollback' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE"
            exit 3
          fi
