name: Release safe sidebar profile, logo and close (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-sidebar-profile-polish-20261017.yml'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: apply safe sidebar profile 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure transfer and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs

      - name: Copy currently-live page and validate UI-only patch
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/profile-before" "$RUNNER_TEMP/profile-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/profile-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/profile-before/app.html"
          cp "$RUNNER_TEMP/profile-before/app.html" "$RUNNER_TEMP/profile-after/app.html"
          grep -Fq 'GHADIR_NAV_MORPH_V1_20261017' "$RUNNER_TEMP/profile-after/app.html"
          grep -Fq 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017' "$RUNNER_TEMP/profile-after/app.html"
          grep -Fq 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' "$RUNNER_TEMP/profile-after/app.html"
          python3 scripts/patch-sidebar-profile-polish-v1.py "$RUNNER_TEMP/profile-after"
          grep -Fq 'GHADIR_SIDEBAR_PROFILE_POLISH_V1_20261017' "$RUNNER_TEMP/profile-after/app.html"
          grep -Fq '/assets/sidebar-profile-polish-v1.css?v=20261017p1' "$RUNNER_TEMP/profile-after/app.html"
          grep -Fq '/assets/sidebar-profile-polish-v1.js?v=20261017p1' "$RUNNER_TEMP/profile-after/app.html"
          node --check assets/sidebar-profile-polish-v1.js
          for marker in 'id="login"' 'data-tab="orders"' 'data-tab="warehouse"' 'data-tab="customers"' 'id="changePasswordBtn"' 'id="logoutbtn"'; do
            grep -Fq "$marker" "$RUNNER_TEMP/profile-after/app.html"
          done

      - name: Publish only account-menu assets and references, rollback on failure
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            code=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Sidebar profile release failed verification; restoring previous app.html'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/profile-before/app.html" -o /app.html
          rm -f /assets/sidebar-profile-polish-v1.css
          rm -f /assets/sidebar-profile-polish-v1.js
          bye
          EOF
            fi
            exit "$code"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/sidebar-profile-polish-v1.css" -o /assets/sidebar-profile-polish-v1.css
          put "assets/sidebar-profile-polish-v1.js" -o /assets/sidebar-profile-polish-v1.js
          put "$RUNNER_TEMP/profile-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/current-app.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_SIDEBAR_PROFILE_POLISH_V1_20261017' "$RUNNER_TEMP/current-app.html"
          grep -Fq '/assets/sidebar-profile-polish-v1.css?v=20261017p1' "$RUNNER_TEMP/current-app.html"
          grep -Fq '/assets/sidebar-profile-polish-v1.js?v=20261017p1' "$RUNNER_TEMP/current-app.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/current-profile.js" 'https://ghadirpartner.ir/assets/sidebar-profile-polish-v1.js?v=20261017p1'
          grep -Fq 'GHADIR_SIDEBAR_PROFILE_POLISH_V1_20261017' "$RUNNER_TEMP/current-profile.js"
          node --check "$RUNNER_TEMP/current-profile.js"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/current-profile.css" 'https://ghadirpartner.ir/assets/sidebar-profile-polish-v1.css?v=20261017p1'
          grep -Fq 'GHADIR_SIDEBAR_PROFILE_POLISH_V1_20261017' "$RUNNER_TEMP/current-profile.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/current-health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/current-health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Sidebar profile polish successfully deployed; production entrypoint, menu assets and health check passed.'
