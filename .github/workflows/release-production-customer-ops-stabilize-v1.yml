name: Release Production Customer Ops Stabilize V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  customer-ops-stabilize-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate customer ops stabilize v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-customer-ops-stabilize-v1.py
          python3 tests/production-customer-ops-stabilize-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish customer ops stabilize v1
        run: python3 scripts/deploy-production-customer-ops-stabilize-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_CUSTOMER_OPS_STABILIZE_V1_20261025' /tmp/live-app.html
          grep -Fq 'customer-ops-stabilize-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'sales-plans-menu-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'kartabl-sync-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/customer-ops-stabilize-v1.js?v=1' -o /tmp/live-stab.js
          grep -Fq 'نماینده' /tmp/live-stab.js
          grep -Fq 'طرح‌ها و تخفیف‌ها' /tmp/live-stab.js
          grep -Fq 'lightRefresh' /tmp/live-stab.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
