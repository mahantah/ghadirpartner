name: Hotfix Production Customer Price Helper
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Guard PHP 7 helper
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-customer-price-helper.py
          ! grep -nE 'mixed|strict_types|str_starts_with|match \(' lib/customer-price-access.php
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Replace live helper only
        run: python3 scripts/deploy-production-customer-price-helper.py
      - name: Confirm APIs recovered
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 https://ghadirpartner.ir/healthz
          echo
          curl -fsSL --max-time 25 https://ghadirpartner.ir/partners/healthz
          echo
