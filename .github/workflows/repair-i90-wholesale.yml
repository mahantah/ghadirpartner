name: Guarded I90 wholesale restoration repair

# Two-step release: merge tested code, then merge one explicit run-once sentinel.
# Never run on arbitrary pushes to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ops/run-i90-restore-20261018.txt'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  guarded_i90_restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Check immutable repair contract
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/i90-preswitch-restore-once.php
          php tests/i90-preswitch-restore-guard.php
          test -f scripts/i90-preswitch-restore-once.php
          grep -Fq 'GP_I90_EXPECTED_WHOLESALE = 1815' scripts/i90-preswitch-restore-once.php
          grep -Fq 'GP_I90_EXPECTED_PHYSICAL = 1455' scripts/i90-preswitch-restore-once.php
          grep -Fq 'GP_I90_EXPECTED_RESTORED = 360' scripts/i90-preswitch-restore-once.php

      - name: Upload ephemeral guarded script, dry-run, apply and independently verify
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          command -v lftp >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y lftp; }
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          FILE="__gp_i90_reconcile_${GITHUB_RUN_ID}_$(openssl rand -hex 8).php"
          STAGE="$(mktemp)"
          python3 - "$TOKEN" "$STAGE" <<'PY'
          import pathlib,sys
          token,dest=sys.argv[1:]
          p=pathlib.Path('scripts/i90-preswitch-restore-once.php').read_text()
          anchor="const GP_I90_TOKEN = '__I90_EXECUTION_TOKEN__';"
          if p.count(anchor)!=1: raise SystemExit('Token source mismatch')
          p=p.replace(anchor,"const GP_I90_TOKEN = '"+token+"';")
          pathlib.Path(dest).write_text(p)
          PY
          cleanup(){
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
            rm -f "$STAGE" /tmp/gp-i90-dry.json /tmp/gp-i90-applied.json /tmp/gp-i90-verify.json
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$STAGE" -o "/$FILE"
          bye
          EOF
          URL="https://ghadirpartner.ir/$FILE"
          send(){
            local mode="$1" out="$2"
            curl -sS --max-time 120 -X POST \
              -H "X-GP-I90-Token: $TOKEN" \
              -H 'Cache-Control: no-store' \
              --data-urlencode "mode=$mode" \
              --output "$out" --write-out '%{http_code}' "$URL"
          }
          status="$(send dry_run /tmp/gp-i90-dry.json)"
          python3 - "$status" /tmp/gp-i90-dry.json <<'PY'
          import json,sys
          status=int(sys.argv[1]); d=json.load(open(sys.argv[2]))
          fields=['ok','mode','eligible','revision','wholesale_before','wholesale_after','retail','restored','cartons']
          print('Preflight:',{k:d.get(k) for k in fields})
          if status!=200 or d.get('ok') is not True or d.get('mode')!='dry_run' or d.get('eligible') is not True:
            raise SystemExit('Unsafe or failed dry run (no write attempted)')
          if (d.get('wholesale_before'),d.get('wholesale_after'),d.get('restored'),d.get('retail'),d.get('cartons'))!=(1815,1455,360,16,18):
            raise SystemExit('Unexpected live I90 quantity: stop without write')
          PY
          status="$(send apply /tmp/gp-i90-applied.json)"
          python3 - "$status" /tmp/gp-i90-applied.json <<'PY'
          import json,sys
          status=int(sys.argv[1]);d=json.load(open(sys.argv[2]))
          fields=['ok','mode','changed','wholesale_before','wholesale_after','retail','protected_cartons_valid','revision','backup_created']
          print('Applied:',{k:d.get(k) for k in fields})
          if status!=200 or d.get('ok') is not True or d.get('mode')!='applied':
            raise SystemExit('Guard blocked application; inspect before retry')
          if (d.get('changed'),d.get('wholesale_after'),d.get('retail'),d.get('protected_cartons_valid'),d.get('backup_created'))!=(360,1455,16,18,True):
            raise SystemExit('Post-apply response failed invariants; stop and investigate')
          PY
          status="$(send verify /tmp/gp-i90-verify.json)"
          python3 - "$status" /tmp/gp-i90-verify.json <<'PY'
          import json,sys
          status=int(sys.argv[1]);d=json.load(open(sys.argv[2]))
          fields=['ok','mode','wholesale','retail','reversed','audit_exists','revision']
          print('Verified:',{k:d.get(k) for k in fields})
          if status!=200 or d.get('ok') is not True or d.get('mode')!='verify':
            raise SystemExit('Independent post-commit verification failed')
          if (d.get('wholesale'),d.get('retail'),d.get('reversed'),d.get('audit_exists'))!=(1455,16,360,True):
            raise SystemExit('Post-commit inventory mismatch')
          PY
