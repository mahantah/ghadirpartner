name: Deploy Web V5.3.4.16 Dispatch Compact Count Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp php-cli curl

      - name: Locate, extract and validate release
        id: rel
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_NAME="GhadirPartner-Web-V5.3.4.16-DISPATCH-COMPACT-COUNT-FIX.zip"
          BUNDLE_NAME="GhadirPartner-V5.3.4.16-GITHUB-BUNDLE.zip"

          ZIP="$(find . -type f -name "$RELEASE_NAME" -print -quit || true)"

          if [ -z "$ZIP" ]; then
            BUNDLE="$(find . -type f -name "$BUNDLE_NAME" -print -quit || true)"
            if [ -n "$BUNDLE" ]; then
              rm -rf /tmp/ghp-bundle-v53416
              mkdir -p /tmp/ghp-bundle-v53416
              unzip -q "$BUNDLE" -d /tmp/ghp-bundle-v53416
              ZIP="$(find /tmp/ghp-bundle-v53416 -type f -name "$RELEASE_NAME" -print -quit || true)"
            fi
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Release ZIP was not found in the repository."
            echo "::error::Upload either $RELEASE_NAME or $BUNDLE_NAME"
            find . -maxdepth 3 -type f | sort | sed -n '1,250p'
            exit 1
          fi

          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/ghp-v53416
          mkdir -p /tmp/ghp-v53416
          unzip -q "$ZIP" -d /tmp/ghp-v53416
          ROOT="/tmp/ghp-v53416"

          test -f "$ROOT/index.php" || { echo "::error::index.php missing"; exit 1; }
          test -f "$ROOT/app.html" || { echo "::error::app.html missing"; exit 1; }
          test -f "$ROOT/lib/labels-v5348.php" || { echo "::error::labels library missing"; exit 1; }
          grep -q 'V5.3.4.16-DISPATCH-COMPACT-COUNT-FIX' "$ROOT/VERSION.txt" || { echo "::error::VERSION.txt mismatch"; cat "$ROOT/VERSION.txt" || true; exit 1; }

          php -l "$ROOT/index.php"
          php -l "$ROOT/lib/labels-v5348.php"
          php -l "$ROOT/partners/index.php"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Protect production config and data
        env:
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -f "$ROOT/storage/ghadir_data.json" 2>/dev/null || true

      - name: Upload prepared artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Web-V5.3.4.16
          path: ${{ steps.rel.outputs.root }}/
          retention-days: 7

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.rel.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2             --exclude-glob config.php             --exclude-glob partners/config.php             --exclude-glob .env             --exclude-glob .env.*             --exclude-glob storage/**             --exclude-glob '*.sql'             --exclude-glob '*.zip'             "$ROOT/" /
          bye
          EOF

      - name: Production health check
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/
