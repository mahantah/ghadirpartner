name: Release Production Order Return Exchange V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  order-return-exchange-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate order return exchange
        run: |
          set -euo pipefail
          php -l lib/order-return-exchange.php
          php -l index.php
          python3 -m py_compile scripts/deploy-production-order-return-exchange-v1.py
          python3 -m py_compile scripts/patch_production_order_return_exchange.py
          php tests/order-return-exchange-scenarios.php
          python3 tests/production-order-return-exchange-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli
      - name: Publish order return exchange v1
        run: python3 scripts/deploy-production-order-return-exchange-v1.py deploy
      - name: Confirm live site
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_ORDER_RETURN_EXCHANGE_V1_20261026' /tmp/live-app.html
          grep -Fq 'order-return-exchange-v1.js?v=1' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/order-return-exchange-v1.js?v=1' -o /tmp/live-exchange.js
          grep -Fq 'openOrderExchange' /tmp/live-exchange.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
