name: Repair Order 137 Exchange Serials

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply repair to live order 137 (false = inspect only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate repair helpers
        run: |
          set -euo pipefail
          php -l lib/order-return-exchange.php
          php -l scripts/order-137-exchange-repair-once.php
          php tests/order-return-exchange-scenarios.php
      - name: Publish helper and run guarded repair
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl jq php-cli
          python3 scripts/deploy-production-order-exchange-serial-swap-v1.py deploy
          TOKEN="$(openssl rand -hex 32)"
          FILE="__gp_order137_exchange_repair_${GITHUB_RUN_ID}.php"
          cp scripts/order-137-exchange-repair-once.php "/tmp/$FILE"
          sed -i "s/__REPAIR_TOKEN__/$TOKEN/" "/tmp/$FILE"
          php -l "/tmp/$FILE"
          cleanup() {
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          URL="https://ghadirpartner.ir/$FILE"
          STATUS="$(curl -sS --max-time 60 --output /tmp/gp-o137-inspect.json --write-out '%{http_code}' \
            -X POST -H "X-GP-Repair-Token: $TOKEN" --data 'mode=inspect' "$URL")"
          [[ "$STATUS" == 200 ]] || { echo "inspect HTTP $STATUS"; cat /tmp/gp-o137-inspect.json; exit 2; }
          jq -e '(.ok == true) and (.order_id == 137) and (.inventory_unchanged == true)' /tmp/gp-o137-inspect.json >/dev/null
          jq -c '{mode,number,eligible,items_changed,exchanges_patched,before_items,after_items}' /tmp/gp-o137-inspect.json
          REV="$(jq -er '.revision' /tmp/gp-o137-inspect.json)"
          if [[ "$APPLY" == true ]] && [[ "$(jq -r '.eligible' /tmp/gp-o137-inspect.json)" == true ]]; then
            STATUS="$(curl -sS --max-time 90 --output /tmp/gp-o137-apply.json --write-out '%{http_code}' \
              -X POST -H "X-GP-Repair-Token: $TOKEN" \
              --data 'mode=apply' --data-urlencode "expected_revision=$REV" "$URL")"
            [[ "$STATUS" == 200 ]] || { echo "apply HTTP $STATUS"; cat /tmp/gp-o137-apply.json; exit 2; }
            jq -e '(.ok == true) and (.mode == "applied") and (.inventory_unchanged == true) and (.backup_created == true)' /tmp/gp-o137-apply.json >/dev/null
            jq -c '{mode,number,after_items,exchanges_patched,revision}' /tmp/gp-o137-apply.json
          fi
          STATUS="$(curl -sS --max-time 60 --output /tmp/gp-o137-verify.json --write-out '%{http_code}' \
            -X POST -H "X-GP-Repair-Token: $TOKEN" --data 'mode=verify' "$URL")"
          [[ "$STATUS" == 200 ]] || exit 2
          jq -c '{mode,ok,pending,items}' /tmp/gp-o137-verify.json
