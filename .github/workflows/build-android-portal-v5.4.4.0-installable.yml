name: Build Ghadir Partner Portal APK v5.4.4.0

on:
  workflow_dispatch:
    inputs:
      android_zip:
        description: 'Android source ZIP in repository root'
        required: true
        default: 'GhadirPartner-Android-SOURCE-V5.4.4.0.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        id: source
        shell: bash
        env:
          ANDROID_ZIP: ${{ inputs.android_zip }}
        run: |
          set -euo pipefail
          ZIP="$(basename "$ANDROID_ZIP")"
          test "$ZIP" = "$ANDROID_ZIP" || { echo 'ZIP must be in repository root'; exit 1; }
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          rm -rf /tmp/ghadir-android
          mkdir -p /tmp/ghadir-android
          unzip -q "$ZIP" -d /tmp/ghadir-android
          ROOT=/tmp/ghadir-android
          if [ ! -f "$ROOT/settings.gradle" ]; then
            FIRST="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
            if [ -n "$FIRST" ] && [ -f "$FIRST/settings.gradle" ]; then ROOT="$FIRST"; fi
          fi
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle"
          grep -q "versionName '5.4.4.0'" "$ROOT/app/build.gradle"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build installable customer Portal APK
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain clean assemblePortalDebug --stacktrace

      - name: Prepare install package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.root }}'
          APK="$ROOT/app/build/outputs/apk/portal/debug/app-portal-debug.apk"
          test -f "$APK"
          mkdir -p /tmp/ghadir-apk
          cp "$APK" /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk
          sha256sum /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk > /tmp/ghadir-apk/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Portal-V5.4.4.0-INSTALL
          path: |
            /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk
            /tmp/ghadir-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
