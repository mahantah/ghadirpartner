name: One-time inspect live sidebar shell (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-live-sidebar-shell-20261017.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download public production app.html and inspect style rules
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL --max-time 30 'https://ghadirpartner.ir/app.html?sidebar_probe=20261017' -o /tmp/ghadir-live-app.html
          python3 - <<'PY'
          import re,html
          from pathlib import Path
          s=Path('/tmp/ghadir-live-app.html').read_text()
          print('LIVE_APP_BYTES',len(s))
          for tag in ('header','nav','main'):
              matches=list(re.finditer(r'<'+tag+r'\b[^>]*>',s,re.I))
              print('TAGS',tag,'count',len(matches),'samples', [m.group(0)[:260] for m in matches[:3]])
          print('BODY_APP', [m.group(0)[:260] for m in list(re.finditer(r'<(?:div|main|section)\b[^>]*id=[\x22\x27]app[\x22\x27][^>]*>',s,re.I))[:3]])
          print('STYLE_LINKS',re.findall(r'<link[^>]+rel=[\x22\x27]stylesheet[\x22\x27][^>]*>',s,re.I)[-35:])
          sheets=re.findall(r'<style[^>]*>(.*?)</style>',s,re.S|re.I)
          print('INLINE_STYLES',len(sheets))
          for index,css in enumerate(sheets):
              matched=[]
              for m in re.finditer(r'([^{}]{1,350})\{([^{}]{0,1400})\}',css):
                  selector=' '.join(m.group(1).split())
                  if any(t in selector.lower() for t in ('.brand','.topnav','.nav-toggle','#app > header','#app>header','.wrap','header{','header ')):
                      if any(t in selector.lower() for t in ('header','.brand','.topnav','.wrap','.nav-toggle')):
                          matched.append((selector[-260:], ' '.join(m.group(2).split())[:500]))
              if matched:
                  print('SHEET',index,'matching_rules',len(matched))
                  for sel,body in (matched[:28] if index==3 else matched[-6:]): print('CSSRULE2',sel,'::',body)
          print('SOURCE_MARKERS',[x for x in ('GHADIR_NAV_MORPH_V1_20261017','GHADIR_CUSTOMER_MODEL_CATALOG_V5_20261017','MOBILE_UI_OPTIMIZATION_V1_20261014') if x in s])
          PY
