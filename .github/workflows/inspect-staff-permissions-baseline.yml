name: Inspect production staff roles UI baseline

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-staff-permissions-baseline.yml'
      - 'scripts/inspect-staff-permissions-baseline.py'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect only the server's public FTPS certificate identity
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" -servername "$FTP_SERVER" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName
      - name: Read only hashes and staff-role UI markers over verified FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTPS_CERT_HOST: shahin500.limoo.host
        run: python3 scripts/inspect-staff-permissions-baseline.py
