name: Deploy Web V5.3.4.3 + Figma Visual Only R2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Restore V5.3.4.3 behavior and apply Figma skin
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp

      - name: Prepare exact V5.3.4.3 base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_ZIP="GhadirPay-GitHub-V5.3.4.3-PERMISSIONS-REPORT-COMPANY-PARTNER-UI.zip"
          test -f "$BASE_ZIP" || { echo "::error::Base V5.3.4.3 ZIP not found: $BASE_ZIP"; exit 1; }
          unzip -t "$BASE_ZIP" >/dev/null
          rm -rf /tmp/ghadir-v5343
          mkdir -p /tmp/ghadir-v5343
          unzip -q "$BASE_ZIP" -d /tmp/ghadir-v5343
          ROOT="$(find /tmp/ghadir-v5343 -type f -name app.html -print0 | while IFS= read -r -d '' f; do d="$(dirname "$f")"; if [ -f "$d/index.php" ]; then echo "$d"; break; fi; done)"
          test -n "$ROOT" || { echo "::error::Could not locate V5.3.4.3 runtime root"; exit 1; }
          test -f "$ROOT/app.html"
          test -f "$ROOT/index.php"
          test -f "$ROOT/partners/portal.html"
          grep -q 'id="login"' "$ROOT/app.html"
          grep -q 'id="dashboard"' "$ROOT/app.html"
          grep -q 'data-tab="orders"' "$ROOT/app.html"
          grep -q 'data-tab="neworder"' "$ROOT/app.html"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Snapshot V5.3.4.3 login and business logic
        shell: bash
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/gp_snapshot.py
          python3 /tmp/gp_snapshot.py "$ROOT/app.html"

      - name: Create Figma visual-only assets
        shell: bash
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$ROOT/figma-ui-v5343.css"
          echo '' | base64 -d > "$ROOT/figma-ui-v5343.js"
          test -s "$ROOT/figma-ui-v5343.css"
          test -s "$ROOT/figma-ui-v5343.js"

      - name: Inject visual skin only
        shell: bash
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/gp_inject.py
          python3 /tmp/gp_inject.py "$ROOT/app.html"

      - name: Verify login and V5.3.4.3 logic are unchanged
        shell: bash
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/gp_verify.py
          python3 /tmp/gp_verify.py "$ROOT/app.html"

      - name: Protect production secrets and data
        shell: bash
        env:
          ROOT: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          rm -f "$ROOT/config.php" "$ROOT/partners/config.php" "$ROOT/.env" "$ROOT/partners/.env"
          rm -f "$ROOT/storage/ghadir_data.json" 2>/dev/null || true

      - name: Upload prepared package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-V5.3.4.3-FIGMA-VISUAL-ONLY-R2
          path: ${{ steps.base.outputs.root }}/
          retention-days: 7

      - name: Deploy exact prepared V5.3.4.3 runtime over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /
          bye
          EOF

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 -o /dev/null https://ghadirpartner.ir/partners/

      - name: Deployment summary
        run: |
          echo "### V5.3.4.3 + Figma Visual Only R2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base behavior/API/flows: exact V5.3.4.3 package" >> "$GITHUB_STEP_SUMMARY"
          echo "- Login HTML: unchanged and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Inline business logic: unchanged and SHA verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI change: CSS + presentation-only active-tab marker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Experimental V5.3.4.5 patch: not used" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production config/storage: preserved" >> "$GITHUB_STEP_SUMMARY"
