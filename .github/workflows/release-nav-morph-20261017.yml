name: Release animated navigation toggle (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-nav-morph-20261017.yml'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: apply animated navigation toggle 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install required secure transfer and test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs

      - name: Copy current live app and patch only its navigation
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/nav-before" "$RUNNER_TEMP/nav-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/nav-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/nav-before/app.html"
          cp "$RUNNER_TEMP/nav-before/app.html" "$RUNNER_TEMP/nav-after/app.html"
          grep -Fq 'MOBILE_MENU_OVERLAY_FIX_V2_20261014' "$RUNNER_TEMP/nav-after/app.html"
          grep -Fq 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017' "$RUNNER_TEMP/nav-after/app.html"
          python3 scripts/patch-nav-morph-v1.py "$RUNNER_TEMP/nav-after"
          node --check assets/nav-morph-v1.js
          grep -Fq 'GHADIR_NAV_MORPH_V1_20261017' "$RUNNER_TEMP/nav-after/app.html"
          grep -Fq '/assets/nav-morph-v1.css?v=20261017a1' "$RUNNER_TEMP/nav-after/app.html"
          grep -Fq '/assets/nav-morph-v1.js?v=20261017a1' "$RUNNER_TEMP/nav-after/app.html"
          # Preserve all existing login, order, warehouse and reporting routes.
          for marker in 'id="login"' 'data-tab="orders"' 'data-tab="warehouse"' 'data-tab="customers"' 'id="gp-login-startup"'; do
            grep -Fq "$marker" "$RUNNER_TEMP/nav-after/app.html"
          done

      - name: Publish only menu assets and app references, verify or restore
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            status=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Navigation release verification failed: restoring previous app.html'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/nav-before/app.html" -o /app.html
          rm -f /assets/nav-morph-v1.css
          rm -f /assets/nav-morph-v1.js
          bye
          EOF
            fi
            exit "$status"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/nav-morph-v1.css" -o /assets/nav-morph-v1.css
          put "assets/nav-morph-v1.js" -o /assets/nav-morph-v1.js
          put "$RUNNER_TEMP/nav-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/nav-live-app.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq '/assets/nav-morph-v1.css?v=20261017a1' "$RUNNER_TEMP/nav-live-app.html"
          grep -Fq '/assets/nav-morph-v1.js?v=20261017a1' "$RUNNER_TEMP/nav-live-app.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/nav-live.js" 'https://ghadirpartner.ir/assets/nav-morph-v1.js?v=20261017a1'
          grep -Fq 'GHADIR_NAV_MORPH_V1_20261017' "$RUNNER_TEMP/nav-live.js"
          node --check "$RUNNER_TEMP/nav-live.js"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/nav-live.css" 'https://ghadirpartner.ir/assets/nav-morph-v1.css?v=20261017a1'
          grep -Fq 'GHADIR_NAV_MORPH_V1_20261017' "$RUNNER_TEMP/nav-live.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/nav-health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/nav-health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Animated hamburger to X deployed; live navigation assets and health passed. No customer data changed.'
