name: Release Production Search Filter Fab Layer V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  search-filter-fab-layer-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate search filter fab layer v2
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-search-filter-fab-layer-v2.py
          python3 tests/production-search-filter-fab-layer-v2.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish search filter fab layer v2
        run: python3 scripts/deploy-production-search-filter-fab-layer-v2.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_SEARCH_FILTER_FAB_LAYER_V2_20261026' /tmp/live-app.html
          grep -Fq 'search-filter-fab-layer-v2.js?v=1' /tmp/live-app.html
          grep -Fq 'search-filter-fab-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/search-filter-fab-layer-v2.js?v=1' -o /tmp/live-fab-layer.js
          grep -Fq 'z-index:260' /tmp/live-fab-layer.js
          grep -Fq 'gp-fab-sheet' /tmp/live-fab-layer.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
