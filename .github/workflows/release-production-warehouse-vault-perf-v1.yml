name: Release Production Warehouse Vault Perf V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://ghadirpartner.ir/app.html -o /tmp/gp-live-app.html
          grep -Fq 'warehouse-ui-refine-v53438.js?v=53438ui5' /tmp/gp-live-app.html
          node --check assets/warehouse-ui-refine-v53438.js
          node --check assets/warehouse-vault-perf-v1.js
          grep -Fq byCartonId assets/warehouse-ui-refine-v53438.js
          grep -Fq gpClearWarehouseVaultCache assets/warehouse-vault-perf-v1.js
          python3 -m py_compile scripts/deploy-production-warehouse-vault-perf-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Deploy
        run: python3 scripts/deploy-production-warehouse-vault-perf-v1.py deploy
      - name: Verify live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://ghadirpartner.ir/app.html -o /tmp/gp-app-wh.html
          grep -Fq 'warehouse-ui-refine-v53438.js?v=53438ui6' /tmp/gp-app-wh.html
          grep -Fq 'warehouse-vault-perf-v1.js?v=1' /tmp/gp-app-wh.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/warehouse-vault-perf-v1.js?v=1' | grep -Fq gpClearWarehouseVaultCache
