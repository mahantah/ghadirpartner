name: Release customer serial model dropdown V3 (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-customer-serial-model-v3-20261017.yml'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: enable customer serial model dropdown V3 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install safe FTPS transfer and syntax-check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs

      - name: Read live production and prepare additive UI fix
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/model-before" "$RUNNER_TEMP/model-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/model-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/model-before/app.html"
          cp "$RUNNER_TEMP/model-before/app.html" "$RUNNER_TEMP/model-after/app.html"
          for mark in 'GHADIR_CUSTOMER_SERIAL_RESTORE_NAV_GHOST_V2_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017'; do
            grep -Fq "$mark" "$RUNNER_TEMP/model-after/app.html"
          done
          python3 scripts/patch-warehouse-serial-filters-v3.py "$RUNNER_TEMP/model-after"
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_MODEL_OPTIONS_V3_20261017' "$RUNNER_TEMP/model-after/app.html"
          grep -Fq '/assets/warehouse-serial-filters-v3.js?v=20261017m3' "$RUNNER_TEMP/model-after/app.html"
          ! grep -Fq '/assets/warehouse-serial-filters-v2.js?v=20261017f2' "$RUNNER_TEMP/model-after/app.html"
          node --check assets/warehouse-serial-filters-v3.js
          for mark in 'id="inventoryGroups"' 'id="inventory"' 'data-tab="inventory"' 'id="warehouseBody"' 'id="logoutbtn"' 'data-tab="customers"'; do
            grep -Fq "$mark" "$RUNNER_TEMP/model-after/app.html"
          done

      - name: Publish JS and reference only, verify live or restore previous
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback(){
            status=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'V3 customer serial model release failed; reverting production app.html.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/model-before/app.html" -o /app.html
          rm -f /assets/warehouse-serial-filters-v3.js
          bye
          EOF
            fi
            exit "$status"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/warehouse-serial-filters-v3.js" -o /assets/warehouse-serial-filters-v3.js
          put "$RUNNER_TEMP/model-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/model-live.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_MODEL_OPTIONS_V3_20261017' "$RUNNER_TEMP/model-live.html"
          grep -Fq '/assets/warehouse-serial-filters-v3.js?v=20261017m3' "$RUNNER_TEMP/model-live.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/model-live.js" 'https://ghadirpartner.ir/assets/warehouse-serial-filters-v3.js?v=20261017m3'
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_MODEL_OPTIONS_V3_20261017' "$RUNNER_TEMP/model-live.js"
          grep -Fq 'inventoryModelNames()' "$RUNNER_TEMP/model-live.js"
          node --check "$RUNNER_TEMP/model-live.js"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Customer serial model dropdown V3 deployed; site and JS health checks passed. No API or database changed.'
