name: Release Production Order Exchange Serial Swap V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate
        run: |
          set -euo pipefail
          php -l lib/order-return-exchange.php
          python3 -m py_compile scripts/deploy-production-order-exchange-serial-swap-v1.py
          php tests/order-return-exchange-scenarios.php
          grep -Fq returned_serials_replaced lib/order-return-exchange.php
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish
        run: python3 scripts/deploy-production-order-exchange-serial-swap-v1.py deploy
      - name: Confirm live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://ghadirpartner.ir/lib/order-return-exchange.php -o /tmp/live-exchange.php
          grep -Fq 'GP_ORDER_RETURN_EXCHANGE_V2_20261026' /tmp/live-exchange.php
          grep -Fq returned_serials_replaced /tmp/live-exchange.php
