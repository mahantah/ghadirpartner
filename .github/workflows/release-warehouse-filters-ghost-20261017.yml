name: Release warehouse filters and closed-sidebar cleanup (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-warehouse-filters-ghost-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: apply warehouse serial filters and sidebar cleanup 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure transfer and syntax tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs
      - name: Back up current live app and verify UI-only patch
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/warehouse-before" "$RUNNER_TEMP/warehouse-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/warehouse-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/warehouse-before/app.html"
          cp "$RUNNER_TEMP/warehouse-before/app.html" "$RUNNER_TEMP/warehouse-after/app.html"
          for marker in 'GHADIR_SIDEBAR_REAL_EDGE_V4_20261017' 'GHADIR_DESKTOP_SIDEBAR_COLLAPSE_V3_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017'; do
            grep -Fq "$marker" "$RUNNER_TEMP/warehouse-after/app.html"
          done
          python3 scripts/patch-warehouse-serial-filters-v1.py "$RUNNER_TEMP/warehouse-after"
          grep -Fq 'GHADIR_WAREHOUSE_SERIAL_FILTERS_GHOST_V1_20261017' "$RUNNER_TEMP/warehouse-after/app.html"
          grep -Fq '/assets/warehouse-serial-filters-v1.css?v=20261017f1' "$RUNNER_TEMP/warehouse-after/app.html"
          grep -Fq '/assets/warehouse-serial-filters-v1.js?v=20261017f1' "$RUNNER_TEMP/warehouse-after/app.html"
          node --check assets/warehouse-serial-filters-v1.js
          for marker in 'id="login"' 'id="warehouseBody"' 'id="inventoryGroups"' 'data-tab="orders"' 'data-tab="warehouse"' 'id="changePasswordBtn"' 'id="logoutbtn"' 'چاپ و دانلود یکجای لیبل سریال‌ها' '/print/warehouse-label?id='; do
            grep -Fq "$marker" "$RUNNER_TEMP/warehouse-after/app.html"
          done
      - name: Publish only warehouse UI assets and app references; rollback on failure
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            err=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'UI release validation failed; restoring previous production app.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/warehouse-before/app.html" -o /app.html
          rm -f /assets/warehouse-serial-filters-v1.css
          rm -f /assets/warehouse-serial-filters-v1.js
          bye
          EOF
            fi
            exit "$err"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/warehouse-serial-filters-v1.css" -o /assets/warehouse-serial-filters-v1.css
          put "assets/warehouse-serial-filters-v1.js" -o /assets/warehouse-serial-filters-v1.js
          put "$RUNNER_TEMP/warehouse-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-app.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_WAREHOUSE_SERIAL_FILTERS_GHOST_V1_20261017' "$RUNNER_TEMP/live-app.html"
          grep -Fq '/assets/warehouse-serial-filters-v1.css?v=20261017f1' "$RUNNER_TEMP/live-app.html"
          grep -Fq '/assets/warehouse-serial-filters-v1.js?v=20261017f1' "$RUNNER_TEMP/live-app.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-filter.js" 'https://ghadirpartner.ir/assets/warehouse-serial-filters-v1.js?v=20261017f1'
          grep -Fq 'GHADIR_WAREHOUSE_SERIAL_FILTERS_GHOST_V1_20261017' "$RUNNER_TEMP/live-filter.js"
          node --check "$RUNNER_TEMP/live-filter.js"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-filter.css" 'https://ghadirpartner.ir/assets/warehouse-serial-filters-v1.css?v=20261017f1'
          grep -Fq 'GHADIR_WAREHOUSE_SERIAL_FILTERS_GHOST_V1_20261017' "$RUNNER_TEMP/live-filter.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Warehouse serial/date filters, unused label card cleanup and closed overlay fix deployed. UI and health checks successful.'
