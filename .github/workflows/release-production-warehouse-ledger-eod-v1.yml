name: Release Production Warehouse Ledger EOD V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  ledger-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate end-of-day ledger freeze
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-warehouse-ledger-eod-v1.py
          python3 tests/production-warehouse-ledger-eod-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish ledger freeze overlay
        run: python3 scripts/deploy-production-warehouse-ledger-eod-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_LEDGER_EOD_FREEZE_V1_20261025' /tmp/live-app.html
          grep -Fq 'warehouse-ledger-eod-freeze-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'customer-price-access-live-v4.js?v=4' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/warehouse-ledger-eod-freeze-v1.js?v=1' -o /tmp/live-overlay.js
          grep -Fq 'gpLedgerStockOnJalaliDay' /tmp/live-overlay.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
