name: Capture current production login desktop screenshot
on:
  push:
    branches:
      - screenshots/login-desktop-20261016
    paths:
      - .github/workflows/capture-login-desktop-20261016.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Confirm Chrome browser
        run: |
          if ! command -v google-chrome >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-chrome-stable
          fi
          google-chrome --version
      - name: Capture production login from a fresh browser context (no cookies)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --disable-dev-shm-usage --no-first-run --force-device-scale-factor=1 \
            --window-size=1440,1080 --virtual-time-budget=15000 \
            --screenshot="screenshots/ghadir-login-desktop-20261016.png" \
            "https://ghadirpartner.ir/" >/tmp/chrome.log 2>&1
          test -s screenshots/ghadir-login-desktop-20261016.png
          file screenshots/ghadir-login-desktop-20261016.png
          du -h screenshots/ghadir-login-desktop-20261016.png
      - uses: actions/upload-artifact@v4
        with:
          name: ghadir-login-desktop-20261016
          path: screenshots/ghadir-login-desktop-20261016.png
          retention-days: 14
      - name: Commit screenshot to this isolated branch (not production)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/ghadir-login-desktop-20261016.png
          git commit -m "docs: screenshot of current production desktop login"
          git push origin HEAD:screenshots/login-desktop-20261016
