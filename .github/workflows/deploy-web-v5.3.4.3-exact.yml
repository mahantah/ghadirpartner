name: Deploy Web V5.3.4.3 Exact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact V5.3.4.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp

      - name: Locate and validate V5.3.4.3 package
        id: release
        shell: bash
        run: |
          set -euo pipefail

          ZIP="GhadirPay-GitHub-V5.3.4.3-PERMISSIONS-REPORT-COMPANY-PARTNER-UI.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required release ZIP not found in repository root: $ZIP"
            echo "Available ZIP files:"
            ls -1 *.zip 2>/dev/null || true
            exit 1
          fi

          unzip -t "$ZIP" >/dev/null

          rm -rf /tmp/ghadir-v5343
          mkdir -p /tmp/ghadir-v5343
          unzip -q "$ZIP" -d /tmp/ghadir-v5343

          ROOT="$(find /tmp/ghadir-v5343 -type f -name app.html -print0 | while IFS= read -r -d '' f; do
            d="$(dirname "$f")"
            if [ -f "$d/index.php" ]; then
              echo "$d"
              break
            fi
          done)"

          if [ -z "$ROOT" ]; then
            echo "::error::Could not locate the V5.3.4.3 runtime root."
            find /tmp/ghadir-v5343 -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          test -f "$ROOT/index.php"
          test -f "$ROOT/app.html"
          test -f "$ROOT/partners/portal.html"

          grep -q 'id="login"' "$ROOT/app.html" || {
            echo "::error::Login page marker missing."
            exit 1
          }

          grep -q 'id="dashboard"' "$ROOT/app.html" || {
            echo "::error::Dashboard marker missing."
            exit 1
          }

          grep -q 'data-tab="orders"' "$ROOT/app.html" || {
            echo "::error::Orders menu marker missing."
            exit 1
          }

          grep -q 'data-tab="neworder"' "$ROOT/app.html" || {
            echo "::error::New order menu marker missing."
            exit 1
          }

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Protect production configuration and data
        env:
          ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$ROOT/config.php"
          rm -f "$ROOT/partners/config.php"
          rm -f "$ROOT/.env"
          rm -f "$ROOT/partners/.env"
          rm -f "$ROOT/storage/ghadir_data.json" 2>/dev/null || true

          if find "$ROOT" -type f \( -name config.php -o -name .env -o -name ghadir_data.json \) | grep -q .; then
            echo "::error::Protected production config/data is still present in the release."
            exit 1
          fi

          echo "Production config/data protection passed."

      - name: Upload exact V5.3.4.3 package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Web-V5.3.4.3-Prepared
          path: ${{ steps.release.outputs.root }}/
          retention-days: 7

      - name: Deploy exact V5.3.4.3 over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25

          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"

          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$ROOT/" /

          bye
          EOF

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail

          curl -fsS --retry 3 --retry-delay 2 --max-time 25             -o /dev/null https://ghadirpartner.ir/

          curl -fsS --retry 3 --retry-delay 2 --max-time 25             -o /dev/null https://ghadirpartner.ir/partners/

          echo "Production health check passed."

      - name: Deployment summary
        run: |
          echo "### GhadirPartner Web V5.3.4.3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP: `${{ steps.release.outputs.zip }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: **V5.3.4.3**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production config.php / partners/config.php: **preserved**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production storage/**: **preserved**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy trigger: **manual only**" >> "$GITHUB_STEP_SUMMARY"
