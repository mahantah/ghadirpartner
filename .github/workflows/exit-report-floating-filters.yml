name: Restore Exit Report Floating Filters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/exit-report-floating-filters.yml']
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Validate the bounded server-side recovery tool
        run: |
          php -l scripts/apply-warehouse-ui-stability.php
          python3 tests/exit-report-floating-filters.py
          python3 -m json.tool config/exit-report-floating-filters.json > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Patch current owner UI privately on the host
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          FILE="__gp_correct_source_${GITHUB_RUN_ID}.php"
          python3 - "$FILE" "$TOKEN" <<'PY'
          import os,sys,base64
          from pathlib import Path
          name,token=sys.argv[1:]
          source=Path('scripts/apply-warehouse-ui-stability.php').read_text()
          integrity=Path('lib/preswitch-carton-integrity.php').read_text().removeprefix('<?php\n')
          manifest=base64.b64encode(Path('config/exit-report-floating-filters.json').read_bytes()).decode()
          for old,new in {'// __INTEGRITY_CLASS__':integrity,'__TOKEN__':token,'__MANIFEST_B64__':manifest,'__RUN_ID__':os.environ['GITHUB_RUN_ID']}.items(): source=source.replace(old,new)
          Path('/tmp/'+name).write_text(source)
          PY
          php -l "/tmp/$FILE"
          cleanup(){
            lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          rm "/$FILE"
          bye
          EOF
          }
          trap cleanup EXIT
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "/tmp/$FILE" -o "/$FILE"
          bye
          EOF
          STATUS="$(curl -sS --max-time 350 -w '%{http_code}' -X POST --data 'mode=apply' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE" -o /tmp/recovery-result.json)"
          python3 - "$STATUS" <<'PY'
          import json,sys
          from pathlib import Path
          try: result=json.loads(Path('/tmp/recovery-result.json').read_text())
          except ValueError: result={'ok':False,'error':'invalid_server_response'}
          print(result)
          assert sys.argv[1]=='200' and result.get('ok') and result.get('database_changed') is False
          PY
          if ! curl -fsS --max-time 40 https://ghadirpartner.ir/healthz; then
            curl -fsS --max-time 60 -X POST --data 'mode=rollback' -H "X-GP-Reconcile-Token: $TOKEN" "https://ghadirpartner.ir/$FILE"
            exit 2
          fi
          python3 - <<'PYVERIFY'
          import hashlib,json,urllib.request
          from pathlib import Path
          m=json.loads(Path('config/exit-report-floating-filters.json').read_text())
          for file,expected in m['expected_files'].items():
              with urllib.request.urlopen('https://ghadirpartner.ir/'+file+'?reportverify=20261028a',timeout=40) as response:
                  assert hashlib.sha256(response.read()).hexdigest()==expected, file
          print('Exit report and PDF UI hash verified; database unchanged.')
          PYVERIFY
