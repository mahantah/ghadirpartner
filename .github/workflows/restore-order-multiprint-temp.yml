name: Restore Order Multi Print

on:
  push:
    branches:
      - main
    paths:
      - "restore-order-multiprint.trigger"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp nodejs

      - name: Validate multi-print JS
        run: |
          set -euo pipefail
          node --check assets/order-multiprint-v53438.js
          grep -q "چاپ بیجک‌های انتخابی" assets/order-multiprint-v53438.js
          grep -q "چاپ لیبل‌های انتخابی" assets/order-multiprint-v53438.js

      - name: Patch live app and upload asset
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/multiprint
          mkdir -p /tmp/multiprint
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/multiprint/app.html
          bye
          EOF
          cp /tmp/multiprint/app.html /tmp/multiprint/app-before.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/multiprint/app.html')
          s=p.read_text()
          tag='<script src="/assets/order-multiprint-v53438.js?v=53438mp1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('body closing tag not found')
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s)
          PY
          grep -q "order-multiprint-v53438.js" /tmp/multiprint/app.html
          TS="$(date +%Y%m%d-%H%M%S)"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /storage/Backups
          put /tmp/multiprint/app-before.html -o "app-before-order-multiprint-$TS.html"
          cd /
          put /tmp/multiprint/app.html -o /app.html
          put assets/order-multiprint-v53438.js -o /assets/order-multiprint-v53438.js
          bye
          EOF

      - name: Verify live files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/multiprint/verify
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/multiprint/verify/app.html
          get /assets/order-multiprint-v53438.js -o /tmp/multiprint/verify/order-multiprint-v53438.js
          bye
          EOF
          grep -q "order-multiprint-v53438.js" /tmp/multiprint/verify/app.html
          node --check /tmp/multiprint/verify/order-multiprint-v53438.js
          grep -q "چاپ بیجک‌های انتخابی" /tmp/multiprint/verify/order-multiprint-v53438.js
          grep -q "چاپ لیبل‌های انتخابی" /tmp/multiprint/verify/order-multiprint-v53438.js
