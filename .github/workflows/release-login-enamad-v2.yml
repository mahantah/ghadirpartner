name: Release Compact Login Enamad Seal

# This one-time push hook deploys only when this reviewed workflow is added.
# Later releases require an explicit workflow_dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-login-enamad-v2.yml"

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the sealed login-only release
        run: |
          set -euo pipefail
          python3 -m pip install ruff mypy
          python3 -m ruff check scripts/patch-login-enamad-v2.py scripts/deploy-login-enamad-v2.py tests/test_login_enamad_v2.py tests/test_login_enamad_release.py
          python3 -m ruff format --check scripts/patch-login-enamad-v2.py scripts/deploy-login-enamad-v2.py tests/test_login_enamad_v2.py tests/test_login_enamad_release.py
          python3 -m mypy --strict scripts/patch-login-enamad-v2.py scripts/deploy-login-enamad-v2.py tests/test_login_enamad_v2.py tests/test_login_enamad_release.py
          python3 tests/test_login_enamad_v2.py
          python3 tests/test_login_enamad_release.py
          node --check assets/login-enamad-v2.js
          node tests/login-enamad-v2.cjs
      - name: Install secure FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Back up, release and verify live login seal
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-login-enamad-v2.py deploy
