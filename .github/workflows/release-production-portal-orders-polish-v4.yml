name: Release Production Portal Orders Polish V4
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  portal-orders-polish-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate portal orders polish v4
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-portal-orders-polish-v4.py
          python3 tests/production-portal-orders-polish-v4.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish portal orders polish v4
        run: python3 scripts/deploy-production-portal-orders-polish-v4.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_PORTAL_ORDERS_POLISH_V4_20261026' /tmp/live-app.html
          grep -Fq 'portal-orders-polish-v4.js?v=1' /tmp/live-app.html
          grep -Fq 'order-track-hide-list-v3.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/portal-orders-polish-v4.js?v=1' -o /tmp/live-polish.js
          grep -Fq 'stripPortalRows' /tmp/live-polish.js
          grep -Fq 'dropExtraBoxes' /tmp/live-polish.js
          grep -Fq 'نمایش همه سفارشات' /tmp/live-polish.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
