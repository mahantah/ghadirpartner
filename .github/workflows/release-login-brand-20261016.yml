name: Release approved OTP repair and branded loader
# Retry with distinct local snapshot filenames; no changes were uploaded by the first run.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-login-brand-20261016.yml']
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "github.event.head_commit.message == 'release: approved OTP repair and branded loader 20261016'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install validation and transfer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli curl nodejs
      - name: Validate code and download exact current files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          php -l lib/staff-login-otp.php
          php tests/staff-login-otp.php
          node --check assets/staff-login-otp.js
          mkdir -p "$RUNNER_TEMP/login-before/assets" "$RUNNER_TEMP/login-before/lib"
          python3 scripts/release-login-brand.py download
      - name: Preserve rollback code before any upload
        uses: actions/upload-artifact@v4
        with:
          name: login-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/login-before/
          retention-days: 30
          if-no-files-found: error
      - name: Publish targeted files and verify with automatic rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/release-login-brand.py publish
