name: Release Production Order Details Chrome V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  od-chrome-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate order details chrome v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-od-chrome-v1.py
          python3 tests/production-od-chrome-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish order details chrome v1
        run: python3 scripts/deploy-production-od-chrome-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_OD_CHROME_V1_20261026' /tmp/live-app.html
          grep -Fq 'od-chrome-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'search-filter-fab-click-v3.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/od-chrome-v1.js?v=1' -o /tmp/live-od-chrome.js
          grep -Fq 'paintPdf' /tmp/live-od-chrome.js
          grep -Fq 'desktop-sidebar-open' /tmp/live-od-chrome.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
