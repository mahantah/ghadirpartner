name: Release Production Order Track Hide List V3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  order-track-hide-list-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate order track hide list v3
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-order-track-hide-list-v3.py
          python3 tests/production-order-track-hide-list-v3.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish order track hide list v3
        run: python3 scripts/deploy-production-order-track-hide-list-v3.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_ORDER_TRACK_HIDE_LIST_V3_20261026' /tmp/live-app.html
          grep -Fq 'order-track-hide-list-v3.js?v=1' /tmp/live-app.html
          grep -Fq 'order-track-scope-v2.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/order-track-hide-list-v3.js?v=1' -o /tmp/live-hide.js
          grep -Fq 'gpOrderTrack' /tmp/live-hide.js
          grep -Fq 'removeTrack' /tmp/live-hide.js
          grep -Fq 'نمایش همه سفارشات' /tmp/live-hide.js
          grep -Fq 'سفارش‌های در جریان' /tmp/live-hide.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
