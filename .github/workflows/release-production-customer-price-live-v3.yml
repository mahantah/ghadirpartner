name: Release Production Customer Price Live V3
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  price-live-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate overlay after the live business script
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-customer-price-live-v3.py
          python3 tests/production-customer-price-live-v3.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish live-v3 overlay
        run: python3 scripts/deploy-production-customer-price-live-v3.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_CUSTOMER_PRICE_ACCESS_LIVE_V3_20261025' /tmp/live-app.html
          grep -Fq 'customer-price-access-live-v3.js?v=3' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/customer-price-access-live-v3.js?v=3' -o /tmp/live-overlay.js
          grep -Fq 'GP_CUSTOMER_PRICE_ACCESS_LIVE_V3_20261025' /tmp/live-overlay.js
          grep -Fq 'openCustomerPriceEdit' /tmp/live-overlay.js
          grep -Fq 'ویرایش قیمت' /tmp/live-overlay.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
