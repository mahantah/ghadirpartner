name: Release Production Account Logout Access V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate fix
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-account-logout-access-v1.py
          node --check assets/account-logout-access-v1.js
          node tests/account-logout-access-v1.test.js
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish
        run: python3 scripts/deploy-production-account-logout-access-v1.py deploy
      - name: Confirm live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html -o /tmp/live-app.html
          grep -Fq 'GP_ACCOUNT_LOGOUT_ACCESS_V1_20261026' /tmp/live-app.html
          curl -fsSL --max-time 30 https://ghadirpartner.ir/assets/account-logout-access-v1.js?v=1 | grep -Fq gp-account-docked
