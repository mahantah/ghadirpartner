name: Audit Live Warehouse Daily Blocks
on:
  push:
    branches:
      - audit-live-sidebar-cleanup-20261010
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Inspect live warehouse daily asset
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /assets/warehouse-v53438.js -o /tmp/live/warehouse-v53438.js
          bye
          EOF
          grep -n -E -A25 -B25 "رسید انبار|انتقال / خروج / مرجوعی|رسید|مرجوعی|movement" /tmp/live/warehouse-v53438.js | head -n 2200 || true
