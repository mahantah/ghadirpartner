name: Audit Live Sidebar Cleanup
on:
  push:
    branches:
      - audit-live-sidebar-cleanup-20261010
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Inspect live sidebar assets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o /tmp/live/app.html
          get /assets/ui-v53435.js -o /tmp/live/ui-v53435.js
          get /assets/business-v53437.js -o /tmp/live/business-v53437.js
          get /assets/ops-v53434.js -o /tmp/live/ops-v53434.js
          get /assets/redesign-v5348.js -o /tmp/live/redesign-v5348.js
          get /assets/bugfix-v5349.js -o /tmp/live/bugfix-v5349.js
          bye
          EOF
          echo "=== SIDEBAR ASSETS ==="
          grep -n -E -A18 -B18 "مدیریت انبار|لیست قیمت|قیمت و موجودی|warehouseDaily|portalAdmin|data-tab" /tmp/live/*.js | head -n 2200 || true
