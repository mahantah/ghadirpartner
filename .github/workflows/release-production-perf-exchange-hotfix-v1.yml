name: Release Production Perf Exchange Hotfix V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate hotfix
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-perf-exchange-hotfix-v1.py
          grep -Fq refreshUsesBootstrap assets/customer-ops-stabilize-v1.js
          grep -Fq GP_ORDER_RETURN_EXCHANGE_V2_20261026 assets/order-return-exchange-v2.js
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish hotfix
        run: python3 scripts/deploy-production-perf-exchange-hotfix-v1.py deploy
      - name: Confirm live
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://ghadirpartner.ir/app.html -o /tmp/live-app.html
          grep -Fq 'GP_PERF_EXCHANGE_HOTFIX_V1_20261026' /tmp/live-app.html
          grep -Fq 'order-return-exchange-v2.js?v=1' /tmp/live-app.html
          grep -Fq 'customer-ops-stabilize-v1.js?v=2' /tmp/live-app.html
          curl -fsSL --max-time 30 https://ghadirpartner.ir/assets/order-return-exchange-v2.js?v=1 | grep -Fq fetchFreeSerials
          curl -fsSL --max-time 30 https://ghadirpartner.ir/assets/customer-ops-stabilize-v1.js?v=2 | grep -Fq refreshUsesBootstrap
