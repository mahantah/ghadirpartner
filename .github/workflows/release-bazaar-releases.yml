name: Automation Bazaar release manager
on:
  pull_request:
    paths: ['lib/bazaar*.php', 'assets/bazaar-releases*', 'scripts/*bazaar*', 'tests/*bazaar*', 'tests/fixtures/bazaar-apk.php', 'config/bazaar*', '.github/workflows/release-bazaar-releases.yml']
  push:
    branches: [main]
    paths: ['lib/bazaar*.php', 'assets/bazaar-releases*', 'scripts/*bazaar*', 'tests/*bazaar*', 'tests/fixtures/bazaar-apk.php', 'config/bazaar*', '.github/workflows/release-bazaar-releases.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-bazaar-web-release
  cancel-in-progress: false
jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, iconv, zip
          coverage: none
      - name: Verify real signatures, upload state and authorization fixtures
        run: |
          for path in lib/bazaar*.php scripts/bazaar-release-preflight.php scripts/bazaar-preflight-state.php tests/bazaar*.php tests/fixtures/bazaar-apk.php; do php -l "$path"; done
          php tests/bazaar-releases.php
          php tests/bazaar-routes.php
          php tests/bazaar-preflight-state.php
  typed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict web and deployment checks
        run: |
          npm ci --prefix tooling/partial-delivery-web --ignore-scripts --no-audit --no-fund
          npm install --prefix /tmp/bazaar-dom --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          python -m pip install ruff mypy
          python -m ruff check scripts/stage-bazaar-releases.py scripts/deploy-bazaar-releases.py tests/test_bazaar_release_stage.py
          python -m ruff format --check scripts/stage-bazaar-releases.py scripts/deploy-bazaar-releases.py tests/test_bazaar_release_stage.py
          python -m mypy --strict scripts/stage-bazaar-releases.py scripts/deploy-bazaar-releases.py tests/test_bazaar_release_stage.py
          python tests/test_bazaar_release_stage.py
          tooling/partial-delivery-web/node_modules/.bin/tsc -p config/bazaar-releases.tsconfig.json
          tooling/partial-delivery-web/node_modules/.bin/eslint --config tooling/partial-delivery-web/eslint.config.mjs scripts/bazaar-releases.ts --max-warnings 0
          tooling/partial-delivery-web/node_modules/.bin/prettier --check scripts/bazaar-releases.ts assets/bazaar-releases.css config/bazaar-releases.tsconfig.json
          tooling/partial-delivery-web/node_modules/.bin/prettier --parser json --check config/bazaar-releases.yaml config/bazaar-web-release.yaml
          tooling/partial-delivery-web/node_modules/.bin/tsc -p config/bazaar-releases.tsconfig.json --noEmit false --outFile /tmp/bazaar-releases.js
          cmp assets/bazaar-releases.js /tmp/bazaar-releases.js
          GP_JSDOM_PATH=/tmp/bazaar-dom/node_modules/jsdom node tests/bazaar-releases.cjs
  production:
    needs: [php, typed]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    concurrency:
      group: ghadirpartner-production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Inspect exact production entry points without state writes
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-bazaar-releases.py inspect
      - name: Install and verify the admin release manager
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy-bazaar-releases.py apply
