name: Deploy Web V5.3.4.5 Figma Exact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Web V5.3.4.5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip lftp

      - name: Verify uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GhadirPartner-Web-V5.3.4.5-REDESIGN-CANDIDATE-PATCH.zip"
          test -f "$ZIP" || {
            echo "::error::Missing $ZIP in repository root"
            exit 1
          }
          unzip -t "$ZIP" >/dev/null
          echo "Patch ZIP OK"

      - name: Build deployable release from current runtime + Figma patch
        id: release
        shell: bash
        run: |
          set -euo pipefail

          ZIP="GhadirPartner-Web-V5.3.4.5-REDESIGN-CANDIDATE-PATCH.zip"

          rm -rf /tmp/ghadir-release /tmp/ghadir-patch
          mkdir -p /tmp/ghadir-release /tmp/ghadir-patch

          unzip -q "$ZIP" -d /tmp/ghadir-patch

          PATCH_INSTALL="$(find /tmp/ghadir-patch -type f -name install_patch.py | head -n1 || true)"
          test -n "$PATCH_INSTALL" || {
            echo "::error::install_patch.py not found in patch ZIP"
            exit 1
          }

          # Copy only runtime files from repository.
          for f in \
            index.php app.html mobile.html logo.png \
            .htaccess .user.ini php.ini \
            config.example.php VERSION.txt
          do
            if [ -f "$f" ]; then
              cp -a "$f" /tmp/ghadir-release/
            fi
          done

          mkdir -p /tmp/ghadir-release/partners
          mkdir -p /tmp/ghadir-release/storage

          for f in \
            partners/index.php \
            partners/portal.html \
            partners/logo.png \
            partners/.htaccess \
            partners/manifest.webmanifest \
            partners/sw.js \
            partners/config.example.php
          do
            if [ -f "$f" ]; then
              cp -a "$f" "/tmp/ghadir-release/$f"
            fi
          done

          for f in storage/.htaccess storage/README.txt
          do
            if [ -f "$f" ]; then
              cp -a "$f" "/tmp/ghadir-release/$f"
            fi
          done

          python3 "$PATCH_INSTALL" /tmp/ghadir-release

          test -f /tmp/ghadir-release/index.php || {
            echo "::error::index.php missing after patch"
            exit 1
          }

          test -f /tmp/ghadir-release/app.html || {
            echo "::error::app.html missing after patch"
            exit 1
          }

          test -f /tmp/ghadir-release/partners/portal.html || {
            echo "::error::partners/portal.html missing after patch"
            exit 1
          }

          test -f /tmp/ghadir-release/figma-exact.css || {
            echo "::error::figma-exact.css was not installed"
            exit 1
          }

          test -f /tmp/ghadir-release/figma-exact.js || {
            echo "::error::figma-exact.js was not installed"
            exit 1
          }

          test -f /tmp/ghadir-release/partners/figma-android.css || {
            echo "::error::partners/figma-android.css was not installed"
            exit 1
          }

          test -f /tmp/ghadir-release/partners/figma-android.js || {
            echo "::error::partners/figma-android.js was not installed"
            exit 1
          }

          # Production secrets/data must never be inside the release.
          if find /tmp/ghadir-release -type f \
            \( -name config.php -o -name .env -o -name ghadir_data.json \) | grep -q .
          then
            echo "::error::Protected production config/data detected"
            exit 1
          fi

          VERSION="$(tr -d '\r\n ' < /tmp/ghadir-release/VERSION.txt)"
          echo "Prepared version: $VERSION"
          echo "root=/tmp/ghadir-release" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload prepared web package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Web-V5.3.4.5-Prepared
          path: /tmp/ghadir-release/
          retention-days: 7

      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RELEASE_ROOT: ${{ steps.release.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${FTP_SERVER:-}" || { echo "::error::FTP_SERVER secret missing"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "::error::FTP_USERNAME secret missing"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret missing"; exit 1; }

          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 25

          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"

          mirror -R --verbose --parallel=2 \
            --exclude-glob config.php \
            --exclude-glob partners/config.php \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob storage/** \
            --exclude-glob '*.sql' \
            --exclude-glob '*.zip' \
            "$RELEASE_ROOT/" /

          bye
          EOF

      - name: Production health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 \
            -o /dev/null https://ghadirpartner.ir/
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 \
            -o /dev/null https://ghadirpartner.ir/partners/

      - name: Summary
        run: |
          echo "### GhadirPartner Web deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: V5.3.4.5 FIGMA EXACT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Patch: GhadirPartner-Web-V5.3.4.5-REDESIGN-CANDIDATE-PATCH.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- config.php and storage data: protected" >> "$GITHUB_STEP_SUMMARY"
