name: Inspect Previous Login Code
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-login-code.yml']
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read only code from the last preserved release snapshot
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          mkdir -p /tmp/login-code/previous /tmp/login-code/current
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cls -1 / > /tmp/login-root-names.txt
          cls -1 /assets > /tmp/login-asset-names.txt
          bye
          EOF
          python3 - <<'PYREPORT'
          from pathlib import Path
          import re
          for kind, filename in [('root', '/tmp/login-root-names.txt'), ('assets', '/tmp/login-asset-names.txt')]:
              names = Path(filename).read_text().splitlines()
              safe = [name for name in names if re.search(r'login|auth|app[._-]|index[._-]|\.css$', name, re.I)]
              print(kind + ' code/asset candidates:', safe)
          PYREPORT
