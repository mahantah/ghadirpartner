name: Build Ghadir Partner Portal APK v5.4.4.0 FIXED

on:
  workflow_dispatch:
    inputs:
      android_zip:
        description: 'Android ZIP in repository root. Leave AUTO to auto-detect v5.4.4.0.'
        required: true
        default: 'AUTO'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        id: source
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.android_zip }}
        run: |
          set -euo pipefail

          echo 'Repository root Android ZIP files:'
          ls -lah GhadirPartner-Android*.zip 2>/dev/null || true

          ZIP=''
          if [[ -n "${REQUESTED_ZIP:-}" && "$REQUESTED_ZIP" != 'AUTO' ]]; then
            ZIP="$(basename "$REQUESTED_ZIP")"
            if [[ "$ZIP" != "$REQUESTED_ZIP" ]]; then
              echo '::error::android_zip must be a filename in repository root, not a path.'
              exit 1
            fi
            if [[ ! -f "$ZIP" ]]; then
              echo "::error::Requested Android ZIP not found: $ZIP"
              exit 1
            fi
          else
            for CANDIDATE in \
              'GhadirPartner-Android-V5.4.4.0-BUILD-READY.zip' \
              'GhadirPartner-Android-SOURCE-V5.4.4.0.zip' \
              'GhadirPartner-Android-Native-V5.4.4.0-FINAL.zip'
            do
              if [[ -f "$CANDIDATE" ]]; then
                ZIP="$CANDIDATE"
                break
              fi
            done

            if [[ -z "$ZIP" ]]; then
              ZIP="$(find . -maxdepth 1 -type f -name 'GhadirPartner-Android*V5.4.4.0*.zip' -printf '%f\n' | sort | head -n1 || true)"
            fi

            if [[ -z "$ZIP" ]]; then
              echo '::error::No Android v5.4.4.0 ZIP was found in repository root.'
              exit 1
            fi
          fi

          echo "Selected source ZIP: $ZIP"
          unzip -tq "$ZIP" >/dev/null || {
            echo "::error::ZIP integrity test failed: $ZIP"
            exit 1
          }

          rm -rf /tmp/ghadir-android
          mkdir -p /tmp/ghadir-android
          unzip -q "$ZIP" -d /tmp/ghadir-android

          SETTINGS="$(find /tmp/ghadir-android -maxdepth 3 -type f -name settings.gradle -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo '::error::settings.gradle not found after extraction.'
            find /tmp/ghadir-android -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          ROOT="$(dirname "$SETTINGS")"
          echo "Detected Android project root: $ROOT"

          if [[ ! -f "$ROOT/app/build.gradle" ]]; then
            echo '::error::app/build.gradle not found.'
            exit 1
          fi

          if ! grep -Eq "versionName[[:space:]]+['\"]5\\.4\\.4\\.0['\"]" "$ROOT/app/build.gradle"; then
            echo '::error::app/build.gradle does not declare versionName 5.4.4.0.'
            grep -n 'versionName\|versionCode' "$ROOT/app/build.gradle" || true
            exit 1
          fi

          if ! grep -q '^android.useAndroidX=true$' "$ROOT/gradle.properties"; then
            echo '::error::android.useAndroidX=true is missing from gradle.properties.'
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Build installable customer Portal APK
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain clean assemblePortalDebug --stacktrace 2>&1 | tee /tmp/ghadir-android-build.log

      - name: Prepare install package
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.root }}'
          APK="$ROOT/app/build/outputs/apk/portal/debug/app-portal-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::Expected APK not found: $APK"
            find "$ROOT/app/build/outputs" -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p /tmp/ghadir-apk
          cp "$APK" /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk
          sha256sum /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk > /tmp/ghadir-apk/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Portal-V5.4.4.0-INSTALL
          path: |
            /tmp/ghadir-apk/GhadirPartner-Portal-V5.4.4.0-INSTALL.apk
            /tmp/ghadir-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GhadirPartner-Portal-V5.4.4.0-BUILD-LOG
          path: /tmp/ghadir-android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo '### Ghadir Partner Android v5.4.4.0' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ZIP: \`${{ steps.source.outputs.zip }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Variant: `portalDebug`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Expected artifact: `GhadirPartner-Portal-V5.4.4.0-INSTALL`' >> "$GITHUB_STEP_SUMMARY"
