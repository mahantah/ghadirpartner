name: Deploy retail transfer carton detach v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-retail-transfer-carton-v1.yml'
      - 'scripts/patch-retail-transfer-detach-carton-v1.py'

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp php-cli curl

      - name: Download live index
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gp-retail-transfer
          mkdir -p /tmp/gp-retail-transfer/live/lib /tmp/gp-retail-transfer/backup/lib /tmp/gp-retail-transfer/verify/lib
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-retail-transfer/live/index.php
          get /lib/warehouse-v53438.php -o /tmp/gp-retail-transfer/live/lib/warehouse-v53438.php
          bye
          EOF
          cp /tmp/gp-retail-transfer/live/index.php /tmp/gp-retail-transfer/backup/index.php
          cp /tmp/gp-retail-transfer/live/lib/warehouse-v53438.php /tmp/gp-retail-transfer/backup/lib/warehouse-v53438.php

      - name: Patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-retail-transfer-detach-carton-v1.py /tmp/gp-retail-transfer/live
          php -l /tmp/gp-retail-transfer/live/index.php
          php -l /tmp/gp-retail-transfer/live/lib/warehouse-v53438.php
          grep -Rq 'WAREHOUSE_RETAIL_DETACH_CARTON_V1_20261015' /tmp/gp-retail-transfer/live
          grep -Rq "detached_from_carton_id" /tmp/gp-retail-transfer/live
          grep -Rq "last_split_to_warehouse_id" /tmp/gp-retail-transfer/live

      - name: Deploy patched index
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-retail-transfer/live/index.php -o /index.php
          put /tmp/gp-retail-transfer/live/lib/warehouse-v53438.php -o /lib/warehouse-v53438.php
          bye
          EOF

      - name: Verify live
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /index.php -o /tmp/gp-retail-transfer/verify/index.php
          get /lib/warehouse-v53438.php -o /tmp/gp-retail-transfer/verify/lib/warehouse-v53438.php
          bye
          EOF
          php -l /tmp/gp-retail-transfer/verify/index.php
          php -l /tmp/gp-retail-transfer/verify/lib/warehouse-v53438.php
          grep -Rq 'WAREHOUSE_RETAIL_DETACH_CARTON_V1_20261015' /tmp/gp-retail-transfer/verify
          cmp /tmp/gp-retail-transfer/live/index.php /tmp/gp-retail-transfer/verify/index.php
          cmp /tmp/gp-retail-transfer/live/lib/warehouse-v53438.php /tmp/gp-retail-transfer/verify/lib/warehouse-v53438.php
          curl -fsS --max-time 25 https://ghadirpartner.ir/healthz

      - name: Roll back on failure
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set +e
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put /tmp/gp-retail-transfer/backup/index.php -o /index.php
          put /tmp/gp-retail-transfer/backup/lib/warehouse-v53438.php -o /lib/warehouse-v53438.php
          bye
          EOF
