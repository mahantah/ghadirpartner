name: Release Production Customer Price Access
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  price-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate targeted price-access patches against live HTML
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_production_customer_price_access.py
          python3 -m py_compile scripts/deploy-production-customer-price-access.py
          python3 tests/production-customer-price-access.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish helper and patched live files
        run: python3 scripts/deploy-production-customer-price-access.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app-after.html
          grep -Fq 'GP_CUSTOMER_PRICE_ACCESS_20261025' /tmp/live-app-after.html
          grep -Fq 'visible_price_groups:readPriceGroups' /tmp/live-app-after.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/partners/portal.html' -o /tmp/live-portal-after.html
          grep -Fq 'function visiblePriceGroups()' /tmp/live-portal-after.html
