name: Release customer serial visibility and remove closed menu residue (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-restore-customer-serials-v2-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: restore customer serials and fully hide closed nav 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure FTPS and JavaScript verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs

      - name: Snapshot live app and prepare strictly scoped UI patch
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/serials-before" "$RUNNER_TEMP/serials-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/serials-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/serials-before/app.html"
          cp "$RUNNER_TEMP/serials-before/app.html" "$RUNNER_TEMP/serials-after/app.html"
          for marker in 'GHADIR_WAREHOUSE_SERIAL_FILTERS_GHOST_V1_20261017' 'GHADIR_SIDEBAR_REAL_EDGE_V4_20261017' 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016'; do
            grep -Fq "$marker" "$RUNNER_TEMP/serials-after/app.html"
          done
          python3 scripts/patch-warehouse-serial-filters-v2.py "$RUNNER_TEMP/serials-after"
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_RESTORE_NAV_GHOST_V2_20261017' "$RUNNER_TEMP/serials-after/app.html"
          grep -Fq '/assets/warehouse-serial-filters-v2.css?v=20261017f2' "$RUNNER_TEMP/serials-after/app.html"
          grep -Fq '/assets/warehouse-serial-filters-v2.js?v=20261017f2' "$RUNNER_TEMP/serials-after/app.html"
          ! grep -Fq '/assets/warehouse-serial-filters-v1.js?v=20261017f1' "$RUNNER_TEMP/serials-after/app.html"
          node --check assets/warehouse-serial-filters-v2.js
          for marker in 'id="login"' 'id="warehouseBody"' 'id="inventoryGroups"' 'data-tab="inventory"' 'data-tab="customers"' 'id="changePasswordBtn"' 'id="logoutbtn"' '/print/warehouse-label?id='; do
            grep -Fq "$marker" "$RUNNER_TEMP/serials-after/app.html"
          done

      - name: Publish only changed UI assets, verify or revert
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            code=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Serials V2 release check failed; restoring former app.html.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/serials-before/app.html" -o /app.html
          rm -f /assets/warehouse-serial-filters-v2.css
          rm -f /assets/warehouse-serial-filters-v2.js
          bye
          EOF
            fi
            exit "$code"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/warehouse-serial-filters-v2.css" -o /assets/warehouse-serial-filters-v2.css
          put "assets/warehouse-serial-filters-v2.js" -o /assets/warehouse-serial-filters-v2.js
          put "$RUNNER_TEMP/serials-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/serials-live.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_RESTORE_NAV_GHOST_V2_20261017' "$RUNNER_TEMP/serials-live.html"
          grep -Fq '/assets/warehouse-serial-filters-v2.css?v=20261017f2' "$RUNNER_TEMP/serials-live.html"
          grep -Fq '/assets/warehouse-serial-filters-v2.js?v=20261017f2' "$RUNNER_TEMP/serials-live.html"
          ! grep -Fq '/assets/warehouse-serial-filters-v1.js?v=20261017f1' "$RUNNER_TEMP/serials-live.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/serials-live.js" 'https://ghadirpartner.ir/assets/warehouse-serial-filters-v2.js?v=20261017f2'
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_RESTORE_NAV_GHOST_V2_20261017' "$RUNNER_TEMP/serials-live.js"
          node --check "$RUNNER_TEMP/serials-live.js"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/serials-live.css" 'https://ghadirpartner.ir/assets/warehouse-serial-filters-v2.css?v=20261017f2'
          grep -Fq 'GHADIR_CUSTOMER_SERIAL_RESTORE_NAV_GHOST_V2_20261017' "$RUNNER_TEMP/serials-live.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Customer serial visibility and cleanly collapsed sidebar UI are live; file and health checks passed. No business data changed.'
