name: Release animated order action burger (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-order-action-burger-v1-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: enable animated order actions 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure FTPS and JavaScript verification
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs
      - name: Back up real site entrypoint and prepare narrow order UI update
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/order-before" "$RUNNER_TEMP/order-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/order-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/order-before/app.html"
          cp "$RUNNER_TEMP/order-before/app.html" "$RUNNER_TEMP/order-after/app.html"
          for mark in 'GHADIR_REMOVE_LEGACY_DESKTOP_SIDEBAR_SHELL_V1_20261017' 'GHADIR_CUSTOMER_MODEL_CATALOG_V5_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016'; do
            grep -Fq "$mark" "$RUNNER_TEMP/order-after/app.html"
          done
          python3 scripts/patch-order-action-burger-v1.py "$RUNNER_TEMP/order-after"
          grep -Fq 'GHADIR_ORDER_ACTION_BURGER_V1_20261017' "$RUNNER_TEMP/order-after/app.html"
          grep -Fq '/assets/order-action-burger-v1.css?v=20261017b1' "$RUNNER_TEMP/order-after/app.html"
          grep -Fq '/assets/order-action-burger-v1.js?v=20261017b1' "$RUNNER_TEMP/order-after/app.html"
          node --check assets/order-action-burger-v1.js
          for mark in 'id="orders"' 'toggleOrderMenu' 'closeOrderMenus' 'data-tab="inventory"' 'data-tab="customers"' 'id="logoutbtn"'; do
            grep -Fq "$mark" "$RUNNER_TEMP/order-after/app.html"
          done
      - name: Publish only order-menu UI and verify or restore previous app
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            code=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Order action icon release failed validation; restoring prior production app.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/order-before/app.html" -o /app.html
          rm -f /assets/order-action-burger-v1.css
          rm -f /assets/order-action-burger-v1.js
          bye
          EOF
            fi
            exit "$code"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/order-action-burger-v1.css" -o /assets/order-action-burger-v1.css
          put "assets/order-action-burger-v1.js" -o /assets/order-action-burger-v1.js
          put "$RUNNER_TEMP/order-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-orders.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_ORDER_ACTION_BURGER_V1_20261017' "$RUNNER_TEMP/live-orders.html"
          grep -Fq '/assets/order-action-burger-v1.css?v=20261017b1' "$RUNNER_TEMP/live-orders.html"
          grep -Fq '/assets/order-action-burger-v1.js?v=20261017b1' "$RUNNER_TEMP/live-orders.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-orders.css" 'https://ghadirpartner.ir/assets/order-action-burger-v1.css?v=20261017b1'
          grep -Fq 'GHADIR_ORDER_ACTION_BURGER_V1_20261017' "$RUNNER_TEMP/live-orders.css"
          grep -Fq 'rotate(405deg)' "$RUNNER_TEMP/live-orders.css"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-orders.js" 'https://ghadirpartner.ir/assets/order-action-burger-v1.js?v=20261017b1'
          grep -Fq 'GHADIR_ORDER_ACTION_BURGER_V1_20261017' "$RUNNER_TEMP/live-orders.js"
          grep -Fq 'button.click()' "$RUNNER_TEMP/live-orders.js"
          node --check "$RUNNER_TEMP/live-orders.js"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Animated per-order hamburger/X live; native order action functions, production assets and health verified.'
