name: Release Production Toggle Switch Polish V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  toggle-switch-polish-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate toggle switch polish v1
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-toggle-switch-polish-v1.py
          python3 tests/production-toggle-switch-polish-v1.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish toggle switch polish v1
        run: python3 scripts/deploy-production-toggle-switch-polish-v1.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_TOGGLE_SWITCH_POLISH_V1_20261025' /tmp/live-app.html
          grep -Fq 'toggle-switch-polish-v1.js?v=1' /tmp/live-app.html
          grep -Fq 'choice-ui-icons-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/toggle-switch-polish-v1.js?v=1' -o /tmp/live-tog.js
          grep -Fq 'toggle-border' /tmp/live-tog.js
          grep -Fq 'gap:0!important' /tmp/live-tog.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
