name: Release remove legacy desktop 282px navy sidebar shell (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-remove-legacy-sidebar-shell-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: remove obsolete navy sidebar shell 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure FTP and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl

      - name: Snapshot live app, verify specific original bug and apply UI-only patch
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/shell-before" "$RUNNER_TEMP/shell-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/shell-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/shell-before/app.html"
          cp "$RUNNER_TEMP/shell-before/app.html" "$RUNNER_TEMP/shell-after/app.html"
          for mark in 'GHADIR_NAV_MORPH_V1_20261017' 'GHADIR_DESKTOP_SIDEBAR_COLLAPSE_V3_20261017' 'GHADIR_CUSTOMER_MODEL_CATALOG_V5_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016' 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017'; do
            grep -Fq "$mark" "$RUNNER_TEMP/shell-after/app.html"
          done
          # Verify the outdated 282px rule that created the pictured navy bar.
          grep -Fq '282px' "$RUNNER_TEMP/shell-before/app.html"
          python3 scripts/patch-remove-legacy-desktop-sidebar-shell-v1.py "$RUNNER_TEMP/shell-after"
          grep -Fq 'GHADIR_REMOVE_LEGACY_DESKTOP_SIDEBAR_SHELL_V1_20261017' "$RUNNER_TEMP/shell-after/app.html"
          grep -Fq '/assets/remove-legacy-desktop-sidebar-shell-v1.css?v=20261017s1' "$RUNNER_TEMP/shell-after/app.html"
          for mark in 'id="inventoryGroups"' 'id="warehouseBody"' 'data-tab="orders"' 'data-tab="warehouse"' 'data-tab="inventory"' 'id="changePasswordBtn"' 'id="logoutbtn"'; do
            grep -Fq "$mark" "$RUNNER_TEMP/shell-after/app.html"
          done

      - name: Publish only shell CSS and app reference, verify and rollback if needed
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            code=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Desktop shell release failed live verification; restoring previous app.html.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/shell-before/app.html" -o /app.html
          rm -f /assets/remove-legacy-desktop-sidebar-shell-v1.css
          bye
          EOF
            fi
            exit "$code"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/remove-legacy-desktop-sidebar-shell-v1.css" -o /assets/remove-legacy-desktop-sidebar-shell-v1.css
          put "$RUNNER_TEMP/shell-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/shell-live.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_REMOVE_LEGACY_DESKTOP_SIDEBAR_SHELL_V1_20261017' "$RUNNER_TEMP/shell-live.html"
          grep -Fq '/assets/remove-legacy-desktop-sidebar-shell-v1.css?v=20261017s1' "$RUNNER_TEMP/shell-live.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/shell-live.css" 'https://ghadirpartner.ir/assets/remove-legacy-desktop-sidebar-shell-v1.css?v=20261017s1'
          grep -Fq 'GHADIR_REMOVE_LEGACY_DESKTOP_SIDEBAR_SHELL_V1_20261017' "$RUNNER_TEMP/shell-live.css"
          grep -Fq 'max-width:0!important' "$RUNNER_TEMP/shell-live.css"
          grep -Fq 'margin:0!important' "$RUNNER_TEMP/shell-live.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Legacy 282px navy sidebar shell removed from production. App CSS assets and health validated; customer data untouched.'
