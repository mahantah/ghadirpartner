name: Release Production Warehouse Ops Harden V2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  warehouse-ops-harden-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate warehouse ops harden v2
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy-production-warehouse-ops-harden-v2.py
          python3 tests/production-warehouse-ops-harden-v2.py
      - name: Install FTPS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Publish warehouse ops harden v2
        run: python3 scripts/deploy-production-warehouse-ops-harden-v2.py deploy
      - name: Confirm public automation page
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/app.html' -o /tmp/live-app.html
          grep -Fq 'GP_WAREHOUSE_OPS_HARDEN_V2_20261026' /tmp/live-app.html
          grep -Fq 'warehouse-ops-harden-v2.js?v=1' /tmp/live-app.html
          grep -Fq 'warehouse-tab-ops-agent-v1.js?v=1' /tmp/live-app.html
          ! grep -Fq 'number-counter-v1.js' /tmp/live-app.html
          curl -fsSL --max-time 30 'https://ghadirpartner.ir/assets/warehouse-ops-harden-v2.js?v=1' -o /tmp/live-wh-ops2.js
          grep -Fq 'isolateWarehouse' /tmp/live-wh-ops2.js
          grep -Fq 'gpChangeCoop' /tmp/live-wh-ops2.js
          grep -Fq 'عاملین فروش' /tmp/live-wh-ops2.js
          curl -fsSL --max-time 20 https://ghadirpartner.ir/healthz
          echo
