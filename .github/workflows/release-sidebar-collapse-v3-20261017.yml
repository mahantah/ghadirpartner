name: Release desktop sidebar collapse fix (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-sidebar-collapse-v3-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false
jobs:
  deploy:
    if: "${{ github.event.head_commit.message == 'release: apply desktop sidebar collapse fix 2026-10-17' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Install secure transfer and check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl nodejs
      - name: Download real production app and prepare narrow UI patch
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          mkdir -p "$RUNNER_TEMP/collapse-before" "$RUNNER_TEMP/collapse-after"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /app.html -o "$RUNNER_TEMP/collapse-before/app.html"
          bye
          EOF
          test -s "$RUNNER_TEMP/collapse-before/app.html"
          cp "$RUNNER_TEMP/collapse-before/app.html" "$RUNNER_TEMP/collapse-after/app.html"
          for marker in 'GHADIR_NAV_MORPH_V1_20261017' 'GHADIR_SIDEBAR_EDGE_PROFILE_V2_20261017' 'GHADIR_SIDEBAR_PROFILE_POLISH_V1_20261017' 'GHADIR_LOGIN_STARTUP_SPLASH_V1_20261017' 'GHADIR_STAFF_LOGIN_OTP_UI_V1_20261016'; do
            grep -Fq "$marker" "$RUNNER_TEMP/collapse-after/app.html"
          done
          python3 scripts/patch-sidebar-collapse-v3.py "$RUNNER_TEMP/collapse-after"
          grep -Fq 'GHADIR_DESKTOP_SIDEBAR_COLLAPSE_V3_20261017' "$RUNNER_TEMP/collapse-after/app.html"
          grep -Fq '/assets/sidebar-collapse-v3.css?v=20261017c1' "$RUNNER_TEMP/collapse-after/app.html"
          test -s assets/sidebar-collapse-v3.css
          for marker in 'id="login"' 'data-tab="orders"' 'data-tab="warehouse"' 'data-tab="customers"' 'id="changePasswordBtn"' 'id="logoutbtn"'; do
            grep -Fq "$marker" "$RUNNER_TEMP/collapse-after/app.html"
          done
      - name: Publish only CSS and app reference, verify or restore
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DEPLOY_STARTED=0
          rollback() {
            code=$?
            if [[ "$DEPLOY_STARTED" == "1" ]]; then
              echo 'Sidebar collapse deployment failed validation; restoring prior app.html.'
              lftp <<EOF || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "$RUNNER_TEMP/collapse-before/app.html" -o /app.html
          rm -f /assets/sidebar-collapse-v3.css
          bye
          EOF
            fi
            exit "$code"
          }
          trap rollback ERR
          DEPLOY_STARTED=1
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          put "assets/sidebar-collapse-v3.css" -o /assets/sidebar-collapse-v3.css
          put "$RUNNER_TEMP/collapse-after/app.html" -o /app.html
          bye
          EOF
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-app.html" 'https://ghadirpartner.ir/app.html'
          grep -Fq 'GHADIR_DESKTOP_SIDEBAR_COLLAPSE_V3_20261017' "$RUNNER_TEMP/live-app.html"
          grep -Fq '/assets/sidebar-collapse-v3.css?v=20261017c1' "$RUNNER_TEMP/live-app.html"
          curl -fsS --retry 3 --max-time 25 -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/live-collapse.css" 'https://ghadirpartner.ir/assets/sidebar-collapse-v3.css?v=20261017c1'
          grep -Fq 'GHADIR_DESKTOP_SIDEBAR_COLLAPSE_V3_20261017' "$RUNNER_TEMP/live-collapse.css"
          grep -Fq 'transform:translate3d(110%,0,0)!important' "$RUNNER_TEMP/live-collapse.css"
          curl -fsS --retry 3 --max-time 25 -o "$RUNNER_TEMP/health.json" 'https://ghadirpartner.ir/healthz'
          grep -Fq 'V5.3.4.38' "$RUNNER_TEMP/health.json"
          DEPLOY_STARTED=0
          trap - ERR
          echo 'Sidebar actual open/close fix deployed. Production app, CSS, and health checks passed; no customer data modified.'
