name: Release compact warehouse counts

on:
  pull_request:
    paths:
      - 'config/warehouse-compact-counts-release.yaml'
  push:
    branches: [main]
    paths:
      - 'config/warehouse-compact-counts-release.yaml'
  workflow_dispatch:
    inputs:
      apply:
        description: Publish the reviewed warehouse count fix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghadirpartner-production-web
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned sources and run warehouse regression fixture
        run: python3 scripts/release-carton-serial-detail.py --config warehouse-compact-counts-release.yaml --mode inspect
      - name: Publish with rollback backups
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: python3 scripts/release-carton-serial-detail.py --config warehouse-compact-counts-release.yaml --mode apply
