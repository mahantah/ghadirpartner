name: Audit Live Inventory Before MySQL Migration

on:
  push:
    branches:
      - mysql-safe-migration-audit-20261004

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp php-cli jq zip

      - name: Download live data and create remote backup copy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ghadir-audit
          mkdir -p /tmp/ghadir-audit
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          get /storage/ghadir_data.json -o /tmp/ghadir-audit/ghadir_data.json
          get /config.php -o /tmp/ghadir-audit/config.php
          bye
          EOF
          php -r '$x=json_decode(file_get_contents("/tmp/ghadir-audit/ghadir_data.json"),true); if(!is_array($x)){fwrite(STDERR,"invalid json\n"); exit(2);} echo "json ok\n";'
          cp /tmp/ghadir-audit/ghadir_data.json /tmp/ghadir-audit/ghadir_data.pre-mysql.json
          TS="$(date -u +%Y%m%d-%H%M%S)"
          lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          open -p 21 "$FTP_SERVER"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /storage/Backups
          put /tmp/ghadir-audit/ghadir_data.pre-mysql.json -o "ghadir-pre-mysql-$TS.json"
          bye
          EOF
          echo "$TS" > /tmp/ghadir-audit/backup-ts.txt

      - name: Build sanitized audit report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,re,hashlib
          from pathlib import Path
          s=json.loads(Path('/tmp/ghadir-audit/ghadir_data.json').read_text())
          cfg=Path('/tmp/ghadir-audit/config.php').read_text(errors='ignore')
          wanted={97,98,99,100,101,102,103,109,110,111,112,113,114,115,116,123,124,125}
          cartons=s.get('cartons',[])
          inv=s.get('inventory',[])
          orders=s.get('orders',[])
          order_by_id={int(o.get('id',0)):o for o in orders}
          rows=[]
          for c in cartons:
              code=str(c.get('code',''))
              nums=[int(x) for x in re.findall(r'\d+',code)]
              if not nums or nums[-1] not in wanted: continue
              if 'I90' not in str(c.get('product','')).upper() and 'I90' not in code.upper(): continue
              cid=int(c.get('id',0))
              items=[x for x in inv if int(x.get('carton_id',0) or 0)==cid or str(x.get('carton_code',''))==code]
              assigned=[x for x in items if int(x.get('order_id',0) or 0)>0]
              sent=[]
              reserved=[]
              orphan=[]
              for x in assigned:
                  oid=int(x.get('order_id',0) or 0)
                  o=order_by_id.get(oid)
                  if not o:
                      orphan.append(x)
                  elif o.get('status') in ('ارسال شد','تحویل شد'):
                      sent.append(x)
                  else:
                      reserved.append(x)
              rows.append({
                  'carton_code':code,'carton_id':cid,'product':c.get('product',''),
                  'carton_serials':len(c.get('serials') or []),'inventory_rows':len(items),
                  'free':sum(1 for x in items if not int(x.get('order_id',0) or 0)),
                  'reserved_not_sent':len(reserved),'actually_sent':len(sent),'orphan_assigned':len(orphan),
                  'order_statuses':sorted(set(order_by_id.get(int(x.get('order_id',0) or 0),{}).get('status','MISSING') for x in assigned))
              })
          mysql_keys={
              'storage_driver':bool(re.search(r"['\"]storage_driver['\"]\s*=>",cfg)),
              'mysql_block':bool(re.search(r"['\"]mysql['\"]\s*=>",cfg)),
              'database':bool(re.search(r"['\"]database['\"]\s*=>\s*['\"][^'\"]+['\"]",cfg)),
              'username':bool(re.search(r"['\"]username['\"]\s*=>\s*['\"][^'\"]+['\"]",cfg)),
              'password_key':bool(re.search(r"['\"]password['\"]\s*=>",cfg)),
          }
          # Expanded audit: match target numbers against carton id/code/manufacturer box no,
          # and locate any synthetic/legacy "خروج تاریخی" ownership without exposing serial values.
          expanded=[]
          for c in cartons:
              fields=[str(c.get('id','')),str(c.get('code','')),str(c.get('manufacturer_box_no',''))]
              nums=set()
              for v in fields:
                  nums.update(int(x) for x in re.findall(r'\\d+',v))
              if not (nums & wanted): continue
              cid=int(c.get('id',0) or 0); code=str(c.get('code',''))
              items=[x for x in inv if int(x.get('carton_id',0) or 0)==cid or str(x.get('carton_code',''))==code]
              oids=sorted({int(x.get('order_id',0) or 0) for x in items if int(x.get('order_id',0) or 0)>0})
              owners=[]
              for oid in oids:
                  o=order_by_id.get(oid,{})
                  owners.append({'order_id':oid,'number':o.get('number',''),'customer_name':o.get('customer_name',''),'status':o.get('status','MISSING')})
              expanded.append({
                  'carton_id':cid,'code':code,'manufacturer_box_no':str(c.get('manufacturer_box_no','')),
                  'product':str(c.get('product','')),'serial_count':len(c.get('serials') or []),
                  'inventory_rows':len(items),'free':sum(1 for x in items if not int(x.get('order_id',0) or 0)),
                  'assigned':sum(1 for x in items if int(x.get('order_id',0) or 0)>0),'owners':owners
              })
          historical_orders=[]
          for o in orders:
              blob=' '.join([str(o.get('number','')),str(o.get('customer_name','')),str(o.get('notes',''))]+[str(h.get('action','')) for h in (o.get('history') or [])])
              if 'خروج تاریخی' in blob:
                  historical_orders.append({'id':o.get('id'),'number':o.get('number'),'customer_name':o.get('customer_name'),'status':o.get('status'),'items':[(it.get('product'),it.get('qty'),len(it.get('serials') or [])) for it in (o.get('items') or [])]})
          historical_customers=[{'id':x.get('id'),'name':x.get('name'),'code':x.get('code'),'company':x.get('company')} for x in s.get('customers',[]) if 'خروج تاریخی' in ' '.join(map(str,[x.get('name',''),x.get('code',''),x.get('company',''),x.get('notes','')]))]
          historical_inv_count=0
          historical_by_product={}
          hist_order_ids={int(x.get('id',0) or 0) for x in orders if 'خروج تاریخی' in ' '.join([str(x.get('number','')),str(x.get('customer_name','')),str(x.get('notes',''))]+[str(h.get('action','')) for h in (x.get('history') or [])])}
          for x in inv:
              if int(x.get('order_id',0) or 0) in hist_order_ids or 'خروج تاریخی' in ' '.join(map(str,[x.get('order_number',''),x.get('added_by','')])):
                  historical_inv_count+=1
                  p=str(x.get('product',''));historical_by_product[p]=historical_by_product.get(p,0)+1
          report={
              'state_sha256':hashlib.sha256(Path('/tmp/ghadir-audit/ghadir_data.json').read_bytes()).hexdigest(),
              'counts':{k:len(s.get(k,[])) if isinstance(s.get(k),list) else None for k in ['users','customers','orders','inventory','cartons','products']},
              'mysql_config_presence':mysql_keys,
              'i90_target_cartons':rows,
              'target_number_matches':expanded,
              'historical_exit':{'orders':historical_orders,'customers':historical_customers,'inventory_count':historical_inv_count,'by_product':historical_by_product}
          }
          Path('/tmp/ghadir-audit/audit-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: ghadir-pre-mysql-audit
          retention-days: 7
          path: |
            /tmp/ghadir-audit/audit-report.json
            /tmp/ghadir-audit/backup-ts.txt
